<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="noindex">
<title>My Page | PAP Magazine</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#000;color:#fff;min-height:100vh}
a{color:#fff;text-decoration:none}

.mp-back{position:fixed;top:28px;left:32px;font-size:11px;font-weight:600;letter-spacing:.1em;color:rgba(255,255,255,.3);transition:color .2s;cursor:pointer;background:none;border:none;font-family:'Montserrat',sans-serif;z-index:10}
.mp-back:hover{color:#fff}

.mp-wrapper{width:100%;max-width:520px;margin:0 auto;padding:80px 20px 60px}

/* AVATAR */
.mp-avatar{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;overflow:hidden;background:rgba(255,255,255,.04)}
.mp-avatar svg{width:32px;height:32px;stroke:rgba(255,255,255,.4);stroke-width:1.5;fill:none}
.mp-avatar img{width:100%;height:100%;object-fit:cover}

.mp-name{text-align:center;font-size:18px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.mp-email{text-align:center;font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.04em;margin-bottom:32px}

/* SECTIONS */
.mp-section{margin-bottom:28px}
.mp-section-title{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:14px}

.mp-card{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);padding:18px 20px;margin-bottom:10px;transition:border-color .3s}
.mp-card:hover{border-color:rgba(255,255,255,.2)}

.mp-row{display:flex;justify-content:space-between;align-items:center}
.mp-label{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.04em}
.mp-value{font-size:12px;font-weight:600;letter-spacing:.04em}

.mp-badge{display:inline-block;padding:3px 10px;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.15)}
.mp-badge.free{color:rgba(255,255,255,.5)}
.mp-badge.standard{color:#4dabf7;border-color:#4dabf7}
.mp-badge.premium{color:#ffd43b;border-color:#ffd43b}
.mp-badge.admin{color:#ff6b6b;border-color:#ff6b6b}
.mp-badge.pending{color:#ffd43b;border-color:rgba(255,212,59,.4)}
.mp-badge.approved{color:#51cf66;border-color:rgba(81,207,102,.4)}
.mp-badge.revision{color:#74c0fc;border-color:rgba(116,192,252,.4)}
.mp-badge.rejected{color:#ff6b6b;border-color:rgba(255,107,107,.4)}

/* SUBSCRIPTION STATUS CARD */
.mp-sub-card{border:1px solid rgba(255,255,255,.1);background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.01) 100%);padding:24px 22px;margin-bottom:10px}
.mp-sub-card.upgrade{border-color:rgba(255,212,59,.25);background:linear-gradient(135deg,rgba(255,212,59,.06) 0%,rgba(255,212,59,.01) 100%)}
.mp-sub-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mp-sub-plan-name{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.mp-sub-perks{display:flex;flex-direction:column;gap:6px;margin:14px 0 18px}
.mp-sub-perk{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.7);letter-spacing:.02em}
.mp-sub-perk svg{width:11px;height:11px;flex-shrink:0;stroke:#51cf66;stroke-width:2.5;fill:none}
.mp-sub-perk.locked{color:rgba(255,255,255,.3)}
.mp-sub-perk.locked svg{stroke:rgba(255,255,255,.2)}
.mp-sub-cta{display:block;text-align:center;padding:11px 16px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,212,59,.5);color:#ffd43b;background:rgba(255,212,59,.04);transition:all .3s}
.mp-sub-cta:hover{background:rgba(255,212,59,.12);color:#fff}
.mp-sub-cta.standard{border-color:rgba(77,171,247,.5);color:#4dabf7;background:rgba(77,171,247,.04)}
.mp-sub-cta.standard:hover{background:rgba(77,171,247,.12);color:#fff}
.mp-sub-manage{display:block;text-align:center;padding:9px 16px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1);transition:all .2s}
.mp-sub-manage:hover{color:#fff;border-color:rgba(255,255,255,.3)}

/* STATS GRID */
.mp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mp-stat{padding:14px 12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);text-align:center}
.mp-stat-num{font-size:22px;font-weight:800;letter-spacing:.02em;line-height:1.1;margin-bottom:4px}
.mp-stat-label{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4)}

/* SUBMISSION LIST */
.mp-sub-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);margin-bottom:6px;cursor:pointer;transition:all .2s}
.mp-sub-item:hover{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.04)}
.mp-sub-thumb{width:48px;height:48px;border-radius:3px;background:#0a0a0a;flex-shrink:0;background-size:cover;background-position:center}
.mp-sub-info{flex:1;min-width:0}
.mp-sub-title{font-size:12px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.mp-sub-date{font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.04em}
.mp-empty{padding:20px 14px;text-align:center;font-size:11px;color:rgba(255,255,255,.3);border:1px dashed rgba(255,255,255,.08)}

/* MENU ITEMS */
.mp-menu{display:flex;flex-direction:column;gap:2px}
.mp-menu-item{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);cursor:pointer;transition:all .3s;font-size:12px;font-weight:500;letter-spacing:.04em;color:rgba(255,255,255,.7)}
.mp-menu-item:hover{border-color:rgba(255,255,255,.2);color:#fff;background:rgba(255,255,255,.04)}
.mp-menu-item svg{width:16px;height:16px;stroke:rgba(255,255,255,.3);stroke-width:2;fill:none}
.mp-menu-item.danger{color:#ff6b6b}
.mp-menu-item.danger:hover{border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.04)}

/* LANG */
.mp-lang{position:fixed;top:28px;right:32px;z-index:10}
.mp-lang select{background:transparent;color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.12);padding:5px 10px;font-size:10px;font-family:'Montserrat',sans-serif;letter-spacing:.1em;cursor:pointer}
.mp-lang select option{background:#000;color:#fff}

@media(max-width:500px){
  .mp-wrapper{padding:70px 16px 40px}
  .mp-back{top:20px;left:16px}
  .mp-stat-num{font-size:20px}
}
</style>

<a href="/" class="mp-back">← 돌아가기</a>

<div class="mp-lang">
  <select id="langSelect" onchange="setLang(this.value)">
    <option value="ko">KO</option>
    <option value="en">EN</option>
    <option value="it">IT</option>
    <option value="fr">FR</option>
    <option value="es">ES</option>
    <option value="ja">JA</option>
    <option value="zh">ZH</option>
    <option value="ru">RU</option>
    <option value="de">Deutsch</option>
  </select>
</div>

<div class="mp-wrapper">
  <!-- AVATAR + NAME -->
  <div class="mp-avatar" id="mpAvatar">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  </div>
  <div class="mp-name" id="mpName">—</div>
  <div class="mp-email" id="mpEmail">—</div>

  <!-- SUBSCRIPTION STATUS (built dynamically by renderSubscriptionCard) -->
  <div class="mp-section">
    <div class="mp-section-title" data-i18n="sectionPlan">구독</div>
    <div id="mpSubCard"></div>
  </div>

  <!-- ACTIVITY STATS -->
  <div class="mp-section">
    <div class="mp-section-title" data-i18n="sectionActivity">활동</div>
    <div class="mp-stats">
      <div class="mp-stat">
        <div class="mp-stat-num" id="mpStatSubs">—</div>
        <div class="mp-stat-label" data-i18n="statSubs">서브미션</div>
      </div>
      <div class="mp-stat">
        <div class="mp-stat-num" id="mpStatComments">—</div>
        <div class="mp-stat-label" data-i18n="statComments">댓글</div>
      </div>
      <div class="mp-stat">
        <div class="mp-stat-num" id="mpStatRatings">—</div>
        <div class="mp-stat-label" data-i18n="statRatings">별점</div>
      </div>
    </div>
  </div>

  <!-- RECENT SUBMISSIONS -->
  <div class="mp-section">
    <div class="mp-section-title" data-i18n="sectionRecent">최근 서브미션</div>
    <div id="mpRecentSubs">
      <div class="mp-empty" data-i18n="loading">불러오는 중...</div>
    </div>
  </div>

  <!-- ACCOUNT INFO -->
  <div class="mp-section">
    <div class="mp-section-title" data-i18n="sectionAccount">계정 정보</div>
    <div class="mp-card">
      <div class="mp-row">
        <span class="mp-label" data-i18n="labelRole">역할</span>
        <span class="mp-badge" id="mpRole">—</span>
      </div>
    </div>
  </div>

  <!-- MENU -->
  <div class="mp-section">
    <div class="mp-section-title" data-i18n="sectionMenu">메뉴</div>
    <div class="mp-menu">
      <a href="submission.html" class="mp-menu-item">
        <span data-i18n="menuSubmission">작품 제출</span>
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
      <a href="pullletter.html" class="mp-menu-item">
        <span data-i18n="menuPullletter">Pull-Letter</span>
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
      <a href="community.html" class="mp-menu-item">
        <span data-i18n="menuCommunity">커뮤니티</span>
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
      <a href="subscribe.html" class="mp-menu-item">
        <span data-i18n="menuSubscribe">구독 관리</span>
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
      <div class="mp-menu-item" id="mpAdminLink" style="display:none">
        <a href="admin.html" style="color:inherit;display:flex;justify-content:space-between;align-items:center;width:100%">
          <span data-i18n="menuAdmin">관리자 페이지</span>
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:rgba(255,255,255,.3);stroke-width:2;fill:none"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
      </div>
    </div>
  </div>

  <!-- LOGOUT -->
  <div class="mp-section">
    <div class="mp-menu">
      <div class="mp-menu-item danger" onclick="doLogout()" data-i18n="menuLogout">로그아웃</div>
    </div>
  </div>
</div>

var _t = LANG.ko;
var _user = null;
var _supabase = null;
function setLang(l) {
  localStorage.setItem('pap-lang', l);
  _t = LANG[l] || LANG.ko;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k = el.getAttribute('data-i18n');
    if (_t[k]) el.textContent = _t[k];
  });
  document.getElementById('langSelect').value = l;
  if (_user) { renderSubscriptionCard(_user); loadRecentSubmissions(); }
}
function initSupabase(){
  if (_supabase) return _supabase;
  try{
    if (typeof supabase !== 'undefined' && supabase.createClient) {
      _supabase = supabase.createClient('https://igcazquhkwxtqsaqpznx.supabase.co','sb_publishable_8Q19ICgnEqkrjH2hPvwgbA_9pSVDh55',{auth:{persistSession:false}});
    }
  }catch(e){}
  return _supabase;
}
function renderSubscriptionCard(user){
  var plan = user.subscription || 'free';
  var card = document.getElementById('mpSubCard');
  if (!card) return;
  function perk(active, label){ return '<div class="mp-sub-perk' + (active ? '' : ' locked') + '"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span>' + label + '</span></div>'; }
  var html = '';
  if (plan === 'premium') {
    html += '<div class="mp-sub-card"><div class="mp-sub-head"><span class="mp-sub-plan-name">PREMIUM</span><span class="mp-badge premium">' + _t.planPremium + '</span></div><div class="mp-sub-perks">' + perk(true, _t.perkAdsFree) + perk(true, _t.perkArchiveFull) + perk(true, _t.perkFeedback) + perk(true, _t.perkLogo) + perk(true, _t.perkPullletter) + '</div><a class="mp-sub-manage" href="subscribe.html">' + _t.manage + '</a></div>';
  } else if (plan === 'standard') {
    html += '<div class="mp-sub-card"><div class="mp-sub-head"><span class="mp-sub-plan-name">STANDARD</span><span class="mp-badge standard">' + _t.planStandard + '</span></div><div class="mp-sub-perks">' + perk(true, _t.perkAdsFree) + perk(true, _t.perkArchive100) + perk(true, _t.perkFeedback) + perk(true, _t.perkLogo) + perk(false, _t.perkArchiveFull) + perk(false, _t.perkPullletter) + '</div><a class="mp-sub-cta" href="subscribe.html">' + _t.upgradeTitlePrm + ' →</a></div>';
  } else {
    html += '<div class="mp-sub-card upgrade"><div class="mp-sub-head"><span class="mp-sub-plan-name">' + _t.upgradeBadge + '</span><span class="mp-badge free">' + _t.planFree + '</span></div><div class="mp-sub-perks">' + perk(false, _t.perkAdsFree) + perk(false, _t.perkArchive100) + perk(false, _t.perkArchiveFull) + perk(false, _t.perkFeedback) + perk(false, _t.perkPullletter) + '</div><a class="mp-sub-cta" href="subscribe.html">' + _t.upgradeTitleStd + ' →</a></div>';
  }
  card.innerHTML = html;
}
function loadActivityStats(user){
  var token = localStorage.getItem('pap-token');
  fetch('/api/submissions/mine', { headers:{'Authorization':'Bearer ' + token} })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ document.getElementById('mpStatSubs').textContent = (j&&j.submissions&&j.submissions.length)||0; })
    .catch(function(){ document.getElementById('mpStatSubs').textContent = '0'; });
  var sb = initSupabase();
  if (!sb) { document.getElementById('mpStatComments').textContent = '0'; document.getElementById('mpStatRatings').textContent = '0'; return; }
  sb.from('comments').select('id', {count:'exact', head:true}).eq('user_id', user.id).then(function(res){ document.getElementById('mpStatComments').textContent = res.count || 0; }).catch(function(){ document.getElementById('mpStatComments').textContent = '0'; });
  sb.from('ratings').select('user_id', {count:'exact', head:true}).eq('user_id', user.id).then(function(res){ document.getElementById('mpStatRatings').textContent = res.count || 0; }).catch(function(){ document.getElementById('mpStatRatings').textContent = '0'; });
}
function _statusBadge(status){
  var key = 'status' + (status ? status.charAt(0).toUpperCase() + status.slice(1) : 'Pending');
  var label = _t[key] || status || '';
  var cls = ({approved:'approved', revision:'revision', rejected:'rejected'})[status] || 'pending';
  return '<span class="mp-badge ' + cls + '">' + label + '</span>';
}
function _formatDate(dt){
  if (!dt) return '';
  try { return new Date(dt).toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'}); } catch(e){ return ''; }
}
function loadRecentSubmissions(){
  var token = localStorage.getItem('pap-token');
  var box = document.getElementById('mpRecentSubs');
  fetch('/api/submissions/mine', { headers:{'Authorization':'Bearer ' + token} })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var subs = (j && j.submissions) || [];
      if (!subs.length) { box.innerHTML = '<div class="mp-empty">' + _t.emptySubs + '</div>'; return; }
      var top = subs.slice(0, 3);
      var html = '';
      top.forEach(function(s){
        var thumb = '';
        if (Array.isArray(s.images) && s.images.length) thumb = s.images[0];
        else if (typeof s.image_urls === 'string' && s.image_urls) thumb = s.image_urls.split(',')[0];
        var thumbStyle = thumb ? 'background-image:url(' + JSON.stringify(thumb).slice(1,-1) + ')' : '';
        var title = s.title || s.editorial_title || _t.statSubs;
        html += '<div class="mp-sub-item" onclick="window.location.href=\'submission.html?revise=' + encodeURIComponent(s.id || '') + '\'"><div class="mp-sub-thumb" style="' + thumbStyle + '"></div><div class="mp-sub-info"><div class="mp-sub-title">' + (title.replace(/</g,'&lt;')) + '</div><div class="mp-sub-date">' + _formatDate(s.created_at) + '</div></div>' + _statusBadge(s.status) + '</div>';
      });
      if (subs.length > 3) { html += '<a href="submission.html#mine" style="display:block;text-align:center;margin-top:10px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5)">' + _t.viewAll + '</a>'; }
      box.innerHTML = html;
    })
    .catch(function(){ box.innerHTML = '<div class="mp-empty">' + _t.emptySubs + '</div>'; });
}
function loadProfile(){
  var userStr = localStorage.getItem('pap-user');
  var token = localStorage.getItem('pap-token');
  if (!token || !userStr) { window.location.href = (window.papLoginUrl ? window.papLoginUrl('auth.html?mode=login') : 'auth.html?mode=login'); return; }
  try {
    _user = JSON.parse(userStr);
    document.getElementById('mpName').textContent = _user.name || _user.email || '—';
    document.getElementById('mpEmail').textContent = _user.email || '';
    var roleEl = document.getElementById('mpRole');
    var role = _user.role || 'member';
    roleEl.textContent = _t['role' + role.charAt(0).toUpperCase() + role.slice(1)] || role;
    roleEl.className = 'mp-badge';
    if (role === 'admin') roleEl.classList.add('admin');
    if (role === 'admin') document.getElementById('mpAdminLink').style.display = 'block';
    renderSubscriptionCard(_user);
    loadActivityStats(_user);
    loadRecentSubmissions();
  } catch(e) { window.location.href = (window.papLoginUrl ? window.papLoginUrl('auth.html?mode=login') : 'auth.html?mode=login'); }
}
function doLogout() { localStorage.removeItem('pap-token'); localStorage.removeItem('pap-user'); window.location.href = '/'; }
(function(){
  var saved = localStorage.getItem('pap-lang') || 'ko';
  _t = LANG[saved] || LANG.ko;
  document.querySelectorAll('[data-i18n]').forEach(function(el){ var k = el.getAttribute('data-i18n'); if (_t[k]) el.textContent = _t[k]; });
  document.getElementById('langSelect').value = saved;
  loadProfile();
})();
