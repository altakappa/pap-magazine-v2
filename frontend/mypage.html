<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#000;color:#fff;min-height:100vh}
a{color:#fff;text-decoration:none}

/* QA #92 — mypage internal sidebar nav */
.mp-sidebar{position:fixed;left:0;top:0;width:220px;height:100vh;z-index:5;border-right:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:90px 0 28px;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mp-sidebar::-webkit-scrollbar{width:4px}
.mp-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08)}
.mp-side-nav{display:flex;flex-direction:column;flex:1}
.mp-side-group{display:flex;flex-direction:column;padding:0 28px 18px}
.mp-side-group-title{font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:10px}
.mp-side-link{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);padding:9px 0 9px 12px;margin-left:-12px;border-left:2px solid transparent;transition:color .2s,border-color .2s,background .2s;cursor:pointer}
.mp-side-link:hover{color:#fff}
.mp-side-link.active{color:#fff;border-left-color:#fff}
.mp-side-link.danger{color:rgba(255,107,107,.65)}
.mp-side-link.danger:hover{color:#ff6b6b}
.mp-side-spacer{flex:1;min-height:8px}
.mp-side-divider{height:1px;background:rgba(255,255,255,.06);margin:0 28px 18px}
.mp-back{font-size:11px;font-weight:600;letter-spacing:.1em;color:rgba(255,255,255,.3);transition:color .2s;cursor:pointer;background:none;border:none;font-family:'Montserrat',sans-serif;display:block;padding:0 28px 24px;text-align:left}
.mp-back:hover{color:#fff}

.mp-wrapper{width:100%;max-width:520px;margin:0 auto;padding:80px 20px 60px;scroll-behavior:smooth}
/* Each anchor target gets a small top offset so smooth-scroll doesn't tuck
   the heading under the global fixed header when the user clicks a sidebar
   item. */
#mp-profile,#mp-subscription,#mp-activity,#mp-contributions,#mp-submissions,#mp-downloads,#mp-account{scroll-margin-top:28px}

/* AVATAR */
.mp-avatar{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;overflow:hidden;background:rgba(255,255,255,.04)}
.mp-avatar svg{width:32px;height:32px;stroke:rgba(255,255,255,.4);stroke-width:1.5;fill:none}
.mp-avatar img{width:100%;height:100%;object-fit:cover}

.mp-name{text-align:center;font-size:18px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.mp-email{text-align:center;font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.04em;margin-bottom:32px}

/* SECTIONS */
.mp-section{margin-bottom:28px}
.mp-section-title{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:14px}

.mp-card{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);padding:18px 20px;margin-bottom:10px;transition:border-color .3s}
.mp-card:hover{border-color:rgba(255,255,255,.2)}

.mp-row{display:flex;justify-content:space-between;align-items:center}
.mp-label{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.04em}
.mp-value{font-size:12px;font-weight:600;letter-spacing:.04em}

.mp-badge{display:inline-block;padding:3px 10px;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.15)}
.mp-badge.free{color:rgba(255,255,255,.5)}
.mp-badge.standard{color:#4dabf7;border-color:#4dabf7}
.mp-badge.premium{color:#ffd43b;border-color:#ffd43b}
.mp-badge.admin{color:#ff6b6b;border-color:#ff6b6b}
.mp-badge.pending{color:#ffd43b;border-color:rgba(255,212,59,.4)}
.mp-badge.approved{color:#51cf66;border-color:rgba(81,207,102,.4)}
.mp-badge.revision{color:#74c0fc;border-color:rgba(116,192,252,.4)}
.mp-badge.rejected{color:#ff6b6b;border-color:rgba(255,107,107,.4)}

/* SUBSCRIPTION STATUS CARD */
.mp-sub-card{border:1px solid rgba(255,255,255,.1);background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.01) 100%);padding:24px 22px;margin-bottom:10px}
.mp-sub-card.upgrade{border-color:rgba(255,212,59,.25);background:linear-gradient(135deg,rgba(255,212,59,.06) 0%,rgba(255,212,59,.01) 100%)}
.mp-sub-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mp-sub-plan-name{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.mp-sub-perks{display:flex;flex-direction:column;gap:6px;margin:14px 0 18px}
.mp-sub-perk{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.7);letter-spacing:.02em}
.mp-sub-perk svg{width:11px;height:11px;flex-shrink:0;stroke:#51cf66;stroke-width:2.5;fill:none}
.mp-sub-perk.locked{color:rgba(255,255,255,.3)}
.mp-sub-perk.locked svg{stroke:rgba(255,255,255,.2)}
.mp-sub-cta{display:block;text-align:center;padding:11px 16px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,212,59,.5);color:#ffd43b;background:rgba(255,212,59,.04);transition:all .3s}
.mp-sub-cta:hover{background:rgba(255,212,59,.12);color:#fff}
.mp-sub-cta.standard{border-color:rgba(77,171,247,.5);color:#4dabf7;background:rgba(77,171,247,.04)}
.mp-sub-cta.standard:hover{background:rgba(77,171,247,.12);color:#fff}
.mp-sub-manage{display:block;text-align:center;padding:9px 16px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1);transition:all .2s}
.mp-sub-manage:hover{color:#fff;border-color:rgba(255,255,255,.3)}

/* STATS GRID */
.mp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mp-stat{padding:14px 12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);text-align:center}
.mp-stat-num{font-size:22px;font-weight:800;letter-spacing:.02em;line-height:1.1;margin-bottom:4px}
.mp-stat-label{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4)}

/* SUBMISSION LIST */
.mp-sub-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);margin-bottom:6px;cursor:pointer;transition:all .2s}
.mp-sub-item:hover{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.04)}
.mp-sub-thumb{width:48px;height:48px;border-radius:3px;background:#0a0a0a;flex-shrink:0;background-size:cover;background-position:center}
.mp-sub-info{flex:1;min-width:0}
.mp-sub-title{font-size:12px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.mp-sub-date{font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.04em}
.mp-empty{padding:20px 14px;text-align:center;font-size:11px;color:rgba(255,255,255,.3);border:1px dashed rgba(255,255,255,.08)}

/* MENU ITEMS */
.mp-menu{display:flex;flex-direction:column;gap:2px}
.mp-menu-item{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);cursor:pointer;transition:all .3s;font-size:12px;font-weight:500;letter-spacing:.04em;color:rgba(255,255,255,.7)}
.mp-menu-item:hover{border-color:rgba(255,255,255,.2);color:#fff;background:rgba(255,255,255,.04)}
.mp-menu-item svg{width:16px;height:16px;stroke:rgba(255,255,255,.3);stroke-width:2;fill:none}
.mp-menu-item.danger{color:#ff6b6b}
.mp-menu-item.danger:hover{border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.04)}

/* LANG */
.mp-lang{position:fixed;top:28px;right:32px;z-index:10}
.mp-lang select{background:transparent;color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.12);padding:5px 10px;font-size:10px;font-family:'Montserrat',sans-serif;letter-spacing:.1em;cursor:pointer}
.mp-lang select option{background:#000;color:#fff}

/* Desktop: push wrapper right of fixed sidebar but keep it horizontally
   centered within the remaining viewport area (so the card stack still
   looks balanced). body padding-left is the cleanest way to do this
   without forking margin rules on .mp-wrapper. */
@media(min-width:901px){
  body{padding-left:220px}
}
/* Tablet & mobile: collapse sidebar into a horizontal scrollable bar
   pinned to the top of the page. Same links, same active state, just
   laid out on the X axis. */
@media(max-width:900px){
  .mp-sidebar{position:relative;width:100%;height:auto;padding:64px 12px 12px;border-right:none;border-bottom:1px solid rgba(255,255,255,.08);overflow-x:auto;overflow-y:hidden;background:rgba(0,0,0,.6)}
  .mp-side-nav{flex-direction:row;flex-wrap:nowrap;gap:0;align-items:center}
  .mp-side-group{flex-direction:row;padding:0 4px;align-items:center;gap:0;flex-shrink:0}
  .mp-side-group-title{display:none}
  .mp-side-link{padding:6px 12px;margin:0;border-left:none;border-bottom:2px solid transparent;white-space:nowrap}
  .mp-side-link.active{border-left-color:transparent;border-bottom-color:#fff}
  .mp-side-spacer{display:none}
  .mp-side-divider{width:1px;height:18px;margin:0 8px;flex-shrink:0}
  .mp-back{padding:0 16px 0 0;flex-shrink:0}
}
@media(max-width:500px){
  .mp-wrapper{padding:24px 16px 40px}
  .mp-stat-num{font-size:20px}
}
</style>

<div class="mp-lang">

    <option value="ru">RU</option>
    <option value="de">Deutsch</option>
  </select>
</div>

<div class="mp-wrapper">
  <!-- PROFILE (avatar + name + email) -->
  <section id="mp-profile">
    <div class="mp-avatar" id="mpAvatar">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div class="mp-name" id="mpName">—</div>
    <div class="mp-email" id="mpEmail">—</div>
  </section>

  <!-- SUBSCRIPTION STATUS (built dynamically by renderSubscriptionCard) -->
  <section class="mp-section" id="mp-subscription">
    <div class="mp-section-title" data-i18n="sectionPlan">구독</div>
    <div id="mpSubCard"></div>
  </section>

  <!-- ACTIVITY STATS -->
  <section class="mp-section" id="mp-activity">
    <div class="mp-section-title" data-i18n="sectionActivity">활동</div>
    <div class="mp-stats">
      <div class="mp-stat">
        <div class="mp-stat-num" id="mpStatSubs">—</div>
        <div class="mp-stat-label" data-i18n="statSubs">서브미션</div>
      </div>
      <div class="mp-stat">
        <div class="mp-stat-num" id="mpStatComments">—</div>
        <div class="mp-stat-label" data-i18n="statComments">댓글</div>
      </div>
      <div class="mp-stat">
        <div class="mp-stat-num" id="mpStatRatings">—</div>
        <div class="mp-stat-label" data-i18n="statRatings">별점</div>
      </div>
    </div>
  </section>

  <!-- ── QA #83: 4 content sections (now also serve as sidebar anchors) ── -->

  <!-- 1. 내가 참여한 작품 (My Contributions) -->
  <section class="mp-section" id="mp-contributions">
    <div class="mp-section-title" data-i18n="sectionContributions">내가 참여한 작품</div>
    <div id="mpContributionsList">
      <div class="mp-empty" data-i18n="contribComing">곧 출시 — 크레딧에 등록된 인스타그램 핸들과 매칭하여 본인이 참여한 에디토리얼이 표시됩니다</div>
    </div>
  </section>

  <!-- 2. 내가 업로드한 작품 (My Submissions) -->
  <section class="mp-section" id="mp-submissions">
    <div class="mp-section-title" data-i18n="sectionUploads">내가 업로드한 작품</div>
    <div id="mpRecentSubs">
      <div class="mp-empty" data-i18n="loading">불러오는 중...</div>
    </div>
  </section>

  <!-- 3. 다운로드 가능 파일 (Downloadable Files) -->
  <section class="mp-section" id="mp-downloads">
    <div class="mp-section-title" data-i18n="sectionDownloads">다운로드 가능 파일</div>
    <div id="mpDownloadsList">
      <div class="mp-empty" data-i18n="loading">불러오는 중...</div>
    </div>

  <!-- ACCOUNT INFO -->
  <section class="mp-section" id="mp-account">
    <div class="mp-section-title" data-i18n="sectionAccount">계정 정보</div>
    <div class="mp-card">

        <span class="mp-label" data-i18n="labelRole">역할</span>
        <span class="mp-badge" id="mpRole">—</span>
      </div>
    </div>
  </section>

  <!-- QA #92 — submission/pullletter/community/subscribe links and the
       admin entry + logout used to live here in a duplicated body menu.
       They've moved to the unified left sidebar (and the global hamburger)
       so users get one consistent navigation surface. -->
</div>

var _t = LANG.ko;       // current dictionary
var _user = null;        // current user
var _supabase = null;    // supabase anon client

function setLang(l) {
  localStorage.setItem('pap-lang', l);
  _t = LANG[l] || LANG.ko;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k = el.getAttribute('data-i18n');
    if (_t[k]) el.textContent = _t[k];
  });
  document.getElementById('langSelect').value = l;
  // Re-render dynamic sections that include translated copy
  if (_user) {
    renderSubscriptionCard(_user);
    loadRecentSubmissions();
    renderDownloads(_user);
  }
}

function initSupabase(){
  if (_supabase) return _supabase;
  try{
    if (typeof supabase !== 'undefined' && supabase.createClient) {
      _supabase = supabase.createClient(
        'https://igcazquhkwxtqsaqpznx.supabase.co',
        'sb_publishable_8Q19ICgnEqkrjH2hPvwgbA_9pSVDh55',
        { auth:{ persistSession:false } }
      );
    }
  }catch(e){}
  return _supabase;
}

// ───── Subscription card ─────
function renderSubscriptionCard(user){
  var plan = user.subscription || 'free';
  var isFree = plan === 'free';
  var card = document.getElementById('mpSubCard');
  if (!card) return;

  // Helper to render a perk row
  function perk(active, label){
    return '<div class="mp-sub-perk' + (active ? '' : ' locked') + '">' +
      '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>' +
      '<span>' + label + '</span>' +
    '</div>';
  }

  var html = '';
  if (plan === 'premium') {
    html += '<div class="mp-sub-card">' +
      '<div class="mp-sub-head"><span class="mp-sub-plan-name">PREMIUM</span><span class="mp-badge premium">' + _t.planPremium + '</span></div>' +
      '<div class="mp-sub-perks">' +
        perk(true, _t.perkAdsFree) +
        perk(true, _t.perkArchiveFull) +
        perk(true, _t.perkFeedback) +
        perk(true, _t.perkLogo) +
        perk(true, _t.perkPullletter) +
      '</div>' +
      '<a class="mp-sub-manage" href="subscribe.html">' + _t.manage + '</a>' +
    '</div>';
  } else if (plan === 'standard') {
    html += '<div class="mp-sub-card">' +
      '<div class="mp-sub-head"><span class="mp-sub-plan-name">STANDARD</span><span class="mp-badge standard">' + _t.planStandard + '</span></div>' +
      '<div class="mp-sub-perks">' +
        perk(true, _t.perkAdsFree) +
        perk(true, _t.perkArchive100) +
        perk(true, _t.perkFeedback) +
        perk(true, _t.perkLogo) +
        perk(false, _t.perkArchiveFull) +
        perk(false, _t.perkPullletter) +
      '</div>' +
      '<a class="mp-sub-cta" href="subscribe.html">' + _t.upgradeTitlePrm + ' →</a>' +
    '</div>';
  } else {
    // Free → strongest upgrade CTA
    html += '<div class="mp-sub-card upgrade">' +
      '<div class="mp-sub-head"><span class="mp-sub-plan-name">' + _t.upgradeBadge + '</span><span class="mp-badge free">' + _t.planFree + '</span></div>' +
      '<div class="mp-sub-perks">' +
        perk(false, _t.perkAdsFree) +
        perk(false, _t.perkArchive100) +
        perk(false, _t.perkArchiveFull) +
        perk(false, _t.perkFeedback) +
        perk(false, _t.perkPullletter) +
      '</div>' +
      '<a class="mp-sub-cta" href="subscribe.html">' + _t.upgradeTitleStd + ' →</a>' +
    '</div>';
  }
  card.innerHTML = html;
}

// ───── Activity stats (parallel fetch) ─────
function loadActivityStats(user){
  var token = localStorage.getItem('pap-token');
  var headers = { 'Authorization':'Bearer ' + token };

  // 1) submissions count
  fetch('/api/submissions/mine', { headers: headers })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var n = (j && j.submissions && j.submissions.length) || 0;
      document.getElementById('mpStatSubs').textContent = n;
    })
    .catch(function(){ document.getElementById('mpStatSubs').textContent = '0'; });

  // 2) comments + ratings via Supabase anon
  var sb = initSupabase();
  if (!sb) {
    document.getElementById('mpStatComments').textContent = '0';
    document.getElementById('mpStatRatings').textContent = '0';
    return;
  }
  sb.from('comments').select('id', { count:'exact', head:true }).eq('user_id', user.id)
    .then(function(res){
      document.getElementById('mpStatComments').textContent = res.count || 0;
    }).catch(function(){ document.getElementById('mpStatComments').textContent = '0'; });
  sb.from('ratings').select('user_id', { count:'exact', head:true }).eq('user_id', user.id)
    .then(function(res){
      document.getElementById('mpStatRatings').textContent = res.count || 0;
    }).catch(function(){ document.getElementById('mpStatRatings').textContent = '0'; });
}

// ───── Recent submissions list ─────
function _statusBadge(status){
  var key = 'status' + (status ? status.charAt(0).toUpperCase() + status.slice(1) : 'Pending');
  var label = _t[key] || status || '';
  var cls = ({approved:'approved', revision:'revision', rejected:'rejected'})[status] || 'pending';
  return '<span class="mp-badge ' + cls + '">' + label + '</span>';
}

function _formatDate(dt){
  if (!dt) return '';
  try {
    var d = new Date(dt);
    return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
  } catch(e){ return ''; }
}

function loadRecentSubmissions(){
  var token = localStorage.getItem('pap-token');
  var box = document.getElementById('mpRecentSubs');
  fetch('/api/submissions/mine', { headers:{ 'Authorization':'Bearer ' + token } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      var subs = (j && j.submissions) || [];
      if (!subs.length) {
        box.innerHTML = '<div class="mp-empty">' + _t.emptySubs + '</div>';
        return;
      }
      var top = subs.slice(0, 3);
      var html = '';
      top.forEach(function(s){
        // Best-effort thumb: use first image if available
        var thumb = '';
        if (Array.isArray(s.images) && s.images.length) thumb = s.images[0];
        else if (typeof s.image_urls === 'string' && s.image_urls) thumb = s.image_urls.split(',')[0];
        var thumbStyle = thumb ? 'background-image:url(' + JSON.stringify(thumb).slice(1,-1) + ')' : '';
        var title = s.title || s.editorial_title || _t.statSubs;
        html += '<div class="mp-sub-item" onclick="window.location.href=\'submission.html?revise=' + encodeURIComponent(s.id || '') + '\'">' +
          '<div class="mp-sub-thumb" style="' + thumbStyle + '"></div>' +
          '<div class="mp-sub-info">' +
            '<div class="mp-sub-title">' + (title.replace(/</g,'&lt;')) + '</div>' +
            '<div class="mp-sub-date">' + _formatDate(s.created_at) + '</div>' +
          '</div>' +
          _statusBadge(s.status) +
        '</div>';
      });
      if (subs.length > 3) {
        html += '<a href="submission.html#mine" style="display:block;text-align:center;margin-top:10px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5)">' + _t.viewAll + '</a>';
      }
      box.innerHTML = html;
    })
    .catch(function(){
      box.innerHTML = '<div class="mp-empty">' + _t.emptySubs + '</div>';
    });
}

// ───── Downloadable files (QA #83) ─────
// Logo / distribution kits live on Google Drive — Drive's own permission
// model is the authoritative gate. This list mirrors the access policy
// on the client: premium / admin users see the full list of editorials
// that have a distribution folder; everyone else sees an upgrade CTA.
//
// Future: filter by user.contributorOf so only editorials the user
// actually participated in are surfaced. The UI is already structured
// for that — the data source just needs to switch from PAP_LOGO_FOLDERS
// to a /api/users/me/contributions endpoint.
function renderDownloads(user){
  var box = document.getElementById('mpDownloadsList');
  if (!box) return;
  var role = (user && user.role) || 'member';
  var plan = (user && user.subscription) || 'free';
  var canAccess = role === 'admin' || plan === 'premium' || plan === 'standard';
  if (!canAccess) {
    box.innerHTML = '<div class="mp-locked-card">' +
      '<div class="mp-locked-card-msg">' + _t.downloadsLocked + '</div>' +
      '<a class="mp-locked-cta" href="subscribe.html">' + _t.upgradeTitleStd + ' →</a>' +
    '</div>';
    return;
  }
  var folders = (typeof window !== 'undefined' && window.PAP_LOGO_FOLDERS) || {};
  var titles = Object.keys(folders).sort(function(a,b){
    return a.toLowerCase().localeCompare(b.toLowerCase());
  });
  if (!titles.length) {
    box.innerHTML = '<div class="mp-empty">' + _t.downloadsEmpty + '</div>';
    return;
  }
  var html = '<div class="mp-dl-list">';
  titles.forEach(function(t){
    var fid = folders[t];
    var safe = t.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html += '<div class="mp-dl-item">' +
      '<div class="mp-dl-title">' + safe + '</div>' +
      '<a class="mp-dl-btn" href="https://drive.google.com/drive/folders/' + encodeURIComponent(fid) +
        '" target="_blank" rel="noopener">' + _t.downloadOpen + '</a>' +
    '</div>';
  });
  html += '</div>';
  box.innerHTML = html;
}

// ───── Profile loader ─────
function loadProfile(){
  var userStr = localStorage.getItem('pap-user');
  var token = localStorage.getItem('pap-token');

  if (!token || !userStr) {
    window.location.href = (window.papLoginUrl ? window.papLoginUrl('auth.html?mode=login') : 'auth.html?mode=login');
    return;
  }

  try {
    _user = JSON.parse(userStr);
    document.getElementById('mpName').textContent = _user.name || _user.email || '—';
    document.getElementById('mpEmail').textContent = _user.email || '';

    // Role badge
    var roleEl = document.getElementById('mpRole');
    var role = _user.role || 'member';
    roleEl.textContent = _t['role' + role.charAt(0).toUpperCase() + role.slice(1)] || role;
    roleEl.className = 'mp-badge';
    if (role === 'admin') roleEl.classList.add('admin');

    // Show admin sidebar group only for admins
    if (role === 'admin') {
      var adminGroup = document.getElementById('mpSideAdminGroup');
      if (adminGroup) adminGroup.style.display = 'flex';
    }

    // Render dynamic sections
    renderSubscriptionCard(_user);
    loadActivityStats(_user);
    loadRecentSubmissions();
    renderDownloads(_user);
  } catch(e) {
    window.location.href = (window.papLoginUrl ? window.papLoginUrl('auth.html?mode=login') : 'auth.html?mode=login');
  }
}
function doLogout() { localStorage.removeItem('pap-token'); localStorage.removeItem('pap-user'); window.location.href = '/'; }

// QA #92 — sidebar interactions: smooth scroll on click + active section
// highlighting via IntersectionObserver. We compute ids from each link's
// href so adding/removing sections later just means editing the markup.
function setupMpSidebar(){
  var links = document.querySelectorAll('.mp-side-link[href^="#"]');
  if(!links.length) return;
  var bySectionId = {};
  links.forEach(function(a){
    var id = a.getAttribute('href').slice(1);
    var sec = id ? document.getElementById(id) : null;
    if(sec) bySectionId[id] = a;
    a.addEventListener('click', function(e){
      var target = sec || document.getElementById(a.getAttribute('href').slice(1));
      if(!target) return;
      e.preventDefault();
      target.scrollIntoView({behavior:'smooth',block:'start'});
      // Reflect the click in the URL so refresh / back-button preserves
      // the user's section, but don't trigger another scroll.
      try { history.replaceState(null,'','#'+a.getAttribute('href').slice(1)); } catch(_){}
    });
  });
  if(typeof IntersectionObserver==='undefined') return;
  // rootMargin biases the "active" zone to the upper third of the
  // viewport — feels natural when the user is reading top-to-bottom.
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(!entry.isIntersecting) return;
      var link = bySectionId[entry.target.id];
      if(!link) return;
      links.forEach(function(a){ a.classList.remove('active'); });
      link.classList.add('active');
    });
  }, { rootMargin:'-20% 0px -60% 0px', threshold:0 });
  Object.keys(bySectionId).forEach(function(id){
    var sec=document.getElementById(id);
    if(sec) io.observe(sec);
  });
}
(function(){
  var saved = localStorage.getItem('pap-lang') || 'ko';
  _t = LANG[saved] || LANG.ko;
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k = el.getAttribute('data-i18n');
    if (_t[k]) el.textContent = _t[k];
  });
  document.getElementById('langSelect').value = saved;
  loadProfile();
  setupMpSidebar();
})();
