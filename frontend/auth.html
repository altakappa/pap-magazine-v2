<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
a{color:#fff;text-decoration:none}

.auth-wrapper{width:100%;max-width:440px;padding:20px}
.auth-logo{text-align:center;margin-bottom:40px}
.auth-logo a{display:inline-block}
.auth-logo img{height:48px;width:auto}

/* TABS */
.auth-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:32px}
.auth-tab{flex:1;text-align:center;padding:14px 0;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.3);cursor:pointer;border-bottom:2px solid transparent;transition:all .3s}
.auth-tab:hover{color:rgba(255,255,255,.6)}
.auth-tab.active{color:#fff;border-bottom-color:#fff}

/* PANELS */
.auth-panel{display:none}
.auth-panel.active{display:block}

/* SOCIAL BUTTONS */
.social-btns{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.social-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;font-size:12px;font-weight:600;letter-spacing:.05em;border:1px solid rgba(255,255,255,.15);background:transparent;color:#fff;cursor:pointer;font-family:'Montserrat',sans-serif;transition:all .3s}
.social-btn:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.3)}
.social-btn svg{width:18px;height:18px;flex-shrink:0}

/* DIVIDER */
.divider{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.divider-line{flex:1;height:1px;background:rgba(255,255,255,.1)}
.divider-text{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.2)}

/* FORM */
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:8px}
.form-input{width:100%;background:transparent;border:1px solid rgba(255,255,255,.15);padding:13px 16px;font-size:13px;font-family:'Montserrat',sans-serif;color:#fff;outline:none;transition:border-color .3s}
.form-input:focus{border-color:rgba(255,255,255,.5)}
.form-input::placeholder{color:rgba(255,255,255,.2)}
.form-select{width:100%;background:transparent;border:1px solid rgba(255,255,255,.15);padding:13px 16px;font-size:13px;font-family:'Montserrat',sans-serif;color:#fff;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;transition:border-color .3s}
.form-select:focus{border-color:rgba(255,255,255,.5)}
.form-select option{background:#111;color:#fff}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-hint{font-size:10px;color:rgba(255,255,255,.2);margin-top:4px}

/* SUBMIT */
.auth-btn{width:100%;padding:14px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;background:#fff;color:#000;border:1.5px solid #fff;cursor:pointer;font-family:'Montserrat',sans-serif;transition:all .3s;margin-top:8px}
.auth-btn:hover{background:transparent;color:#fff}

/* FORGOT / LINK */
.auth-link{display:block;text-align:center;margin-top:20px;font-size:11px;color:rgba(255,255,255,.35);transition:color .2s;cursor:pointer}
.auth-link:hover{color:rgba(255,255,255,.7)}

/* TERMS */
.auth-terms{font-size:10px;color:rgba(255,255,255,.2);line-height:1.8;text-align:center;margin-top:16px}
.auth-terms a{color:rgba(255,255,255,.4);text-decoration:underline;text-underline-offset:2px}

/* BACK */
.auth-back{position:fixed;top:28px;left:32px;font-size:11px;font-weight:600;letter-spacing:.1em;color:rgba(255,255,255,.3);transition:color .2s}
.auth-back:hover{color:#fff}

/* LANG */
.auth-lang{position:fixed;top:28px;right:32px}
.auth-lang select{background:transparent;color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.12);padding:5px 10px;font-size:10px;font-family:'Montserrat',sans-serif;letter-spacing:.1em;cursor:pointer}
.auth-lang select option{background:#000;color:#fff}

/* SUCCESS */
.auth-success{display:none;text-align:center;padding:40px 0}
.auth-success svg{width:56px;height:56px;stroke:#fff;margin-bottom:20px}
.auth-success h2{font-size:18px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.auth-success p{font-size:12px;color:rgba(255,255,255,.4);line-height:1.9;margin-bottom:24px}
.auth-success .auth-btn{max-width:280px;margin:0 auto}

@media(max-width:500px){
  .auth-wrapper{padding:20px 16px}
  .form-row{grid-template-columns:1fr}
}

<script>
function switchAuth(mode){
  document.querySelectorAll('.auth-tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.auth-panel').forEach(function(p){p.classList.remove('active');});
  if(mode==='login'){
    document.querySelectorAll('.auth-tab')[0].classList.add('active');
    document.getElementById('panelLogin').classList.add('active');
  } else {
    document.querySelectorAll('.auth-tab')[1].classList.add('active');
    document.getElementById('panelSignup').classList.add('active');
  }
}

function socialLogin(provider){
  if(provider==='google') PAP.auth.loginWithGoogle();
  else if(provider==='apple') PAP.auth.loginWithApple();
  else PAP.ui.toast('Instagram login coming soon','error');
}

async function doLogin(){
  var email=document.querySelector('#panelLogin input[type="email"]').value;
  var pw=document.querySelector('#panelLogin input[type="password"]').value;
  if(!email||!pw){PAP.ui.toast('Please fill in all fields','error');return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){PAP.ui.toast('Please enter a valid email','error');return;}
  try{
    await PAP.auth.login(email,pw);
    document.getElementById('panelLogin').style.display='none';
    document.querySelector('.auth-tabs').style.display='none';
    document.getElementById('authSuccess').style.display='block';
  }catch(e){
    PAP.ui.toast(e.message||'Login failed','error');
  }
}

async function doSignup(){
  var name=document.querySelector('#panelSignup input[type="text"]').value;
  var email=document.querySelector('#panelSignup input[type="email"]').value;
  var pw=document.querySelector('#panelSignup input[type="password"]').value;
  var role=document.getElementById('signupRole').value;
  var location=document.getElementById('signupLocation').value;
  var insta=document.querySelector('#panelSignup input[placeholder="@username"]').value;
  if(!name||!email||!pw){PAP.ui.toast('Please fill in required fields','error');return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){PAP.ui.toast('Please enter a valid email','error');return;}
  if(pw.length<8){PAP.ui.toast('Password must be at least 8 characters','error');return;}
  if(!/[A-Z]/.test(pw)||!/[0-9]/.test(pw)){PAP.ui.toast('Password needs at least 1 uppercase letter and 1 number','error');return;}
  try{
    await PAP.auth.signup({name,email,password:pw,role,location,instagram:insta});
    document.getElementById('panelSignup').style.display='none';
    document.querySelector('.auth-tabs').style.display='none';
    document.getElementById('authSuccess').style.display='block';
  }catch(e){
    PAP.ui.toast(e.message||'Signup failed','error');
  }
}

function setLang(l){
  localStorage.setItem('pap-lang',l);
  var d=L[l]||L.ko;
  document.querySelectorAll('[data-i18n]').forEach(function(e){
    var k=e.getAttribute('data-i18n');
    if(d[k]){
      if(k==='termsNotice') e.innerHTML=d[k];
      else e.textContent=d[k];
    }
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(e){
    var k=e.getAttribute('data-i18n-ph');
    if(d[k]) e.placeholder=d[k];
  });
  document.getElementById('langSelect').value=l;
}

// AUTO LANGUAGE DETECTION
(function(){
  var saved=localStorage.getItem('pap-lang');
  if(!saved){
    var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
    var lang=navigator.language||navigator.userLanguage||'';
    lang=lang.toLowerCase();
    if(lang.startsWith('ko')||tz.indexOf('Seoul')>-1) saved='ko';
    else if(lang.startsWith('ja')||tz.indexOf('Tokyo')>-1) saved='ja';
    else if(lang.startsWith('zh')||tz.indexOf('Shanghai')>-1||tz.indexOf('Beijing')>-1) saved='zh';
    else if(lang.startsWith('it')||tz.indexOf('Rome')>-1) saved='it';
    else if(lang.startsWith('fr')||tz.indexOf('Paris')>-1) saved='fr';
    else if(lang.startsWith('es')||tz.indexOf('Madrid')>-1) saved='es';
    else if(lang.startsWith('ru')||tz.indexOf('Moscow')>-1) saved='ru';
    else saved='en';
    localStorage.setItem('pap-lang',saved);
  }
  setLang(saved);
})();
