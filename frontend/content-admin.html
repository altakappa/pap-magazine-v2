<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAP Content Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
.admin-header{background:#111;border-bottom:1px solid #222;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.admin-header h1{font-size:16px;letter-spacing:.1em;font-weight:700}
.admin-header .user-info{font-size:12px;color:#888}
.admin-nav{display:flex;gap:0;border-bottom:1px solid #222;background:#111}
.admin-nav button{padding:14px 28px;background:none;border:none;color:#888;font-family:inherit;font-size:13px;letter-spacing:.06em;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.admin-nav button.active{color:#fff;border-bottom-color:#fff}
.admin-nav button:hover{color:#ccc}
.admin-content{max-width:1100px;margin:0 auto;padding:32px 24px}
.section{display:none}
.section.active{display:block}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.section-header h2{font-size:20px;font-weight:700;letter-spacing:.06em}
.btn{padding:10px 20px;border:none;border-radius:4px;font-family:inherit;font-size:13px;cursor:pointer;letter-spacing:.04em;transition:all .2s}
.btn-primary{background:#fff;color:#000;font-weight:600}
.btn-primary:hover{background:#ddd}
.btn-danger{background:#c0392b;color:#fff}
.btn-danger:hover{background:#a93226}
.btn-sm{padding:6px 14px;font-size:11px}
.btn-outline{background:none;border:1px solid #444;color:#fff}
.btn-outline:hover{border-color:#fff}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:10px 12px;border-bottom:1px solid #333;color:#888;font-size:11px;letter-spacing:.08em;font-weight:600}
.data-table td{padding:10px 12px;border-bottom:1px solid #1a1a1a;vertical-align:middle}
.data-table tr:hover td{background:#111}
.data-table .thumb{width:48px;height:32px;object-fit:cover;border-radius:2px;background:#222}
.status-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;letter-spacing:.04em;font-weight:600}
.status-published{background:#27ae60;color:#fff}
.status-draft{background:#555;color:#ccc}
.form-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;overflow-y:auto;padding:40px 20px}
.form-overlay.active{display:block}
.form-panel{max-width:700px;margin:0 auto;background:#111;border:1px solid #333;border-radius:8px;padding:32px}
.form-panel h3{font-size:18px;font-weight:700;margin-bottom:24px;letter-spacing:.06em}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:11px;color:#888;letter-spacing:.08em;margin-bottom:6px;font-weight:600}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 12px;background:#1a1a1a;border:1px solid #333;border-radius:4px;color:#fff;font-family:inherit;font-size:13px}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:#666}
.form-group textarea{min-height:100px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid #222}
.credits-list{display:flex;flex-direction:column;gap:8px}
.credit-row{display:flex;gap:8px;align-items:center}
.credit-row input{flex:1}
.credit-row .btn-remove{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#333;border:none;color:#fff;border-radius:4px;cursor:pointer;font-size:16px;flex-shrink:0}
.credit-row .btn-remove:hover{background:#c0392b}
.btn-add-credit{padding:6px 12px;background:#222;border:1px solid #444;color:#aaa;border-radius:4px;cursor:pointer;font-size:12px;font-family:inherit;margin-top:8px}
.btn-add-credit:hover{border-color:#fff;color:#fff}
.toast{position:fixed;bottom:24px;right:24px;padding:14px 24px;border-radius:6px;font-size:13px;z-index:999;transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast-success{background:#27ae60;color:#fff}
.toast-error{background:#c0392b;color:#fff}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:#111;border:1px solid #222;border-radius:6px;padding:20px}
.stat-card .num{font-size:32px;font-weight:700;margin-bottom:4px}
.stat-card .label{font-size:11px;color:#888;letter-spacing:.08em}
.login-overlay{position:fixed;inset:0;background:#0a0a0a;z-index:300;display:flex;align-items:center;justify-content:center}
.login-box{text-align:center;max-width:360px;width:100%}
.login-box h2{font-size:14px;letter-spacing:.15em;margin-bottom:32px}
.login-box input{width:100%;padding:12px 16px;background:#111;border:1px solid #333;border-radius:4px;color:#fff;font-family:inherit;font-size:14px;margin-bottom:12px}
.login-box input:focus{outline:none;border-color:#666}
.login-box .btn{width:100%;padding:14px;font-size:14px}
.login-error{color:#e74c3c;font-size:12px;margin-top:8px;display:none}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>PAP CONTENT MANAGER</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button class="btn btn-primary" onclick="doLogin()">LOGIN</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- HEADER -->
<div class="admin-header">
  <h1>PAP CONTENT MANAGER</h1>
  <div class="user-info" id="userInfo"></div>
</div>

<!-- NAV -->
<div class="admin-nav">
  <button class="active" onclick="showSection('dashboard',this)">DASHBOARD</button>
  <button onclick="showSection('films',this)">FILMS</button>
  <button onclick="showSection('articles',this)">ARTICLES</button>
</div>

<div class="admin-content">
  <!-- DASHBOARD -->
  <div class="section active" id="sec-dashboard">
    <div class="stats-grid">
      <div class="stat-card"><div class="num" id="statFilms">-</div><div class="label">TOTAL FILMS</div></div>
      <div class="stat-card"><div class="num" id="statArticles">-</div><div class="label">TOTAL ARTICLES</div></div>
      <div class="stat-card"><div class="num" id="statDrafts">-</div><div class="label">DRAFTS</div></div>
    </div>
  </div>

  <!-- FILMS -->
  <div class="section" id="sec-films">
    <div class="section-header"><h2>Films</h2><button class="btn btn-primary" onclick="openFilmForm()">+ NEW FILM</button></div>
    <table class="data-table">
      <thead><tr><th></th><th>TITLE</th><th>YOUTUBE ID</th><th>DATE</th><th>CATEGORY</th><th>STATUS</th><th></th></tr></thead>
      <tbody id="filmsTableBody"></tbody>
    </table>
  </div>

  <!-- ARTICLES -->
  <div class="section" id="sec-articles">
    <div class="section-header"><h2>Articles</h2><button class="btn btn-primary" onclick="openArticleForm()">+ NEW ARTICLE</button></div>
    <table class="data-table">
      <thead><tr><th></th><th>TITLE</th><th>CATEGORY</th><th>DATE</th><th>STATUS</th><th></th></tr></thead>
      <tbody id="articlesTableBody"></tbody>
    </table>
  </div>
</div>

<!-- FILM FORM -->
<div class="form-overlay" id="filmFormOverlay">
  <div class="form-panel">
    <h3 id="filmFormTitle">NEW FILM</h3>
    <input type="hidden" id="filmId">
    <div class="form-row">
      <div class="form-group"><label>TITLE *</label><input type="text" id="fTitle" placeholder="Film title"></div>
      <div class="form-group"><label>YOUTUBE VIDEO ID *</label><input type="text" id="fYoutubeId" placeholder="e.g. m7aQkN6biUk"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>PUBLISHED DATE</label><input type="date" id="fDate"></div>
      <div class="form-group"><label>CATEGORIES</label><input type="text" id="fCategories" placeholder="e.g. Editorial,Fashion"></div>
    </div>
    <div class="form-group"><label>THUMBNAIL URL</label><input type="text" id="fThumb" placeholder="https://..."></div>
    <div class="form-group"><label>THUMBNAIL UPLOAD</label><input type="file" id="fThumbFile" accept="image/*"></div>
    <div class="form-group"><label>TAGS</label><input type="text" id="fTags" placeholder="Tags"></div>
    <div class="form-group">
      <label>CREDITS</label>
      <div class="credits-list" id="filmCredits"></div>
      <button class="btn-add-credit" onclick="addCreditRow('filmCredits')">+ Add Credit</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>STATUS</label><select id="fStatus"><option value="published">Published</option><option value="draft">Draft</option></select></div>
      <div></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeForm('filmFormOverlay')">CANCEL</button>
      <button class="btn btn-primary" onclick="saveFilm()">SAVE FILM</button>
    </div>
  </div>
</div>

<!-- ARTICLE FORM -->
<div class="form-overlay" id="articleFormOverlay">
  <div class="form-panel">
    <h3 id="articleFormTitle">NEW ARTICLE</h3>
    <input type="hidden" id="aId">
    <div class="form-group"><label>TITLE *</label><input type="text" id="aTitle" placeholder="Article title"></div>
    <div class="form-group"><label>SUBTITLE</label><input type="text" id="aSubtitle" placeholder="Short description"></div>
    <div class="form-row">
      <div class="form-group"><label>PUBLISHED DATE</label><input type="date" id="aDate"></div>
      <div class="form-group"><label>CATEGORY</label>
        <select id="aCategory"><option value="">Select</option><option value="Fashion">Fashion</option><option value="Beauty">Beauty</option><option value="Interview">Interview</option><option value="Lifestyle">Lifestyle</option><option value="Culture">Culture</option><option value="News">News</option></select>
      </div>
    </div>
    <div class="form-group"><label>THUMBNAIL URL</label><input type="text" id="aThumb" placeholder="https://..."></div>
    <div class="form-group"><label>THUMBNAIL UPLOAD</label><input type="file" id="aThumbFile" accept="image/*"></div>
    <div class="form-group"><label>HERO IMAGE URL</label><input type="text" id="aHero" placeholder="https://..."></div>
    <div class="form-group"><label>CONTENT (HTML)</label><textarea id="aContent" rows="8" placeholder="Article body content..."></textarea></div>
    <div class="form-group"><label>TAGS (comma separated)</label><input type="text" id="aTags" placeholder="Fashion, MFW, Street Style"></div>
    <div class="form-group"><label>GALLERY URLS (one per line)</label><textarea id="aGallery" rows="4" placeholder="https://image1.jpg&#10;https://image2.jpg"></textarea></div>
    <div class="form-group">
      <label>CREDITS</label>
      <div class="credits-list" id="articleCredits"></div>
      <button class="btn-add-credit" onclick="addCreditRow('articleCredits')">+ Add Credit</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>CUSTOM URL</label><input type="text" id="aCustomUrl" placeholder="custom-url-path"></div>
      <div class="form-group"><label>STATUS</label><select id="aStatus"><option value="published">Published</option><option value="draft">Draft</option></select></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeForm('articleFormOverlay')">CANCEL</button>
      <button class="btn btn-primary" onclick="saveArticle()">SAVE ARTICLE</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var API_BASE='';
var TOKEN=localStorage.getItem('pap_admin_token')||'';
(function(){var h=window.location.hostname;if(h==='localhost'||h==='127.0.0.1'){API_BASE='http://localhost:3000/api';}else if(h.includes('vercel.app')){API_BASE=window.location.origin+'/api';}else{API_BASE='https://www.pap-magazine.com/api';}})();

function doLogin(){var email=document.getElementById('loginEmail').value;var pw=document.getElementById('loginPassword').value;var errEl=document.getElementById('loginError');errEl.style.display='none';fetch(API_BASE+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pw})}).then(function(r){return r.json();}).then(function(data){if(data.token){TOKEN=data.token;localStorage.setItem('pap_admin_token',TOKEN);document.getElementById('loginOverlay').style.display='none';document.getElementById('userInfo').textContent=email;loadDashboard();}else{var msg=data.message||data.error||'Login failed';errEl.textContent=typeof msg==='string'?msg:JSON.stringify(msg);errEl.style.display='block';}}).catch(function(e){errEl.textContent='Connection error: '+(e.message||e);errEl.style.display='block';});}
if(TOKEN){fetch(API_BASE+'/auth/me',{headers:{'Authorization':'Bearer '+TOKEN}}).then(function(r){return r.json();}).then(function(data){if(data.user){document.getElementById('loginOverlay').style.display='none';document.getElementById('userInfo').textContent=data.user.email;loadDashboard();}}).catch(function(){});}

function apiGet(p){return fetch(API_BASE+p,{headers:{'Authorization':'Bearer '+TOKEN}}).then(function(r){return r.json();});}
function apiPost(p,b){return fetch(API_BASE+p,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify(b)}).then(function(r){return r.json();});}
function apiPut(p,b){return fetch(API_BASE+p,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},body:JSON.stringify(b)}).then(function(r){return r.json();});}
function apiDelete(p){return fetch(API_BASE+p,{method:'DELETE',headers:{'Authorization':'Bearer '+TOKEN}}).then(function(r){return r.json();});}
async function uploadFile(fi){if(!fi.files||!fi.files[0])return null;var fd=new FormData();fd.append('file',fi.files[0]);var res=await fetch(API_BASE+'/media/upload',{method:'POST',headers:{'Authorization':'Bearer '+TOKEN},body:fd});var d=await res.json();return(d.data&&d.data[0])?d.data[0].url:null;}

function showSection(n,btn){document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});document.querySelectorAll('.admin-nav button').forEach(function(b){b.classList.remove('active');});document.getElementById('sec-'+n).classList.add('active');if(btn)btn.classList.add('active');if(n==='films')loadFilms();if(n==='articles')loadArticles();}
function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast toast-'+(type||'success')+' show';setTimeout(function(){t.classList.remove('show');},3000);}
function closeForm(id){document.getElementById(id).classList.remove('active');}
function addCreditRow(cid,role,handles){var list=document.getElementById(cid);var row=document.createElement('div');row.className='credit-row';row.innerHTML='<input type="text" placeholder="Role" value="'+(role||'')+'">'+'<input type="text" placeholder="Handles (comma separated)" value="'+(handles||'')+'">'+'<button class="btn-remove" onclick="this.parentNode.remove()">&times;</button>';list.appendChild(row);}
function getCredits(cid){var rows=document.getElementById(cid).querySelectorAll('.credit-row');var cr=[];rows.forEach(function(row){var inp=row.querySelectorAll('input');var r=inp[0].value.trim();var h=inp[1].value.trim();if(r||h)cr.push({role:r,handles:h});});return cr;}

function loadDashboard(){apiGet('/films?limit=1').then(function(d){document.getElementById('statFilms').textContent=d.pagination?d.pagination.total:0;}).catch(function(){});apiGet('/articles?limit=1').then(function(d){document.getElementById('statArticles').textContent=d.pagination?d.pagination.total:0;}).catch(function(){});apiGet('/films?status=draft&limit=1').then(function(d1){apiGet('/articles?status=draft&limit=1').then(function(d2){document.getElementById('statDrafts').textContent=((d1.pagination?d1.pagination.total:0)+(d2.pagination?d2.pagination.total:0));});}).catch(function(){});}

function loadFilms(){apiGet('/films?limit=100').then(function(d){var rows=(d.data||[]).map(function(f){var th=f.thumbnail_url?'<img class="thumb" src="'+f.thumbnail_url+'">':'<div class="thumb"></div>';var sc=f.status==='published'?'status-published':'status-draft';return '<tr><td>'+th+'</td><td><strong>'+f.title+'</strong></td><td style="color:#888;font-size:11px">'+f.youtube_id+'</td><td style="font-size:12px">'+(f.published_date||'-')+'</td><td style="font-size:12px">'+(f.categories||'')+'</td><td><span class="status-badge '+sc+'">'+f.status+'</span></td><td><button class="btn btn-outline btn-sm" onclick="editFilm('+f.id+')">Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteFilm('+f.id+')">Del</button></td></tr>';}).join('');document.getElementById('filmsTableBody').innerHTML=rows||'<tr><td colspan="7" style="text-align:center;color:#888;padding:40px">No films yet</td></tr>';});}

function openFilmForm(d){document.getElementById('filmFormTitle').textContent=d?'EDIT FILM':'NEW FILM';document.getElementById('filmId').value=d?d.id:'';document.getElementById('fTitle').value=d?d.title:'';document.getElementById('fYoutubeId').value=d?d.youtube_id:'';document.getElementById('fDate').value=d?d.published_date:'';document.getElementById('fCategories').value=d?d.categories:'';document.getElementById('fThumb').value=d?(d.thumbnail_url||''):'';document.getElementById('fTags').value=d?(d.tags||''):'';document.getElementById('fStatus').value=d?d.status:'published';document.getElementById('fThumbFile').value='';var cl=document.getElementById('filmCredits');cl.innerHTML='';if(d&&d.credits)(d.credits||[]).forEach(function(c){addCreditRow('filmCredits',c.role,c.handles);});document.getElementById('filmFormOverlay').classList.add('active');}
function editFilm(id){apiGet('/films/'+id).then(function(d){if(d.data)openFilmForm(d.data);});}
async function saveFilm(){var id=document.getElementById('filmId').value;var thu=document.getElementById('fThumb').value;var tf=document.getElementById('fThumbFile');if(tf.files&&tf.files[0]){var u=await uploadFile(tf);if(u)thu=u;}var body={title:document.getElementById('fTitle').value,youtube_id:document.getElementById('fYoutubeId').value,published_date:document.getElementById('fDate').value||null,categories:document.getElementById('fCategories').value,thumbnail_url:thu,tags:document.getElementById('fTags').value,credits:getCredits('filmCredits'),status:document.getElementById('fStatus').value};var p=id?apiPut('/films/'+id,body):apiPost('/films',body);p.then(function(d){if(d.data){showToast(id?'Film updated':'Film created');closeForm('filmFormOverlay');loadFilms();}else{showToast(d.error||'Error','error');}}).catch(function(){showToast('Save failed','error');});}
function deleteFilm(id){if(!confirm('Delete this film?'))return;apiDelete('/films/'+id).then(function(){showToast('Film deleted');loadFilms();});}

function loadArticles(){apiGet('/articles?limit=100').then(function(d){var rows=(d.data||[]).map(function(a){var th=a.thumbnail_url?'<img class="thumb" src="'+a.thumbnail_url+'">':'<div class="thumb"></div>';var sc=a.status==='published'?'status-published':'status-draft';return '<tr><td>'+th+'</td><td><strong>'+a.title+'</strong></td><td style="font-size:12px">'+(a.category||'')+'</td><td style="font-size:12px">'+(a.published_date||'-')+'</td><td><span class="status-badge '+sc+'">'+a.status+'</span></td><td><button class="btn btn-outline btn-sm" onclick="editArticle('+a.id+')">Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteArticle('+a.id+')">Del</button></td></tr>';}).join('');document.getElementById('articlesTableBody').innerHTML=rows||'<tr><td colspan="6" style="text-align:center;color:#888;padding:40px">No articles yet</td></tr>';});}

function openArticleForm(d){document.getElementById('articleFormTitle').textContent=d?'EDIT ARTICLE':'NEW ARTICLE';document.getElementById('aId').value=d?d.id:'';document.getElementById('aTitle').value=d?d.title:'';document.getElementById('aSubtitle').value=d?(d.subtitle||''):'';document.getElementById('aDate').value=d?d.published_date:'';document.getElementById('aCategory').value=d?(d.category||''):'';document.getElementById('aThumb').value=d?(d.thumbnail_url||''):'';document.getElementById('aHero').value=d?(d.hero_image_url||''):'';document.getElementById('aContent').value=d?(d.content||''):'';document.getElementById('aTags').value=d?(d.tags||[]).join(', '):'';document.getElementById('aGallery').value=d?(d.gallery||[]).join('\n'):'';document.getElementById('aCustomUrl').value=d?(d.custom_url||''):'';document.getElementById('aStatus').value=d?d.status:'published';document.getElementById('aThumbFile').value='';var cl=document.getElementById('articleCredits');cl.innerHTML='';if(d&&d.credits)(d.credits||[]).forEach(function(c){addCreditRow('articleCredits',c.role,c.handles);});document.getElementById('articleFormOverlay').classList.add('active');}
function editArticle(id){apiGet('/articles/'+id).then(function(d){if(d.data)openArticleForm(d.data);});}
async function saveArticle(){var id=document.getElementById('aId').value;var thu=document.getElementById('aThumb').value;var tf=document.getElementById('aThumbFile');if(tf.files&&tf.files[0]){var u=await uploadFile(tf);if(u)thu=u;}var ts=document.getElementById('aTags').value;var ta=ts?ts.split(',').map(function(t){return t.trim();}).filter(Boolean):[];var gs=document.getElementById('aGallery').value;var ga=gs?gs.split('\n').map(function(u){return u.trim();}).filter(Boolean):[];var body={title:document.getElementById('aTitle').value,subtitle:document.getElementById('aSubtitle').value||null,published_date:document.getElementById('aDate').value||null,category:document.getElementById('aCategory').value||null,tags:ta,thumbnail_url:thu||null,hero_image_url:document.getElementById('aHero').value||null,content:document.getElementById('aContent').value,gallery:ga,credits:getCredits('articleCredits'),custom_url:document.getElementById('aCustomUrl').value||null,status:document.getElementById('aStatus').value};var p=id?apiPut('/articles/'+id,body):apiPost('/articles',body);p.then(function(d){if(d.data){showToast(id?'Article updated':'Article created');closeForm('articleFormOverlay');loadArticles();}else{showToast(d.error||'Error','error');}}).catch(function(){showToast('Save failed','error');});}
function deleteArticle(id){if(!confirm('Delete this article?'))return;apiDelete('/articles/'+id).then(function(){showToast('Article deleted');loadArticles();});}
</script>
</body>
</html>
