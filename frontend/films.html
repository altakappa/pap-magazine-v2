<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PAP Magazine이 선보이는 패션 필름과 비주얼 스토리. Fashion films and visual stories by PAP Magazine.">
<meta property="og:title" content="Film | PAP Magazine">
<meta property="og:description" content="PAP Magazine이 선보이는 패션 필름과 비주얼 스토리. Fashion films and visual stories by PAP Magazine.">
<meta property="og:image" content="https://pap-korea-bucket.s3.ap-northeast-2.amazonaws.com/cover1_0281a06055.jpg">
<meta property="og:type" content="website">
<link rel="canonical" href="https://pap-magazine.com/films.html">
<title>Film | PAP Magazine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pap-styles.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; color:#fff; font-family:'Montserrat',sans-serif; min-height:100vh; }
.page-header {
  padding:20px 40px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.page-header a { color:#fff; text-decoration:none; font-size:11px; letter-spacing:.15em; font-weight:700; }
.page-logo { font-size:14px; font-weight:800; letter-spacing:.2em; color:#fff; text-decoration:none; }
.page-title {
  font-size:28px; font-weight:800; letter-spacing:.15em; padding:40px 48px 8px; color:#fff;
}
.page-count { font-size:11px; color:#666; letter-spacing:.12em; padding:0 48px 24px; }
.filter-wrap { padding:0 48px 24px; display:flex; flex-wrap:wrap; gap:6px; }
.filter-btn {
  background:transparent; border:1px solid #333; color:#888; padding:6px 14px;
  font-size:10px; font-weight:600; letter-spacing:.1em; cursor:pointer; transition:all .2s;
  font-family:'Montserrat',sans-serif;
}
.filter-btn:hover { border-color:#666; color:#fff; }
.filter-btn.active { background:#fff; color:#000; border-color:#fff; }
.card-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:0 48px 60px;
}
.card { cursor:pointer; transition:opacity .2s; }
.card:hover { opacity:.85; }
.card-img { width:100%; aspect-ratio:3/2; overflow:hidden; border-radius:2px; background:#111; }
.card-img img { width:100%; height:100%; object-fit:cover; display:block; }
.card-cat { font-size:10px; color:#666; letter-spacing:.08em; margin-top:10px; }
.card-title { font-size:13px; font-weight:700; letter-spacing:.06em; margin-top:4px; color:#fff; }
.page-footer { padding:40px 48px; border-top:1px solid rgba(255,255,255,.06); text-align:center; }
.page-footer p { font-size:10px; color:#444; letter-spacing:.1em; }
@media(max-width:900px) { .card-grid{grid-template-columns:repeat(2,1fr);gap:16px;} .page-title,.filter-wrap,.card-grid,.page-count{padding-left:24px;padding-right:24px;} }
@media(max-width:500px) { .card-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="page-header">
  <a href="index.html">&larr; BACK</a>
  <a href="index.html" class="page-logo">PAP MAGAZINE</a>
  <div style="width:60px"></div>
</div>

<div class="page-title">FILM</div>
<div class="page-count" id="filmCount"></div>

<div class="filter-wrap" id="filterWrap"></div>

<div class="card-grid" id="cardGrid"></div>

<!-- CREATOR PROFILE POPUP -->
<div class="creator-popup-overlay" id="creatorPopup" onclick="if(event.target===this)closeCreatorPopup()">
  <div class="creator-popup">
    <button class="creator-popup-close" onclick="closeCreatorPopup()">&times;</button>
    <div class="creator-popup-header">
      <div class="creator-popup-name" id="cpName"></div>
      <div class="creator-popup-role" id="cpRole"></div>
      <div class="creator-popup-level" id="cpLevel"></div>
      <div style="margin-top:8px"><a class="creator-popup-ig" id="cpIgBtn" href="#" target="_blank">INSTAGRAM</a></div>
      <div class="creator-popup-links" id="cpLinks" style="margin-top:12px"></div>
    </div>
    <div class="creator-popup-stats">
      <div class="creator-stat"><div class="creator-stat-num" id="cpCount">0</div><div class="creator-stat-label">Editorials</div></div>
      <div class="creator-stat"><div class="creator-stat-num" id="cpFirst">—</div><div class="creator-stat-label">First Work</div></div>
      <div class="creator-stat"><div class="creator-stat-num" id="cpLatest">—</div><div class="creator-stat-label">Latest Work</div></div>
    </div>
    <div class="creator-popup-works">
      <div class="creator-popup-works-title">EDITORIAL WORKS</div>
      <div class="creator-works-grid" id="cpWorks"></div>
    </div>
  </div>
</div>

<!-- FILM DETAIL OVERLAY -->
<div class="film-detail-overlay" id="filmDetailOverlay">
  <button class="ed-all-close" onclick="closeFilmDetail()" style="position:absolute;top:16px;right:20px;z-index:10">&times;</button>
  <div style="width:100%;max-width:960px;margin:40px auto;padding:0 20px">
    <div style="position:relative;width:100%;aspect-ratio:16/9;background:#111;border-radius:4px;overflow:hidden">
      <iframe id="filmDetailPlayer" src="about:blank" style="width:100%;height:100%;border:none" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
    </div>
    <div style="padding:20px 0">
      <div id="filmDetailTitle" style="font-family:'Montserrat',sans-serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:.06em"></div>
      <div id="filmDetailCat" style="font-size:11px;color:#888;letter-spacing:.08em;margin-top:6px"></div>
    </div>
    <div id="filmDetailCredits" style="padding:12px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12px;line-height:1.8"></div>
  </div>
</div>

<div class="page-footer">
  <p>&copy; 2026 PAP Magazine. All rights reserved.</p>
</div>

<script src="pap-app.js"></script>
<script>
function formatDate(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr);
  var months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  var day = String(d.getDate()).padStart(2, '0');
  var month = months[d.getMonth()];
  var year = d.getFullYear();
  return day + ' ' + month + ' ' + year;
}

document.addEventListener('DOMContentLoaded', function() {
  if (typeof filmAllData === 'undefined') {
    console.error('filmAllData not found');
    return;
  }

  // Extract unique categories
  var cats = {};
  filmAllData.forEach(function(f) {
    (f.cat || '').split(',').forEach(function(c) {
      c = c.trim();
      if (c) cats[c] = 1;
    });
  });

  var catList = Object.keys(cats).sort();
  var activeFilter = 'ALL';

  // Build filter buttons
  var filterWrap = document.getElementById('filterWrap');
  var allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active';
  allBtn.textContent = 'ALL';
  allBtn.onclick = function() {
    activeFilter = 'ALL';
    updateFilterButtons();
    renderCards();
  };
  filterWrap.appendChild(allBtn);

  catList.forEach(function(cat) {
    var btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = cat.toUpperCase();
    btn.onclick = function() {
      activeFilter = cat;
      updateFilterButtons();
      renderCards();
    };
    filterWrap.appendChild(btn);
  });

  function updateFilterButtons() {
    var btns = filterWrap.querySelectorAll('.filter-btn');
    btns.forEach(function(btn) {
      if (btn.textContent === activeFilter || (activeFilter === 'ALL' && btn.textContent === 'ALL')) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
  }

  // Expose renderCards globally so API sync can trigger re-render
  window._papFilmRenderCards = renderCards;

  function renderCards() {
    var grid = document.getElementById('cardGrid');
    grid.innerHTML = '';

    var filtered = filmAllData.filter(function(f) {
      if (activeFilter === 'ALL') return true;
      return (f.cat || '').split(',').some(function(c) {
        return c.trim().toLowerCase() === activeFilter.toLowerCase();
      });
    });

    filtered.forEach(function(f, filteredIdx) {
      // Find the original index in filmAllData
      var origIdx = filmAllData.indexOf(f);
      var card = document.createElement('div');
      card.className = 'card';
      card.onclick = function() {
        if (origIdx >= 0) openFilmDetail(origIdx);
      };

      var img = document.createElement('div');
      img.className = 'card-img';
      var imgEl = document.createElement('img');
      imgEl.src = f.th || '';
      imgEl.onerror = function() { edImgError(this); };
      img.appendChild(imgEl);

      var cat = document.createElement('div');
      cat.className = 'card-cat';
      cat.textContent = (f.cat || 'FILM') + ' - ' + formatDate(f.d);

      var title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = (f.t || '').toUpperCase();

      card.appendChild(img);
      card.appendChild(cat);
      card.appendChild(title);
      grid.appendChild(card);
    });

    // Update count
    var countEl = document.getElementById('filmCount');
    countEl.textContent = filtered.length + ' FILMS';
  }

  renderCards();
});
</script>
</body>
</html>
