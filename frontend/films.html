<script>
function formatDate(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr);
  var months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  var day = String(d.getDate()).padStart(2, '0');
  var month = months[d.getMonth()];
  var year = d.getFullYear();
  return day + ' ' + month + ' ' + year;
}

document.addEventListener('DOMContentLoaded', function() {
  if (typeof filmAllData === 'undefined') {
    console.error('filmAllData not found');
    return;
  }

  // Extract unique categories
  var cats = {};
  filmAllData.forEach(function(f) {
    (f.cat || '').split(',').forEach(function(c) {
      c = c.trim();
      if (c) cats[c] = 1;
    });
  });

  var catList = Object.keys(cats).sort();
  var activeFilter = 'ALL';
  var filmCurrentPage = 1;

  // Build filter buttons
  var filterWrap = document.getElementById('filterWrap');
  var allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active';
  allBtn.textContent = 'ALL';
  allBtn.onclick = function() {
    activeFilter = 'ALL';
    filmCurrentPage = 1;
    updateFilterButtons();
    renderCards();
  };
  filterWrap.appendChild(allBtn);

  catList.forEach(function(cat) {
    var btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = cat.toUpperCase();
    btn.onclick = function() {
      activeFilter = cat;
      filmCurrentPage = 1;
      updateFilterButtons();
      renderCards();
    };
    filterWrap.appendChild(btn);
  });

  function updateFilterButtons() {
    var btns = filterWrap.querySelectorAll('.filter-btn');
    btns.forEach(function(btn) {
      if (btn.textContent === activeFilter || (activeFilter === 'ALL' && btn.textContent === 'ALL')) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
  }

  // Expose renderCards globally so API sync can trigger re-render
  window._papFilmRenderCards = function(){ filmCurrentPage=1; renderCards(); };

  /* Override global PAP_PER_PAGE (20) with a 3-column friendly 21 so the
     grid always fills complete rows on this page. */
  var FILM_PER_PAGE = 21;

  function renderCards() {
    var grid = document.getElementById('cardGrid');
    grid.innerHTML = '';

    var filtered = filmAllData.filter(function(f) {
      if (activeFilter === 'ALL') return true;
      return (f.cat || '').split(',').some(function(c) {
        return c.trim().toLowerCase() === activeFilter.toLowerCase();
      });
    });

    var totalPages = Math.ceil(filtered.length / FILM_PER_PAGE);
    if (filmCurrentPage > totalPages) filmCurrentPage = totalPages || 1;
    var startIdx = (filmCurrentPage - 1) * FILM_PER_PAGE;
    var pageItems = filtered.slice(startIdx, startIdx + FILM_PER_PAGE);

    pageItems.forEach(function(f) {
      var origIdx = filmAllData.indexOf(f);
      var card = document.createElement('div');
      card.className = 'card';
      card.onclick = function() {
        if (origIdx >= 0) openFilmDetail(origIdx);
      };

      var img = document.createElement('div');
      img.className = 'card-img';
      var imgEl = document.createElement('img');
      imgEl.src = f.th || '';
      imgEl.onerror = function() { edImgError(this); };
      img.appendChild(imgEl);

      var cat = document.createElement('div');
      cat.className = 'card-cat';
      cat.textContent = (f.cat || 'FILM') + ' - ' + formatDate(f.d);

      var title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = (f.t || '').toUpperCase();

      card.appendChild(img);
      card.appendChild(cat);
      card.appendChild(title);
      grid.appendChild(card);
    });

    // Update count
    var countEl = document.getElementById('filmCount');
    countEl.textContent = filtered.length + ' FILMS';

    // Pagination
    var pagContainer = document.getElementById('filmPagination');
    buildPagination(pagContainer, filmCurrentPage, totalPages, function(page) {
      filmCurrentPage = page;
      renderCards();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, true);

    // Trigger unified scroll-reveal animation on the freshly inserted cards
    if (window.papReveal) window.papReveal.refresh();
  }

  renderCards();
});
</script>
