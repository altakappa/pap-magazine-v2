<script>
// ======== SCROLL LOCK ========
var _scrollLockCount=0,_savedScrollY=0;
function lockScroll(){if(_scrollLockCount===0){_savedScrollY=window.scrollY;document.body.style.position='fixed';document.body.style.top='-'+_savedScrollY+'px';document.body.style.left='0';document.body.style.right='0';}_scrollLockCount++;}
function unlockScroll(){_scrollLockCount--;if(_scrollLockCount<=0){_scrollLockCount=0;document.body.style.position='';document.body.style.top='';document.body.style.left='';document.body.style.right='';window.scrollTo(0,_savedScrollY);}}

// ======== INTERSTITIAL AD + PREMIUM UPSELL ========
function isStandardOrAbove(){try{var betaOn=(typeof isBetaActive==='function'&&isBetaActive());if(betaOn){if(typeof isLoggedIn==='function'&&isLoggedIn())return true;if(localStorage.getItem('pap-token'))return true;var ub=localStorage.getItem('pap-user');if(ub){try{var pb=JSON.parse(ub);if(pb&&(pb.id||pb.email))return true;}catch(eb){}}}var u=localStorage.getItem('pap-user');if(!u)return false;var user=JSON.parse(u);return user&&(user.subscription==='standard'||user.subscription==='premium');}catch(e){return false;}}
var _interstitialCount=0;
var _INTERSTITIAL_MAX=2;
var _brandAds=[];
(function(){try{fetch(window.location.origin+'/api/ads',{credentials:'omit'}).then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&Array.isArray(j.ads))_brandAds=j.ads;}).catch(function(){});}catch(_){}})();
function _getNextBrandAd(){if(!_brandAds||_brandAds.length===0)return null;if(typeof _brandAdIdx==='undefined')_brandAdIdx=0;var ad=_brandAds[_brandAdIdx%_brandAds.length];_brandAdIdx++;return ad;}

function showPremiumInterstitial(callback){
  if(isStandardOrAbove()){if(callback)callback();return;}
  if(_interstitialCount>=_INTERSTITIAL_MAX){if(callback)callback();return;}
  _interstitialCount++;
  var brandAd=_getNextBrandAd();
  if(brandAd){_showBrandAdInterstitial(brandAd,callback);}else{_showPremiumUpsellInterstitial(callback);}
}

function _showBrandAdInterstitial(ad,callback){
  var overlay=document.createElement('div');
  overlay.id='premiumInterstitial';
  overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;transition:opacity .4s;';
  var label=document.createElement('div');
  label.textContent='AD'+(ad.brand?' · '+ad.brand:'');
  label.style.cssText='position:absolute;top:16px;left:20px;font-size:9px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.35);font-family:Montserrat,sans-serif;z-index:2;';
  overlay.appendChild(label);
  var mediaWrap=document.createElement('div');
  mediaWrap.style.cssText='position:relative;max-width:90vw;max-height:75vh;display:flex;align-items:center;justify-content:center;cursor:pointer;';
  var duration=ad.duration||3;
  if(ad.type==='video'){var video=document.createElement('video');video.src=ad.src;if(ad.poster)video.poster=ad.poster;video.autoplay=true;video.muted=true;video.playsInline=true;video.loop=true;video.style.cssText='max-width:90vw;max-height:75vh;object-fit:contain;border-radius:2px;';mediaWrap.appendChild(video);}else{var img=document.createElement('img');img.src=ad.src;img.alt=ad.brand||'Ad';img.style.cssText='max-width:90vw;max-height:75vh;object-fit:contain;border-radius:2px;';mediaWrap.appendChild(img);}
  if(ad.link){mediaWrap.onclick=function(){window.open(ad.link,'_blank');};}
  overlay.appendChild(mediaWrap);
  var lang=localStorage.getItem('pap-lang')||'ko';
  var skipTexts={ko:'건너뛰기',en:'Skip',it:'Salta',fr:'Passer',es:'Saltar',ja:'スキップ',zh:'跳过'};
  var skipLabel=skipTexts[lang]||skipTexts.en;
  var skip=document.createElement('button');
  skip.style.cssText='position:absolute;bottom:24px;right:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.55);font-size:11px;font-weight:600;letter-spacing:.1em;cursor:pointer;font-family:Montserrat,sans-serif;padding:8px 20px;border-radius:2px;transition:all .2s;z-index:2;';
  skip.onmouseover=function(){this.style.background='rgba(255,255,255,.15)';this.style.color='rgba(255,255,255,.9)';};
  skip.onmouseout=function(){this.style.background='rgba(255,255,255,.1)';this.style.color='rgba(255,255,255,.55)';};
  var _countdown=duration;var _timer=null;
  skip.textContent=skipLabel+' ('+_countdown+')';skip.disabled=true;
  function closeAd(){if(_timer)clearInterval(_timer);if(ad.type==='video'){var v=overlay.querySelector('video');if(v)v.pause();}overlay.style.opacity='0';unlockScroll();setTimeout(function(){if(overlay.parentNode)overlay.parentNode.removeChild(overlay);},400);if(callback)callback();}
  skip.onclick=function(){closeAd();};
  overlay.appendChild(skip);
  var premBadge=document.createElement('a');premBadge.href='/subscribe';
  var premTexts={ko:'광고 없이 즐기기',en:'Go ad-free',it:'Senza pubblicità',fr:'Sans publicité',es:'Sin anuncios',ja:'広告なし',zh:'去除广告'};
  premBadge.textContent=premTexts[lang]||premTexts.en;
  premBadge.style.cssText='position:absolute;bottom:26px;left:24px;font-size:10px;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.3);text-decoration:none;font-family:Montserrat,sans-serif;transition:color .2s;z-index:2;';
  premBadge.onmouseover=function(){this.style.color='rgba(255,255,255,.7)';};
  premBadge.onmouseout=function(){this.style.color='rgba(255,255,255,.3)';};
  overlay.appendChild(premBadge);
  document.body.appendChild(overlay);lockScroll();
  requestAnimationFrame(function(){overlay.style.opacity='1';});
  _timer=setInterval(function(){_countdown--;if(_countdown>0){skip.textContent=skipLabel+' ('+_countdown+')';}else{clearInterval(_timer);skip.textContent=skipLabel;skip.disabled=false;skip.style.color='rgba(255,255,255,.7)';}},1000);
}

function _showPremiumUpsellInterstitial(callback){
  var lang=localStorage.getItem('pap-lang')||'ko';
  var texts={
    ko:{tag:'SUBSCRIBE',title:'광고 없이\n모든 콘텐츠를 즐기세요',desc:'구독으로 에디토리얼, 매거진,\n독점 콘텐츠를 제한 없이 감상하세요.',btn:'구독하기',skip:'건너뛰기'},
    en:{tag:'SUBSCRIBE',title:'Enjoy all content\nwithout interruptions',desc:'Subscribe for unlimited access\nto editorials, magazines, and exclusive content.',btn:'Subscribe',skip:'Skip'},
    ru:{tag:'SUBSCRIBE',title:'Enjoy all content\nwithout interruptions',desc:'Подпишитесь для неограниченного доступа\nк эдиториалам, журналам и эксклюзивному контенту.',btn:'Subscribe',skip:'Skip'},
    de:{tag:'SUBSCRIBE',title:'Enjoy all content\nwithout interruptions',desc:'Abonnieren Sie für unbegrenzten Zugang\nzu Editorials, Magazinen und exklusiven Inhalten.',btn:'Subscribe',skip:'Skip'},
    it:{tag:'SUBSCRIBE',title:'Goditi tutti i contenuti\nsenza interruzioni',desc:'Abbonati per accesso illimitato\na editoriali, riviste e contenuti esclusivi.',btn:'Abbonati',skip:'Salta'},
    fr:{tag:'SUBSCRIBE',title:'Profitez de tout le contenu\nsans interruption',desc:"Abonnez-vous pour un accès illimité\naux éditoriaux, magazines et contenus exclusifs.",btn:"S'abonner",skip:'Passer'},
    es:{tag:'SUBSCRIBE',title:'Disfruta todo el contenido\nsin interrupciones',desc:'Suscríbete para acceso ilimitado\na editoriales, revistas y contenido exclusivo.',btn:'Suscríbete',skip:'Saltar'},
    ja:{tag:'SUBSCRIBE',title:'すべてのコンテンツを\n中断なくお楽しみください',desc:'購読でエディトリアル、マガジン、\n限定コンテンツに無制限アクセス。',btn:'購読する',skip:'スキップ'},
    zh:{tag:'SUBSCRIBE',title:'无干扰地\n享受所有内容',desc:'订阅后无限访问\n社论、杂志和独家内容。',btn:'订阅',skip:'跳过'}
  };
  var t=texts[lang]||texts.en;
  var overlay=document.createElement('div');
  overlay.id='premiumInterstitial';
  overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .4s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);';
  var box=document.createElement('div');box.style.cssText='text-align:center;max-width:420px;padding:48px 32px;';
  var tag=document.createElement('div');tag.textContent=t.tag;tag.style.cssText='font-size:10px;font-weight:800;letter-spacing:.3em;color:rgba(255,255,255,.4);margin-bottom:24px;';
  var h=document.createElement('h2');h.textContent=t.title;h.style.cssText='font-size:22px;font-weight:800;letter-spacing:.06em;line-height:1.5;color:#fff;margin-bottom:16px;white-space:pre-line;font-family:Montserrat,sans-serif;';
  var desc=document.createElement('p');desc.textContent=t.desc;desc.style.cssText='font-size:12px;color:rgba(255,255,255,.5);line-height:1.9;margin-bottom:32px;white-space:pre-line;font-family:Montserrat,sans-serif;';
  var btn=document.createElement('a');btn.href='/subscribe';btn.textContent=t.btn;btn.style.cssText='display:inline-block;padding:14px 40px;background:#fff;color:#000;font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;text-decoration:none;font-family:Montserrat,sans-serif;transition:all .3s;border:1.5px solid #fff;';
  btn.onmouseover=function(){this.style.background='transparent';this.style.color='#fff';};
  btn.onmouseout=function(){this.style.background='#fff';this.style.color='#000';};
  var skip=document.createElement('button');skip.textContent=t.skip;
  skip.style.cssText='display:block;margin:16px auto 0;background:none;border:none;color:rgba(255,255,255,.55);font-size:11px;font-weight:600;letter-spacing:.1em;cursor:pointer;font-family:Montserrat,sans-serif;transition:color .2s;padding:8px 16px;';
  skip.onmouseover=function(){this.style.color='rgba(255,255,255,.9)';};
  skip.onmouseout=function(){this.style.color='rgba(255,255,255,.55)';};
  var _countdown=3;var _timer=null;
  skip.textContent=t.skip+' ('+_countdown+')';skip.disabled=true;skip.style.opacity='0.4';
  function closeInterstitial(){if(_timer)clearInterval(_timer);overlay.style.opacity='0';unlockScroll();setTimeout(function(){if(overlay.parentNode)overlay.parentNode.removeChild(overlay);},400);if(callback)callback();}
  skip.onclick=function(){closeInterstitial();};
  box.appendChild(tag);box.appendChild(h);box.appendChild(desc);box.appendChild(btn);box.appendChild(skip);
  overlay.appendChild(box);document.body.appendChild(overlay);lockScroll();
  requestAnimationFrame(function(){overlay.style.opacity='1';});
  _timer=setInterval(function(){_countdown--;if(_countdown>0){skip.textContent=t.skip+' ('+_countdown+')';}else{clearInterval(_timer);skip.textContent=t.skip;skip.disabled=false;skip.style.opacity='1';}},1000);
}

function navigateWithInterstitial(url){
  if(!isStandardOrAbove()&&_interstitialCount<_INTERSTITIAL_MAX){
    showPremiumInterstitial(function(){window.location.href=url;});
    return;
  }
  window.location.href=url;
}
</script>

// 2026-07-26 — 폴백을 한국어에서 영어로 + 키 단위 영어 폴백.
function setLang(l){localStorage.setItem('pap-lang',l);var d=L[l]||L.en||L.ko;function _tk(k){return d[k]||(L.en&&L.en[k]);}document.querySelectorAll('[data-i18n]').forEach(function(e){var v=_tk(e.getAttribute('data-i18n'));if(v)e.textContent=v;});var _b=_tk('body');if(_b)document.getElementById('contactBody').innerHTML=_b;var _f=_tk('ft');if(_f)document.getElementById('footerLegal').innerHTML=_f;var _s=document.getElementById('langSelect');if(_s)_s.value=l;_contactApplyOffices();}
// ── 전역 setLang 충돌 해소 (2026-07-26) ───────────────────────────────
// pap-i18n.js(defer) 가 전역 setLang 을 덮어써, 언어 선택기로 바꿀 때
// 이 페이지 전용 사전이 반영되지 않았다. 덮어쓰이기 전 참조를 잡아
// "공용 처리 → 페이지 사전" 순서로 이어서 적용한다.
var _papPageSetLang = setLang;
document.addEventListener('DOMContentLoaded', function(){
  var g = window.setLang;
  if(typeof g !== 'function'){ window.setLang = _papPageSetLang; return; }
  if(g === _papPageSetLang || g._papPageChained) return;
  var chained = function(l){
    try{ g.apply(this, arguments); }catch(e){}
    try{ _papPageSetLang(l); }catch(e){}
  };
  chained._papPageChained = true;
  window.setLang = chained;
});

// QA #326 — /api/settings?key=contact_page (관리자 저장 오피스 주소) 반영.
// 첫 번째 .contact-block 은 [h3 IT라벨, p 주소, h3 KR라벨, p 주소] 구조 —
// 주소 <p> 두 개만 admin 값으로 교체 (오피스 라벨은 언어별 번역 유지).
// setLang 이 contactBody 를 매번 다시 그리므로 setLang 끝에서 재적용.
// fetch 실패/미설정 시 내장 기본 주소로 그대로 동작.
var _contactSettings=null;
function _contactTextToHtml(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function _contactApplyOffices(){
  if(!_contactSettings) return;
  var block=document.querySelector('#contactBody .contact-grid .contact-block');
  if(!block) return;
  var ps=block.querySelectorAll(':scope > p');
  if(_contactSettings.office_it && ps[0]) ps[0].innerHTML=_contactTextToHtml(_contactSettings.office_it);
  if(_contactSettings.office_kr && ps[1]) ps[1].innerHTML=_contactTextToHtml(_contactSettings.office_kr);
  // QA #327 — Email 섹션: contactBody 내 mailto 앵커의 주소·표기 교체.
  if(_contactSettings.email){
    var mail=String(_contactSettings.email).trim();
    document.querySelectorAll('#contactBody a[href^="mailto:"]').forEach(function(a){
      a.setAttribute('href','mailto:'+mail);
      a.textContent=mail;
    });
  }
  // QA #328 — 미디어킷 제목: 두 번째 contact-block 의 두 번째 h3
  // ([Email, MEDIA KIT] 순서 — 전 언어 동일 구조 검증 완료).
  if(_contactSettings.mediakit_title){
    var blocks=document.querySelectorAll('#contactBody .contact-grid .contact-block');
    var b2=blocks[1];
    if(b2){
      var h3s=b2.querySelectorAll(':scope > h3');
      if(h3s[1]) h3s[1].textContent=_contactSettings.mediakit_title;
    }
  }
}
fetch('/api/settings?key=contact_page')
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(j){
    var v=j&&j.value; if(!v) return;
    _contactSettings=v;
    // QA #328 — 미디어킷 다운로드 링크 override 세팅.
    if(v.mediakit_link_en||v.mediakit_link_ko){
      _contactMediaKitLinks={en:v.mediakit_link_en||'',ko:v.mediakit_link_ko||''};
    }
    _contactApplyOffices();
  })
  .catch(function(e){ console.warn('[contact] settings fetch failed',e); });
// Media Kit — open Google Drive preview page in a new tab.

// 다운로드 버튼으로 저장 가능해 안정적.
var mediaKitFiles={ko:'1gUeTUJrg-NLv8BUT1BnEzfa3oqXfFt3X',en:'1gVKLuOP2mksORuDuugV6_Ls0XAiQwo7S'};

var _contactMediaKitLinks=null;
function downloadMediaKit(lang){
  if(_contactMediaKitLinks && _contactMediaKitLinks[lang]){
    window.open(_contactMediaKitLinks[lang],'_blank','noopener');
    return;
  }
  var fid=mediaKitFiles[lang]||mediaKitFiles.en;
  window.open('https://drive.google.com/file/d/'+fid+'/view','_blank','noopener');
}
// AUTO LANGUAGE DETECTION
(function(){
  var saved=localStorage.getItem('pap-lang');
  if(!saved){
    var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
    var lang=navigator.language||navigator.userLanguage||'';
    lang=lang.toLowerCase();
    if(lang.startsWith('ko')||tz.indexOf('Seoul')>-1) saved='ko';
    else if(lang.startsWith('ja')||tz.indexOf('Tokyo')>-1) saved='ja';
    else if(lang.startsWith('zh')||tz.indexOf('Shanghai')>-1||tz.indexOf('Beijing')>-1||tz.indexOf('Chongqing')>-1||tz.indexOf('Hong_Kong')>-1||tz.indexOf('Taipei')>-1) saved='zh';
    else if(lang.startsWith('it')||tz.indexOf('Rome')>-1) saved='it';
    else if(lang.startsWith('fr')||tz.indexOf('Paris')>-1) saved='fr';
    else if(lang.startsWith('es')||tz.indexOf('Madrid')>-1||tz.indexOf('Mexico')>-1) saved='es';
    else if(lang.startsWith('ru')||tz.indexOf('Moscow')>-1||tz.indexOf('Petersburg')>-1) saved='ru';
    else saved='en';
    localStorage.setItem('pap-lang',saved);
  }
  setLang(saved);
})();
