<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Montserrat',sans-serif;background:#000;color:#fff;min-height:100vh;overflow-x:hidden}
a{color:#fff;text-decoration:none}
.side-nav{position:fixed;left:0;top:0;width:80px;height:100vh;display:flex;flex-direction:column;align-items:center;padding-top:32px;z-index:100;transition:transform .4s cubic-bezier(.22,1,.36,1)}
.nav-dots{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:36px;transition:border-color .3s,background .3s}
.nav-dots:hover{border-color:#fff}
.nav-dots.open{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.08)}
.nav-dots span{font-size:18px;letter-spacing:2px;color:rgba(255,255,255,.6);transition:color .3s}
.nav-dots.open span{color:#fff}
.nav-links{display:flex;flex-direction:column;gap:0;opacity:1;transition:opacity .3s,transform .3s;overflow-y:auto;max-height:calc(100vh - 60px);-ms-overflow-style:none;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-group-label{writing-mode:vertical-rl;font-size:9px;font-weight:600;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.18);padding:16px 0 10px;pointer-events:none}
.nav-links a{writing-mode:vertical-rl;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.3);transition:color .3s;padding:10px 0}
.nav-links a:hover{color:rgba(255,255,255,.7)}
.nav-links a.active{color:#fff}
.nav-divider{width:1px;height:20px;background:rgba(255,255,255,.1);margin:8px auto}
.content{margin-left:120px;padding:100px 60px 80px 0;max-width:900px}
h1{font-size:clamp(48px,8vw,90px);font-weight:800;letter-spacing:5px;text-transform:uppercase;margin-bottom:60px;line-height:1}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px}
.contact-block{font-size:14px;line-height:2.2;color:rgba(255,255,255,.75)}
.contact-block h3{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:8px}
.contact-block p{margin-bottom:24px}
.contact-block a{text-decoration:underline;text-underline-offset:3px;transition:opacity .2s}
.contact-block a:hover{opacity:.6}
.lang-selector{position:fixed;top:32px;right:40px;z-index:100}
.lang-selector select{background:transparent;color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.2);padding:6px 12px;font-size:11px;font-family:'Montserrat',sans-serif;letter-spacing:.1em;cursor:pointer}
.lang-selector select option{background:#000;color:#fff}
.footer-legal{margin-left:120px;padding:40px 60px 40px 0;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.3);line-height:2}
.footer-legal a{color:rgba(255,255,255,.3)}
@media(max-width:768px){
  .side-nav{width:50px;padding-top:20px}
  .side-nav .nav-group-label{font-size:8px;letter-spacing:.15em;padding:10px 0 6px}
  .side-nav .nav-links a{font-size:10px;letter-spacing:3px;padding:8px 0}
  .content{margin-left:60px;padding:60px 20px}
  h1{font-size:36px}
  .contact-grid{grid-template-columns:1fr;gap:32px}
  .footer-legal{margin-left:60px;padding:20px 20px}
}
/* HIDE OLD NAV — unified header active */
.lang-selector{display:none!important}
@media(max-width:768px){.content{padding-left:20px!important;padding-right:20px!important}}
</style>

<script>
// ======== SCROLL LOCK ========
var _scrollLockCount=0,_savedScrollY=0;
function lockScroll(){if(_scrollLockCount===0){_savedScrollY=window.scrollY;document.body.style.position='fixed';document.body.style.top='-'+_savedScrollY+'px';document.body.style.left='0';document.body.style.right='0';}_scrollLockCount++;}
function unlockScroll(){_scrollLockCount--;if(_scrollLockCount<=0){_scrollLockCount=0;document.body.style.position='';document.body.style.top='';document.body.style.left='';document.body.style.right='';window.scrollTo(0,_savedScrollY);}}

// ======== INTERSTITIAL AD + PREMIUM UPSELL ========
function isStandardOrAbove(){try{var betaOn=(typeof isBetaActive==='function'&&isBetaActive());if(betaOn){if(typeof isLoggedIn==='function'&&isLoggedIn())return true;if(localStorage.getItem('pap-token'))return true;var ub=localStorage.getItem('pap-user');if(ub){try{var pb=JSON.parse(ub);if(pb&&(pb.id||pb.email))return true;}catch(eb){}}}var u=localStorage.getItem('pap-user');if(!u)return false;var user=JSON.parse(u);return user&&(user.subscription==='standard'||user.subscription==='premium');}catch(e){return false;}}
var _interstitialCount=0;
var _INTERSTITIAL_MAX=2;
var _brandAds=[];
(function(){try{fetch(window.location.origin+'/api/ads',{credentials:'omit'}).then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&Array.isArray(j.ads))_brandAds=j.ads;}).catch(function(){});}catch(_){}})();
function _getNextBrandAd(){if(!_brandAds||_brandAds.length===0)return null;if(typeof _brandAdIdx==='undefined')_brandAdIdx=0;var ad=_brandAds[_brandAdIdx%_brandAds.length];_brandAdIdx++;return ad;}

function showPremiumInterstitial(callback){
  if(isStandardOrAbove()){if(callback)callback();return;}
  if(_interstitialCount>=_INTERSTITIAL_MAX){if(callback)callback();return;}
  _interstitialCount++;
  var brandAd=_getNextBrandAd();
  if(brandAd){_showBrandAdInterstitial(brandAd,callback);}else{_showPremiumUpsellInterstitial(callback);}
}

function _showBrandAdInterstitial(ad,callback){
  var overlay=document.createElement('div');
  overlay.id='premiumInterstitial';
  overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;transition:opacity .4s;';
  var label=document.createElement('div');
  label.textContent='AD'+(ad.brand?' · '+ad.brand:'');
  label.style.cssText='position:absolute;top:16px;left:20px;font-size:9px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.35);font-family:Montserrat,sans-serif;z-index:2;';
  overlay.appendChild(label);
  var mediaWrap=document.createElement('div');
  mediaWrap.style.cssText='position:relative;max-width:90vw;max-height:75vh;display:flex;align-items:center;justify-content:center;cursor:pointer;';
  var duration=ad.duration||3;
  if(ad.type==='video'){var video=document.createElement('video');video.src=ad.src;if(ad.poster)video.poster=ad.poster;video.autoplay=true;video.muted=true;video.playsInline=true;video.loop=true;video.style.cssText='max-width:90vw;max-height:75vh;object-fit:contain;border-radius:2px;';mediaWrap.appendChild(video);}else{var img=document.createElement('img');img.src=ad.src;img.alt=ad.brand||'Ad';img.style.cssText='max-width:90vw;max-height:75vh;object-fit:contain;border-radius:2px;';mediaWrap.appendChild(img);}
  if(ad.link){mediaWrap.onclick=function(){window.open(ad.link,'_blank');};}
  overlay.appendChild(mediaWrap);
  var lang=localStorage.getItem('pap-lang')||'ko';
  var skipTexts={ko:'건너뛰기',en:'Skip',it:'Salta',fr:'Passer',es:'Saltar',ja:'スキップ',zh:'跳过'};
  var skipLabel=skipTexts[lang]||skipTexts.en;
  var skip=document.createElement('button');
  skip.style.cssText='position:absolute;bottom:24px;right:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.55);font-size:11px;font-weight:600;letter-spacing:.1em;cursor:pointer;font-family:Montserrat,sans-serif;padding:8px 20px;border-radius:2px;transition:all .2s;z-index:2;';
  skip.onmouseover=function(){this.style.background='rgba(255,255,255,.15)';this.style.color='rgba(255,255,255,.9)';};
  skip.onmouseout=function(){this.style.background='rgba(255,255,255,.1)';this.style.color='rgba(255,255,255,.55)';};
  var _countdown=duration;var _timer=null;
  skip.textContent=skipLabel+' ('+_countdown+')';skip.disabled=true;
  function closeAd(){if(_timer)clearInterval(_timer);if(ad.type==='video'){var v=overlay.querySelector('video');if(v)v.pause();}overlay.style.opacity='0';unlockScroll();setTimeout(function(){if(overlay.parentNode)overlay.parentNode.removeChild(overlay);},400);if(callback)callback();}
  skip.onclick=function(){closeAd();};
  overlay.appendChild(skip);
  var premBadge=document.createElement('a');premBadge.href='subscribe.html';
  var premTexts={ko:'광고 없이 즐기기',en:'Go ad-free',it:'Senza pubblicità',fr:'Sans publicité',es:'Sin anuncios',ja:'広告なし',zh:'去除广告'};
  premBadge.textContent=premTexts[lang]||premTexts.en;
  premBadge.style.cssText='position:absolute;bottom:26px;left:24px;font-size:10px;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.3);text-decoration:none;font-family:Montserrat,sans-serif;transition:color .2s;z-index:2;';
  premBadge.onmouseover=function(){this.style.color='rgba(255,255,255,.7)';};
  premBadge.onmouseout=function(){this.style.color='rgba(255,255,255,.3)';};
  overlay.appendChild(premBadge);
  document.body.appendChild(overlay);lockScroll();
  requestAnimationFrame(function(){overlay.style.opacity='1';});
  _timer=setInterval(function(){_countdown--;if(_countdown>0){skip.textContent=skipLabel+' ('+_countdown+')';}else{clearInterval(_timer);skip.textContent=skipLabel;skip.disabled=false;skip.style.color='rgba(255,255,255,.7)';}},1000);
}

function _showPremiumUpsellInterstitial(callback){
  var lang=localStorage.getItem('pap-lang')||'ko';
  var texts={
    ko:{tag:'SUBSCRIBE',title:'광고 없이\n모든 콘텐츠를 즐기세요',desc:'구독으로 에디토리얼, 매거진,\n독점 콘텐츠를 제한 없이 감상하세요.',btn:'구독하기',skip:'건너뛰기'},
