<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAP STUDIO — 브랜드 콘텐츠 스튜디오 | PAP MAGAZINE</title>
<meta name="description" content="PAP STUDIO는 PAP KOREA의 콘텐츠 스튜디오입니다. 현장 취재·촬영·인터뷰·화보 제작 등 브랜드를 위한 비주얼 콘텐츠를 만듭니다.">
<link rel="canonical" href="https://www.pap-magazine.com/studio">
<meta property="og:type" content="website">
<meta property="og:title" content="PAP STUDIO — 브랜드 콘텐츠 스튜디오">
<meta property="og:description" content="현장 취재·촬영·인터뷰·화보 제작. 브랜드를 위한 비주얼 콘텐츠 스튜디오, PAP STUDIO.">
<meta property="og:url" content="https://www.pap-magazine.com/studio">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://static.wixstatic.com">
<link rel="preconnect" href="https://igcazquhkwxtqsaqpznx.supabase.co">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,800;0,900;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pap-styles.css?v=42">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans,'Inter',sans-serif);background:var(--bg,#f5f5f5);color:var(--text,#111);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.serif{font-family:var(--serif,'Playfair Display',Georgia,serif)}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
.red{color:var(--pap-red,#891717)}
.bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:20px 40px;background:rgba(245,245,245,.85);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--gray-200,#e5e5e5)}
.bar .logo{font-family:var(--serif);font-weight:800;font-size:20px;letter-spacing:1px}
.bar nav{display:flex;gap:26px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
.bar nav a{color:var(--gray-500,#777);transition:color .2s}.bar nav a:hover{color:var(--pap-red,#891717)}
.hero{padding:170px 40px 70px;max-width:1240px;margin:0 auto}
.hero .kicker{font-size:12px;font-weight:700;letter-spacing:5px;text-transform:uppercase;margin-bottom:24px}
.hero h1{font-family:var(--serif);font-weight:900;line-height:.92;letter-spacing:-1px;font-size:clamp(56px,12vw,168px)}
.hero .lede{margin-top:30px;max-width:640px;font-size:clamp(15px,1.6vw,19px);color:var(--gray-600,#555);line-height:1.9}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--gray-400,#999);margin-bottom:34px}
.services{padding:90px 0;border-top:1px solid var(--gray-200,#e5e5e5)}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.svc{padding:0 34px;border-right:1px solid var(--gray-200,#e5e5e5)}
.svc:first-child{padding-left:0}.svc:last-child{border-right:none;padding-right:0}
.svc .no{font-family:var(--serif);font-size:15px;font-weight:700;margin-bottom:18px}
.svc h3{font-family:var(--serif);font-size:24px;font-weight:800;line-height:1.15;margin-bottom:14px}
.svc p{font-size:14px;color:var(--gray-600,#555);line-height:1.9}
.svc .cta{display:inline-block;margin-top:18px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--pap-red,#891717);border-bottom:1px solid var(--pap-red,#891717);padding-bottom:2px}
.svc .cta:hover{opacity:.6}
.work{padding:90px 0;border-top:1px solid var(--gray-200,#e5e5e5)}
.work-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:38px;flex-wrap:wrap;gap:14px}
.work-head h2{font-family:var(--serif);font-size:clamp(32px,5vw,60px);font-weight:900;line-height:1;letter-spacing:-.5px}
.work-head .cnt{font-size:12px;font-weight:600;letter-spacing:1px;color:var(--gray-400,#999);text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{position:relative;aspect-ratio:3/4;overflow:hidden;background:#e9e9e9;display:block}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.22,1,.36,1)}
.tile:hover img{transform:scale(1.05)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 18px 16px;background:linear-gradient(to top,rgba(0,0,0,.76),transparent);color:#fff}
.tile .cap .b{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.85;margin-bottom:4px}
.tile .cap .t{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.2}
.contact{padding:100px 0 40px;border-top:1px solid var(--gray-200,#e5e5e5)}
.contact h2{font-family:var(--serif);font-size:clamp(40px,8vw,110px);font-weight:900;line-height:.9;letter-spacing:-1px;margin-bottom:32px}
.contact .mail{font-family:var(--serif);font-size:clamp(20px,3vw,38px);font-weight:700;color:var(--pap-red,#891717);border-bottom:2px solid var(--pap-red,#891717);padding-bottom:5px;display:inline-block}
.contact .mail:hover{opacity:.65}
.contact .row{display:flex;gap:52px;flex-wrap:wrap;margin-top:48px}
.contact .row .item{max-width:300px}
.contact .row .item .lbl{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gray-400,#999);margin-bottom:12px}
.contact .row .item p{font-size:14px;color:var(--gray-600,#555);line-height:1.9}
.contact .row .item a{color:var(--pap-red,#891717);border-bottom:1px solid rgba(137,23,23,.4)}
footer.foot{margin-top:80px;padding:30px 0;border-top:1px solid var(--gray-200,#e5e5e5);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:11px;letter-spacing:.5px;color:var(--gray-400,#999);text-transform:uppercase}
footer.foot a:hover{color:var(--pap-red,#891717)}
/* detail */
.detail{padding:140px 0 80px}
.detail .back{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray-500,#777)}
.detail .back:hover{color:var(--pap-red,#891717)}
.detail .brand{margin-top:30px;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.detail h1{font-family:var(--serif);font-size:clamp(34px,6vw,72px);font-weight:900;line-height:1.02;letter-spacing:-.5px;margin:14px 0 18px}
.detail .metaline{font-size:13px;color:var(--gray-500,#777);letter-spacing:.5px;margin-bottom:26px}
.detail .desc{max-width:720px;font-size:15px;color:var(--gray-600,#555);line-height:2;white-space:pre-line;margin-bottom:20px}
.detail .filmcta{display:inline-block;margin-bottom:44px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border:1px solid #111;padding:12px 24px}
.detail .filmcta:hover{background:#111;color:#fff}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.gal img{width:100%;height:auto;background:#e9e9e9}
.loading{padding:200px 40px;text-align:center;color:var(--gray-400,#999);font-size:13px;letter-spacing:1px}
@media(max-width:820px){
  .wrap{padding:0 22px}.bar{padding:16px 22px}.bar nav{gap:16px}
  .hero{padding:120px 22px 60px}
  .svc-grid{grid-template-columns:1fr}
  .svc,.svc:first-child,.svc:last-child{border-right:none;border-bottom:1px solid var(--gray-200,#e5e5e5);padding:30px 0}.svc:last-child{border-bottom:none}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .gal{grid-template-columns:1fr}
  .detail{padding:110px 0 60px}
}
@media(max-width:480px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="bar">
  <a href="/studio" class="logo">PAP STUDIO</a>
  <nav>
    <a href="/studio#work">Work</a>
    <a href="/studio#services">Services</a>
    <a href="/studio#contact">Contact</a>
    <a href="https://www.pap-magazine.com">Magazine</a>
  </nav>
</div>

<main id="app"><div class="loading">불러오는 중…</div></main>

<script>
var API = '/api/studio';
// 텍스트·속성 양쪽에서 안전하도록 따옴표까지 이스케이프(감사 규약: submission-pullletter-audit).
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
// Wix base URL 이면 표시용 변환(webp), 우리 스토리지면 그대로.
function imgFill(u,w,h){
  if(!u) return '';
  if(/static\.wixstatic\.com\/media\//.test(u) && !/\/v1\//.test(u)){
    var id=(u.match(/media\/([^/]+~mv2\.(?:jpg|jpeg|png))/)||[])[1]||'x.jpg';
    return u+'/v1/fill/w_'+w+',h_'+h+',al_c,q_85,enc_auto/'+id.replace(/\.(jpg|jpeg|png)$/,'.webp');
  }
  return u;
}
function imgFit(u,w){
  if(!u) return '';
  if(/static\.wixstatic\.com\/media\//.test(u) && !/\/v1\//.test(u)){
    var id=(u.match(/media\/([^/]+~mv2\.(?:jpg|jpeg|png))/)||[])[1]||'x.jpg';
    return u+'/v1/fit/w_'+w+',q_88,enc_auto/'+id.replace(/\.(jpg|jpeg|png)$/,'.webp');
  }
  return u;
}

var SVC = [
  ['01','Brand Contents Advertising','당사 플랫폼은 귀하의 브랜드에서 제공하는 컨텐츠를 홍보합니다. 관심 있는 브랜드 및 홍보 담당자들은 아래 이메일을 통해 문의해주세요.',null],
  ['02','Work With PAP','PAP KOREA는 현장 취재 및 촬영 그리고 인터뷰와 화보 제작 등 브랜드를 위한 컨텐츠 제작 합니다. 관심 있는 브랜드 및 홍보 담당자들은 아래 이메일을 통해 문의해주세요.',null],
  ['03','Shooting Cost Estimator','촬영 프로젝트의 가견적을 지금 바로 산출해 보세요.','https://6970f1381fc42a2b4138c164--bejewelled-cheesecake-5efe26.netlify.app']
];

function landing(projects){
  var svc = SVC.map(function(s){
    return '<div class="svc"><div class="no red">'+s[0]+'</div><h3>'+esc(s[1])+'</h3><p>'+esc(s[2])+'</p>'+
      (s[3]?'<a class="cta" href="'+s[3]+'" target="_blank" rel="noopener">견적 산출하러 가기 →</a>':'')+'</div>';
  }).join('');
  var tiles = projects.map(function(p){
    var img = imgFill(p.cover_url, 700, 933);
    return '<a class="tile" href="/studio?p='+encodeURIComponent(p.slug)+'">'+
      (img?'<img loading="lazy" src="'+img+'" alt="'+esc(p.title)+'">':'')+
      '<div class="cap">'+(p.brand?'<div class="b">'+esc(p.brand)+'</div>':'')+'<div class="t">'+esc(p.title)+'</div></div></a>';
  }).join('');
  return ''+
  '<header class="hero"><div class="kicker red">PAP KOREA · CONTENT STUDIO</div>'+
    '<h1 class="serif">PAP STUDIO</h1>'+
    '<p class="lede">PAP KOREA는 현장 취재 및 촬영 그리고 인터뷰와 화보 제작 등 브랜드를 위한 컨텐츠 제작 합니다.</p></header>'+
  '<section class="services" id="services"><div class="wrap"><div class="eyebrow">What We Do</div>'+
    '<div class="svc-grid">'+svc+'</div></div></section>'+
  '<section class="work" id="work"><div class="wrap"><div class="work-head">'+
    '<h2 class="serif">Projects</h2><div class="cnt">'+projects.length+' Campaigns</div></div>'+
    '<div class="grid">'+tiles+'</div></div></section>'+
  '<section class="contact" id="contact"><div class="wrap"><div class="eyebrow">Let\'s Get Started</div>'+
    '<h2 class="serif">Work With Us</h2>'+
    '<a class="mail" href="mailto:contact@papkorea.com?subject=PAP%20STUDIO%20문의">contact@papkorea.com</a>'+
    '<div class="row">'+
      '<div class="item"><div class="lbl">Brand &amp; Advertising</div><p>브랜드 콘텐츠 광고·협업 문의는 위 이메일로 프로젝트 개요와 함께 보내주세요.</p></div>'+
      '<div class="item"><div class="lbl">Shooting</div><p>촬영 견적은 <a href="'+SVC[2][3]+'" target="_blank" rel="noopener">가견적 산출기</a>에서 바로 확인하세요.</p></div>'+
    '</div>'+
    '<footer class="foot"><span>© PAP MAGAZINE (PAP KOREA)</span><span><a href="https://www.pap-magazine.com">pap-magazine.com</a></span></footer>'+
  '</div></section>';
}

function detail(d){
  var p=d.project, film=d.film;
  var meta=[]; if(p.location) meta.push(esc(p.location)); if(p.brand) meta.push(esc(p.brand));
  var gal=(p.images||[]).map(function(u){ return '<img loading="lazy" src="'+imgFit(u,1400)+'" alt="'+esc(p.title)+'">'; }).join('');
  var filmUrl = (film&&film.video_url) ? film.video_url : (p.film_slug?('/studio?p='+encodeURIComponent(p.film_slug)):null);
  return '<div class="wrap detail">'+
    '<a class="back" href="/studio#work">← All Projects</a>'+
    (p.brand?'<div class="brand red">'+esc(p.brand)+'</div>':'')+
    '<h1 class="serif">'+esc(p.title)+'</h1>'+
    (meta.length?'<div class="metaline">'+meta.join('  ·  ')+'</div>':'')+
    (p.description?'<div class="desc">'+esc(p.description)+'</div>':'')+
    (filmUrl?'<a class="filmcta" href="'+filmUrl+'"'+(/^http/.test(filmUrl)?' target="_blank" rel="noopener"':'')+'>▶ Watch Film</a>':'')+
    '<div class="gal">'+gal+'</div>'+
  '</div>';
}

(function(){
  var app=document.getElementById('app');
  var slug=new URLSearchParams(location.search).get('p');
  var url = slug ? (API+'?slug='+encodeURIComponent(slug)) : API;
  fetch(url).then(function(r){return r.json();}).then(function(j){
    if(slug){
      if(!j.project){ app.innerHTML='<div class="loading">프로젝트를 찾을 수 없어요.</div>'; return; }
      document.title=j.project.title+' — PAP STUDIO';
      app.innerHTML=detail(j);
      window.scrollTo(0,0);
    } else {
      app.innerHTML=landing(j.projects||[]);
      if(location.hash){ var el=document.querySelector(location.hash); if(el) el.scrollIntoView(); }
    }
  }).catch(function(){ app.innerHTML='<div class="loading">불러오지 못했어요. 잠시 후 다시 시도해 주세요.</div>'; });
})();
</script>
</body>
</html>
