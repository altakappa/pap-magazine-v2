<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Pinterest 자동 발행 진단 — PAP 관리자 도구</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; margin: 0; background: #fafafa; color: #111; }
  header { background: #e60023; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .5px; }
  header .schedule { margin-left: auto; font-size: 12px; opacity: .9; }
  header button { border: 1px solid #fff; background: transparent; color: #fff; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-family: inherit; margin-left: 8px; }
  header button:hover { background: #fff; color: #e60023; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 20px 80px; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 12px; letter-spacing: 1px; margin: 0 0 12px; color: #666; text-transform: uppercase; }
  .kv { display: grid; grid-template-columns: 180px 1fr; gap: 6px 16px; font-size: 13px; line-height: 1.6; }
  .kv .k { color: #888; }
  .kv .v.ok { color: #059669; font-weight: 700; }
  .kv .v.warn { color: #ca8a04; font-weight: 700; }
  .kv .v.error { color: #dc2626; font-weight: 700; }
  .diag { list-style: none; padding: 0; margin: 0; }
  .diag li { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; line-height: 1.5; }
  .diag li.ok    { background: #f0fdf4; border-left: 4px solid #059669; color: #065f46; }
  .diag li.info  { background: #eff6ff; border-left: 4px solid #2563eb; color: #1e3a8a; }
  .diag li.warn  { background: #fefce8; border-left: 4px solid #ca8a04; color: #713f12; }
  .diag li.error { background: #fef2f2; border-left: 4px solid #dc2626; color: #7f1d1d; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 100px; padding: 12px 14px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; text-align: center; }
  .stat .n { font-size: 26px; font-weight: 800; }
  .stat .l { font-size: 11px; color: #666; margin-top: 4px; letter-spacing: .5px; text-transform: uppercase; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #f2f2f2; vertical-align: top; }
  th { font-size: 11px; letter-spacing: 1px; color: #888; text-transform: uppercase; background: #fafafa; }
  a { color: #e60023; }
  .actions a { display: inline-block; padding: 4px 10px; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 12px; text-decoration: none; margin-right: 6px; color: #000; }
  #status { padding: 40px 20px; text-align: center; color: #888; font-size: 14px; }
  .spin { display: inline-block; width: 18px; height: 18px; border: 2px solid #ddd; border-top-color: #e60023; border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -4px; margin-right: 8px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .code { font-family: 'Menlo', monospace; font-size: 12px; color: #444; }
  .action-panel { background: #fff5f5; border: 1px solid #fecaca; border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; font-size: 13px; line-height: 1.7; color: #7f1d1d; }
  .action-panel b { color: #dc2626; }
  .action-panel a { color: #dc2626; font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>P Pinterest 자동 발행 진단</h1>
  <span class="schedule">크론: KST 10 / 16 / 22 / 04시</span>
  <button onclick="load()">새로고침</button>
</header>
<main id="root"><div id="status">로딩 중…</div></main>
<script>
const TOKEN = localStorage.getItem('pap-token');
if (!TOKEN) document.getElementById('root').innerHTML = '<div id="status">관리자 로그인이 필요합니다. <a href="/admin">/admin</a> 에서 로그인 후 다시 열어주세요.</div>';

/* 2026-07-26 감사 B-6 — textContent→innerHTML 직렬화는 따옴표를 남긴다.
   그 값이 value="…" 같은 속성에 들어가면 ` onerror=` 로 속성을 빠져나온다.
   따옴표까지 직접 이스케이프해 텍스트·속성 양쪽에서 안전하게 만든다. */
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function ago(iso) {
  if (!iso) return '';
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return s + '초 전';
  if (s < 3600) return Math.round(s / 60) + '분 전';
  if (s < 86400) return Math.round(s / 3600) + '시간 전';
  return Math.round(s / 86400) + '일 전';
}

async function load() {
  if (!TOKEN) return;
  const root = document.getElementById('root');
  root.innerHTML = '<div id="status"><span class="spin"></span>진단 중… (Pinterest API 실검증)</div>';
  try {
    const res = await fetch('/api/admin/pinterest-diagnose', { headers: { Authorization: 'Bearer ' + TOKEN } });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || res.status);
    render(j);
  } catch (e) { root.innerHTML = '<div id="status">오류: ' + esc(e.message) + '</div>'; }
}

function render(d) {
  const root = document.getElementById('root');
  const env = d.env || {}, tok = d.token || {}, summary = d.summary || {};
  const tokenState = tok.valid
    ? '<span class="v ok">유효 · @' + esc(tok.user_display_name || '?') + (tok.target_board ? ' → 보드 "' + esc(tok.target_board.name) + '"' : '') + '</span>'
    : '<span class="v error">' + esc(tok.error || '미확인') + '</span>';
  const diagHtml = (d.diagnosis || []).map(x => '<li class="' + esc(x.level) + '">' + esc(x.msg) + '</li>').join('') || '<li class="info">진단 항목 없음.</li>';

  const pinnedRows = (d.recent_pinned || []).map(p =>
    '<tr>' +
      '<td>' + esc(ago(p.synced_at)) + '<div class="code" style="color:#aaa">' + esc((p.synced_at || '').slice(0, 19).replace('T', ' ')) + '</div></td>' +
      '<td>' + esc(p.title) + '</td>' +
      '<td class="actions">' +
        '<a href="' + esc(p.content_url) + '" target="_blank">에디토리얼 →</a>' +
        (p.pin_url ? '<a href="' + esc(p.pin_url) + '" target="_blank">Pinterest ↗</a>' : '') +
      '</td>' +
    '</tr>').join('') || '<tr><td colspan="3" style="text-align:center;color:#888;padding:20px">핀 기록 없음</td></tr>';

  const nextRows = (d.next_batch || []).map(c =>
    '<tr>' +
      '<td>' + esc((c.published_date || '').slice(0, 10)) + '</td>' +
      '<td>' + esc(c.title) + ' <a href="' + esc(c.content_url) + '" target="_blank" style="font-size:11px">에디토리얼 →</a></td>' +
    '</tr>').join('') || '<tr><td colspan="2" style="text-align:center;color:#888;padding:20px">대기 중인 후보 없음</td></tr>';

  const setupPanel = (!env.has_access_token || !env.has_board_id || !tok.valid)
    ? '<div class="action-panel"><b>활성화 순서:</b><br>' +
      '① <a href="https://developers.pinterest.com/apps/" target="_blank">Pinterest Developers</a> 앱 등록 (Business 계정 필요)<br>' +
      '② OAuth 2.0 → <span class="code">pins:write</span> + <span class="code">boards:read</span> 스코프로 Access Token 생성<br>' +
      '③ @pap_magazine Pinterest에 <span class="code">EDITORIAL</span> 이름의 보드 생성 → Board ID 복사<br>' +
      '④ Vercel 환경변수: <span class="code">PINTEREST_ACCESS_TOKEN</span>, <span class="code">PINTEREST_BOARD_ID</span><br>' +
      '⑤ 다음 크론(KST 10/16/22/04시)부터 자동 발행<br>' +
      '⑥ <b>주의: 토큰 30~60일 만료 자동 갱신 없음</b> — 캘린더에 50일 뒤 재발급 알림 설정</div>'
    : '';

  root.innerHTML =
    setupPanel +
    '<div class="card"><h2>종합 진단</h2><ul class="diag">' + diagHtml + '</ul></div>' +
    '<div class="card"><h2>현재 상태</h2><div class="stats">' +
      '<div class="stat"><div class="n">' + (summary.total_published || 0) + '</div><div class="l">전체 에디토리얼</div></div>' +
      '<div class="stat"><div class="n" style="color:#059669">' + (summary.pinned || 0) + '</div><div class="l">핀 완료</div></div>' +
      '<div class="stat"><div class="n" style="color:#ca8a04">' + (summary.pending || 0) + '</div><div class="l">대기</div></div>' +
      '<div class="stat"><div class="n" style="color:#dc2626">' + (summary.errored || 0) + '</div><div class="l">에러</div></div>' +
    '</div></div>' +
    '<div class="card"><h2>환경변수 / 토큰</h2><div class="kv">' +
      '<div class="k">PINTEREST_ACCESS_TOKEN</div><div class="v ' + (env.has_access_token ? 'ok' : 'error') + '">' + (env.has_access_token ? '설정됨' : '미설정') + '</div>' +
      '<div class="k">PINTEREST_BOARD_ID</div><div>' + (env.has_board_id ? '<span class="v ok">설정됨 (' + esc(env.board_id_masked) + ')</span>' : '<span class="v error">미설정</span>') + '</div>' +
      '<div class="k">CRON_SECRET</div><div class="v ' + (env.has_cron_secret ? 'ok' : 'warn') + '">' + (env.has_cron_secret ? '설정됨' : '미설정') + '</div>' +
      '<div class="k">토큰 실검증</div><div>' + tokenState + '</div>' +
      (tok.account_type ? '<div class="k">계정 유형</div><div class="v">' + esc(tok.account_type) + '</div>' : '') +
      (tok.target_board ? '<div class="k">대상 보드</div><div class="v">"' + esc(tok.target_board.name) + '" (' + esc(String(tok.target_board.pin_count)) + ' pins)</div>' : '') +
      '<div class="k">최근 sync</div><div class="v">' + (summary.last_synced_at ? (esc(ago(summary.last_synced_at)) + ' <span class="code">' + esc(summary.last_synced_at) + '</span>') : '(없음)') + '</div>' +
      '<div class="k">크론 스케줄</div><div class="v code">' + esc(d.schedule || '') + '</div>' +
    '</div></div>' +
    '<div class="card"><h2>최근 핀 완료 (10건)</h2>' +
      '<table><thead><tr><th style="width:130px">시각</th><th>에디토리얼</th><th style="width:220px">링크</th></tr></thead><tbody>' + pinnedRows + '</tbody></table></div>' +
    '<div class="card"><h2>다음 배치 후보 (최대 16)</h2>' +
      '<table><thead><tr><th style="width:100px">발행일</th><th>에디토리얼</th></tr></thead><tbody>' + nextRows + '</tbody></table></div>';
}

if (TOKEN) load();
</script>
</body>
</html>
