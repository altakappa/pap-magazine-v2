<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>운영 대시보드 — PAP 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* PAP web design tokens */
    --bg:#f5f5f5; --panel:#fff; --panel2:#ececec; --line:#e5e5e5; --hair:#eee;
    --ink:#111; --muted:#777; --faint:#999;
    --red:#891717; --red-hover:#6e1212; --red-dim:#c08a88;
    --gold:#c9a96e; --green:#2e7d32; --blue:#4a6b8a; --violet:#7a6ca8;
    --serif:'Playfair Display',Georgia,serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --mont:'Montserrat','Inter',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1240px;margin:0 auto;padding:30px 26px 90px}
  /* header */
  header{display:flex;justify-content:space-between;align-items:flex-end;
    flex-wrap:wrap;gap:16px;border-bottom:1.5px solid var(--ink);padding-bottom:20px}
  .brand{display:flex;align-items:baseline;gap:16px}
  .logo{font-family:var(--mont);font-weight:900;font-size:34px;letter-spacing:.06em;color:var(--ink)}
  .sub{font-family:var(--mont);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .backlink{font-family:var(--mont);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin-top:5px;display:inline-block;font-weight:600}
  .backlink:hover{color:var(--red)}
  .meta{text-align:right;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:7px}
  .live{display:inline-flex;align-items:center;gap:7px;font-family:var(--mont);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,125,50,.4)}70%{box-shadow:0 0 0 8px rgba(46,125,50,0)}100%{box-shadow:0 0 0 0 rgba(46,125,50,0)}}
  .upd b{color:var(--ink);font-weight:600}
  .btn{font-family:var(--mont);border:1px solid var(--ink);background:transparent;color:var(--ink);
    padding:7px 16px;border-radius:0;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;transition:.2s}
  .btn:hover{background:var(--ink);color:#fff}
  /* section titles — mirror .ed-row-label */
  h2{font-family:var(--mont);font-weight:700;font-size:14px;margin:44px 0 18px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:12px}
  h2 .bar{width:26px;height:2px;background:var(--red)}
  .grid{display:grid;gap:14px}
  /* KPI */
  .kpis{grid-template-columns:repeat(6,1fr)}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:18px 18px 16px;position:relative;overflow:hidden}
  .kpi .accent{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
  .kpi .lab{font-family:var(--mont);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .kpi .num{font-family:var(--serif);font-size:34px;font-weight:700;margin-top:10px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
  .kpi .fo{font-size:11.5px;color:var(--faint);margin-top:9px}
  .kpi .up{color:var(--green)} .kpi .warn{color:#9a6a12}
  /* layout */
  .cols{grid-template-columns:1.35fr 1fr;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:20px 22px}
  .card h3{font-family:var(--mont);margin:0 0 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair)}
  .row:last-child{border-bottom:none}
  .row .t{display:flex;align-items:baseline;gap:11px;min-width:0}
  .row .t .rank{font-family:var(--serif);color:var(--faint);font-size:13px;width:22px;flex:none;font-style:italic}
  .row .t .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:500}
  .row .d{font-size:11.5px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
  .row .v{font-size:12.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
  .row .v b{color:var(--ink);font-weight:700}
  .pill{font-family:var(--mont);font-size:9.5px;letter-spacing:.08em;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:0;flex:none;border:1px solid var(--line);color:var(--muted)}
  .pill.new{color:#fff;background:var(--red);border-color:var(--red)}
  .pill.rev{color:var(--blue);border-color:var(--blue)}
  .tag{font-size:11px;color:var(--faint)}
  /* charts */
  .chartcard{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:20px 22px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .axlab{fill:var(--faint);font-size:10px;font-family:var(--sans)} .glab{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums;font-family:var(--sans)}
  .barv{fill:var(--red)} .barv.dim{fill:var(--red-dim)}
  /* submissions */
  .subgrid{grid-template-columns:1fr 1fr;gap:16px}
  .stat-mini{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--hair);font-size:13px}
  .stat-mini:last-child{border-bottom:none}
  .stat-mini .n{font-variant-numeric:tabular-nums;font-weight:700}
  .sw{width:9px;height:9px;border-radius:0;display:inline-block;margin-right:9px;vertical-align:middle}
  footer{margin-top:50px;padding-top:20px;border-top:1px solid var(--line);font-family:var(--mont);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-weight:600}
  #status{padding:80px 20px;text-align:center;color:var(--muted);font-size:13px}
  .spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-4px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.cols{grid-template-columns:1fr}.subgrid{grid-template-columns:1fr}}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.wrap{padding:22px 16px 60px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">PAP</div>
      <div>
        <div class="sub">Magazine · Operations</div>
        <a class="backlink" href="/admin">← 관리자 홈</a>
      </div>
    </div>
    <div class="meta">
      <div class="live"><span class="dot"></span> Live · 사이트 DB</div>
      <div class="upd">최종 갱신 <b id="upd">—</b></div>
      <button class="btn" onclick="load()">새로고침</button>
    </div>
  </header>
  <main id="root"><div id="status"><span class="spin"></span>로딩 중…</div></main>
  <footer>
    <div>PAP MAGAZINE · Operations Dashboard</div>
    <div>열람 시점 스냅샷 · 새로고침으로 최신화</div>
  </footer>
</div>

<script>
const TOKEN = localStorage.getItem('pap-token');
const root = document.getElementById('root');
if (!TOKEN) {
  root.innerHTML = '<div id="status">관리자 로그인이 필요합니다. <a href="/admin" style="color:var(--red);font-weight:600">/admin</a> 에서 로그인 후 다시 열어주세요.</div>';
}

/* 2026-07-26 감사 B-6 — textContent→innerHTML 직렬화는 따옴표를 남긴다.
   그 값이 value="…" 같은 속성에 들어가면 ` onerror=` 로 속성을 빠져나온다.
   따옴표까지 직접 이스케이프해 텍스트·속성 양쪽에서 안전하게 만든다. */
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function nf(n){return (n==null?0:n).toLocaleString('ko-KR');}
function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}

async function load(){
  if(!TOKEN) return;
  root.innerHTML='<div id="status"><span class="spin"></span>집계 중…</div>';
  try{
    const res=await fetch('/api/admin/ops-dashboard',{headers:{Authorization:'Bearer '+TOKEN}});
    const j=await res.json();
    if(!res.ok) throw new Error(j.error||res.status);
    render(j);
  }catch(e){
    root.innerHTML='<div id="status">오류: '+esc(e.message)+'</div>';
  }
}

/* IG 아웃클릭 KPI — 2026-07-29.
   "오늘" 은 아직 끝나지 않은 하루다. 완료된 어제와 그냥 비교하면 매일 아침
   급감처럼 보인다(7/29 11시 23회 vs 7/28 종일 113회 = -80% 오탐). 그래서
   ① 진행 중임을 명시하고 ② 어제 '같은 시각까지' 값을 나란히 보여준다.
   두 번째 카드는 봇 판별용 — 사람은 IP 20~60개가 각 2.5~6회(모바일 우세),
   봇 스파이크는 IP 수백~천 개가 각 1.x회(데스크톱 90%+)로 나타난다. */
function outclickCards(d){
  if(d.outclicks_today==null) return '';
  const t = (d.outclicks_detail&&d.outclicks_detail.today)||{};
  const y = (d.outclicks_detail&&d.outclicks_detail.yesterday_same_hour)||{};
  const asOf = esc(d.outclicks_as_of_kst||'');
  const partial = d.outclicks_today_partial ? `오늘 진행 중 · ${asOf} KST 기준` : '';
  const dash = v => (v==null ? '—' : nf(v));
  const per  = v => (v==null ? '—' : v.toFixed ? v.toFixed(1) : String(v));
  const pct  = v => (v==null ? '—' : v+'%');
  const sampled = (t.truncated||y.truncated) ? ' · 표본 상한 도달' : '';
  return `
      <div class="kpi"><span class="accent" style="background:var(--blue)"></span>
        <div class="lab">IG 아웃클릭 · 오늘(KST)</div>
        <div class="num">${nf(d.outclicks_today)}</div>
        <div class="fo warn">${partial}<br>어제 같은 시각 ${nf(d.outclicks_yesterday_same_hour)}건 · 어제 종일 ${nf(d.outclicks_yesterday_full)}건</div>
      </div>
      <div class="kpi"><span class="accent" style="background:var(--violet)"></span>
        <div class="lab">아웃클릭 고유 IP · 오늘</div>
        <div class="num">${dash(t.unique_ips)}</div>
        <div class="fo">IP당 ${per(t.clicks_per_ip)}회 · 데스크톱 ${pct(t.desktop_pct)}<br>어제 같은 시각 IP ${dash(y.unique_ips)}개 · IP당 ${per(y.clicks_per_ip)}회${sampled}<br>IP당 1.x회 + 데스크톱 급증 = 봇 의심</div>
      </div>`;
}

/* 유입 · 전환 (2026-08-13) — 2026-08-12~13 에 만든 계측 세 개가 DB 에만 쌓이고
   어드민 어디에도 안 보였다. 숫자를 만들어 놓고 안 보면 없는 것과 같다.
   ⚠️ 네이버 애널리틱스 자체 수치는 여기 없다 — 네이버가 조회 API 를 안 연다.
      여기 naver 는 **우리 자체 계측**(utm 붙은 링크 클릭)이다. */
/* IG 성과 — 대표 숫자를 도달이 아니라 저장율로 둔다 (2026-08-16).
   근거: 전수 145편(도달 3,000+·전환 측정분)에서 팔로우'율' 과의 상관을 재봤다.
   아웃라이어 1편 제외 n=144:  저장율 0.464 > 좋아요율 0.378 > 공유율 0.140
   2026-08-17 재측정(n=144):  저장율 0.457 · 댓글율 0.417 · 좋아요율 0.347 · 공유율 0.148
   댓글이 애초에 비교에서 빠져 있었다. 저장과 동급이라 둘째 자리로 올린다.
                              > 도달 -0.045
   도달은 전환을 전혀 예측하지 못한다(-0.045). 저장이 가장 잘 맞는다 —
   저장은 "다시 보러 오겠다" 라 팔로우와 뜻이 가장 가깝다.
   (처음엔 게시물 두 건만 보고 '공유가 답' 이라고 썼다가 전수에서 뒤집혔다.)
   그리고 '안 보이는 건수'를 반드시 같이 띄운다 — 영상 49편 전부 전환 지표가
   비어 있는 걸 한 달 동안 아무도 몰랐다. */
/* 릴스 — 캐러셀과 다른 물건이라 따로 본다 (2026-08-17).
   릴스는 follows 를 영구히 못 받고(영상 81건 전부 NULL), 저장·공유·좋아요·댓글
   어느 참여율도 도달과 상관이 없다(전부 |r| < 0.12). 그래서 '얼마나 오래·몇 번
   봤는가' 로 본다. 반복재생은 API 가 폐기해서 조회 ÷ 도달 로 대신한다. */
function renderIgReels(d){
  const g = d.ig_reels; if (!g) return;
  const host = document.getElementById('igReels');
  const topHost = document.getElementById('igReelsTop');
  if (!host || !topHost) return;

  const line = (lab, val, foot, big) =>
    '<div style="display:flex;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid rgba(0,0,0,.06)">'
    + '<div style="width:128px;font-size:12px;color:var(--text3)">' + esc(lab) + '</div>'
    + '<div style="font-size:' + (big ? 24 : 17) + 'px;font-weight:700;min-width:88px">' + esc(val) + '</div>'
    + '<div style="font-size:11px;color:var(--text3)">' + esc(foot) + '</div>'
    + '</div>';

  host.innerHTML =
      line('평균 시청 시간', g.avg_watch_sec_median + '초',
           '중앙값 · 측정된 ' + nf(g.watch_measured_posts) + '편 기준', true)
    + line('반복재생', g.replay_rate_median + '회',
           '계정당 평균 재생 · 1.0 이면 아무도 두 번 안 봤다', true)
    + line('총 시청 시간', nf(g.total_watch_hours) + '시간', '측정된 릴스 합계')
    + line('릴스', nf(g.posts) + '편', '최근 30일')
    + (g.watch_blind_posts
        ? '<div style="margin-top:12px;padding:10px;border-radius:8px;background:rgba(200,60,60,.08);'
          + 'font-size:11px;line-height:1.7;color:var(--text2)">'
          + '<b style="color:#b03636">시청유지가 안 보이는 릴스 ' + nf(g.watch_blind_posts) + '편</b><br>'
          + '수집은 2026-08-17 에 시작했습니다. 그전 게시물은 값이 없습니다 — 시간이 지나야 찹니다.'
          + '</div>'
        : '')
    + '<div style="margin-top:10px;font-size:11px;color:var(--text3);line-height:1.6">'
    + '릴스를 따로 보는 이유: <b>팔로우 전환을 영구히 못 받습니다.</b><br>'
    + '영상 81건 전부 NULL 이었고(캐러셀은 567/567 수집), 따로 물어도 안 옵니다.<br>'
    + '게다가 릴스 30편에서 저장·공유·좋아요·댓글 <b>어느 참여율도 도달과 상관이 없습니다</b>'
    + ' (전부 |r| &lt; 0.12).<br>'
    + '캐러셀에서 통하던 지표가 릴스에선 안 통합니다. 그래서 시청유지로 봅니다.'
    + '</div>';

  const list = g.top_by_watch || [];
  topHost.innerHTML = (!list.length
    ? '<div style="font-size:12px;color:var(--text3)">아직 측정된 릴스가 없습니다 — 수집 개시 2026-08-17</div>'
    : '<table style="width:100%;border-collapse:collapse;font-size:12px">'
      + '<tr style="color:var(--text3);text-align:left">'
      + '<th style="padding:4px 0;font-weight:500">게시물</th>'
      + '<th style="padding:4px 0;font-weight:500;text-align:right">평균 시청</th>'
      + '<th style="padding:4px 0;font-weight:500;text-align:right">반복재생</th>'
      + '<th style="padding:4px 0;font-weight:500;text-align:right">도달</th>'
      + '<th style="padding:4px 0;font-weight:500;text-align:right">댓글</th></tr>'
      + list.map(function(p){
          const dt = p.posted_at ? String(p.posted_at).slice(5,10) : '—';
          const cell = p.permalink
            ? '<a href="' + esc(p.permalink) + '" target="_blank" rel="noopener">' + esc(dt) + ' · 릴스</a>'
            : esc(dt + ' · 릴스');
          return '<tr style="border-top:1px solid rgba(0,0,0,.06)">'
            + '<td style="padding:6px 0">' + cell + '</td>'
            + '<td style="padding:6px 0;text-align:right;font-weight:700">' + p.avg_watch_sec + '초</td>'
            + '<td style="padding:6px 0;text-align:right;font-weight:700">'
            + (p.replay_rate === null ? '—' : p.replay_rate + '회') + '</td>'
            + '<td style="padding:6px 0;text-align:right">' + nf(p.reach) + '</td>'
            + '<td style="padding:6px 0;text-align:right">' + nf(p.comments) + '</td></tr>';
        }).join('')
      + '</table>'
      + '<div style="margin-top:10px;font-size:11px;color:var(--text3);line-height:1.6">'
      + '도달이 아니라 평균 시청 시간 순입니다.<br>'
      + '반복재생은 조회 ÷ 도달 입니다 — 인스타가 clips_replays_count 를 2025-04 에'
      + ' 폐기해서 직접 지표가 없습니다.'
      + '</div>');
}

function renderIgPerf(d){
  const g = d.ig_perf || {};
  const host = document.getElementById('igPerf');
  const topHost = document.getElementById('igTop');
  if (!host || !topHost) return;

  if (!g.posts){
    host.innerHTML = '<div style="font-size:12px;color:var(--text3)">최근 30일 게시물 지표 없음</div>';
    topHost.innerHTML = '';
    return;
  }

  const line = (lab, val, foot, big) =>
    '<div style="display:flex;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid rgba(0,0,0,.06)">'
    + '<div style="width:112px;font-size:12px;color:var(--text3)">' + esc(lab) + '</div>'
    + '<div style="font-size:' + (big ? 24 : 17) + 'px;font-weight:700;min-width:88px">' + esc(val) + '</div>'
    + '<div style="font-size:11px;color:var(--text3)">' + esc(foot) + '</div>'
    + '</div>';

  host.innerHTML =

function renderFunnel(d){
  const f = d.funnel || {};
  const stepHost = document.getElementById('funnelSteps');
  const srcHost  = document.getElementById('inflowSrc');
  if (!stepHost || !srcHost) return;

  const pct = (a, b) => (!b ? '—' : (a / b * 100).toFixed(2) + '%');
  const steps = [
    { lab: '기사 조회',        v: f.article_views_7d,   fo: '오늘 ' + nf(f.article_views_today) },
    { lab: '구독 페이지 도달', v: f.subscribe_view_7d,  fo: '기사 대비 ' + pct(f.subscribe_view_7d, f.article_views_7d) },
    { lab: '활성 구독',        v: f.active_subs,        fo: '누적 · 기간 무관' },
  ];
  stepHost.innerHTML = steps.map(function(s, i){
    return '<div style="display:flex;align-items:baseline;gap:10px;padding:9px 0'
      + (i ? ';border-top:1px solid rgba(0,0,0,.06)' : '') + '">'
      + '<div style="width:112px;font-size:12px;color:var(--text3)">' + esc(s.lab) + '</div>'
      + '<div style="font-size:22px;font-weight:700;min-width:74px">' + nf(s.v) + '</div>'
      + '<div style="font-size:11px;color:var(--text3)">' + esc(s.fo) + '</div>'
      + '</div>';
  }).join('') +
  '<div style="margin-top:10px;font-size:11px;color:var(--text3);line-height:1.6">'
  + '기사 조회는 사이트 안에서 기사를 연 횟수입니다. 구독 페이지 도달은 그중 결제 안내까지 간 횟수입니다.<br>'
  + '네이버 애널리틱스 수치는 여기 없습니다 — <b>analytics.naver.com</b> 에서 보세요.'
  + '</div>';

  const list = f.inflow_by_src || [];

    ? '<div style="font-size:12px;color:var(--text3)">최근 30일 기록 없음</div>'

      + '<th style="padding:4px 0;font-weight:500;text-align:right">30일</th></tr>'
      + list.map(function(r){
          return '<tr style="border-top:1px solid rgba(0,0,0,.06)">'
            + '<td style="padding:6px 0">' + esc(r.src) + '</td>'
            + '<td style="padding:6px 0;text-align:right;font-weight:600">' + nf(r.d7) + '</td>'
            + '<td style="padding:6px 0;text-align:right;color:var(--text3)">' + nf(r.d30) + '</td>'
            + '</tr>';
        }).join('')
      + '</table>')
    + '<div style="margin-top:10px;font-size:11px;color:var(--text3)">'
    + '합계 7일 ' + nf(f.inflow_7d) + ' · 30일 ' + nf(f.inflow_30d)
    + ' — utm 꼬리표가 붙은 링크만 셉니다. 검색으로 그냥 들어온 사람은 안 잡힙니다.'

function drawBar(monthly){
  const svg=document.getElementById('barChart'); if(!svg) return;
  const W=640,H=240,pl=34,pr=10,pt=14,pb=28;
  const max=Math.max(1,...monthly.map(m=>m.count||0));
  const iw=W-pl-pr, ih=H-pt-pb, bw=iw/Math.max(1,monthly.length);
  let s=`<line x1="${pl}" y1="${pt+ih}" x2="${W-pr}" y2="${pt+ih}" stroke="#ddd"/>`;
  const step=niceStep(max);
  for(let g=0; g<=max; g+=step){const y=pt+ih-(g/max*ih);
    s+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="#eee"/>
        <text x="${pl-6}" y="${y+3}" text-anchor="end" class="axlab">${g}</text>`;}
  monthly.forEach((m,i)=>{
    const h=(m.count||0)/max*ih, x=pl+i*bw+bw*0.24, y=pt+ih-h, w=bw*0.52;
    const dim=i===monthly.length-1?' dim':'';
    s+=`<rect class="barv${dim}" x="${x}" y="${y}" width="${w}" height="${h}"><title>${m.label}: ${m.count}건</title></rect>
        <text x="${x+w/2}" y="${y-5}" text-anchor="middle" class="glab">${m.count}</text>
        <text x="${x+w/2}" y="${pt+ih+16}" text-anchor="middle" class="axlab">${m.label}</text>`;
  });
  svg.innerHTML=s;
}
function drawLine(daily){
  const svg=document.getElementById('lineChart'); if(!svg||!daily.length) return;
  const W=480,H=240,pl=30,pr=12,pt=16,pb=26;
  const vals=daily.map(d=>d.count||0), max=Math.max(1,...vals), iw=W-pl-pr, ih=H-pt-pb;
  const xs=i=>pl+i/Math.max(1,daily.length-1)*iw, ys=v=>pt+ih-v/max*ih;
  let path='',area=`M ${xs(0)} ${pt+ih} `;
  vals.forEach((v,i)=>{const x=xs(i),y=ys(v);path+=(i?'L':'M')+` ${x.toFixed(1)} ${y.toFixed(1)} `;area+=`L ${x.toFixed(1)} ${y.toFixed(1)} `;});
  area+=`L ${xs(daily.length-1)} ${pt+ih} Z`;
  let g=''; const step=niceStep(max);
  for(let gl=0; gl<=max; gl+=step){const y=ys(gl);
    g+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="#eee"/>
        <text x="${pl-6}" y="${y+3}" text-anchor="end" class="axlab">${gl}</text>`;}
  let dots='',xlab='';
  daily.forEach((d,i)=>{ if((d.count||0)>=max*0.66||i===daily.length-1) dots+=`<circle cx="${xs(i)}" cy="${ys(d.count)}" r="3" fill="var(--red)"><title>${d.label}: ${d.count}</title></circle>`;
    if(i%5===0||i===daily.length-1) xlab+=`<text x="${xs(i)}" y="${pt+ih+16}" text-anchor="middle" class="axlab">${d.label}</text>`;});
  svg.innerHTML=`<defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1">
     <stop offset="0" stop-color="var(--gold)" stop-opacity=".38"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>
     ${g}<path d="${area}" fill="url(#ag)"/>
     <path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xlab}`;
}
function niceStep(max){
  const raw=max/4, pow=Math.pow(10,Math.floor(Math.log10(raw||1)));
  const n=raw/pow; const m=n>=5?5:n>=2?2:1; return Math.max(1,m*pow);
}
