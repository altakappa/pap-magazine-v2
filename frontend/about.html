<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "inLanguage": "ko-KR", "mainEntity": [{"@type": "Question", "name": "PAP 매거진은 어떤 매체인가요?", "acceptedAnswer": {"@type": "Answer", "text": "PAP 매거진은 2018년 1월 이탈리아 밀라노에서 창간해 현재 서울을 기반으로 운영되는 하이엔드 아트 기반 패션·뷰티·컬쳐 디지털 매거진입니다. 전 세계 크리에이티브 팀과 협업해 매월 20편 이상의 정제된 오리지널 에디토리얼을 선보입니다."}}, {"@type": "Question", "name": "PAP에 에디토리얼을 어떻게 투고하나요?", "acceptedAnswer": {"@type": "Answer", "text": "투고 페이지 에서 전 세계 크리에이티브 팀 누구나 작품을 제출할 수 있습니다."}}, {"@type": "Question", "name": "브랜드가 PAP와 광고·협업하려면 어떻게 하나요?", "acceptedAnswer": {"@type": "Answer", "text": "언제든 편하게 contact@pap-magazine.com 으로 연락 주세요. 미디어킷과 함께 에디토리얼·필름·큐레이션 등 브랜드에 맞는 협업 방식을 안내해 드립니다."}}, {"@type": "Question", "name": "풀레터(Pull-Letter)는 무엇이고 어떻게 요청하나요?", "acceptedAnswer": {"@type": "Answer", "text": "풀레터는 PAP 크리에이티브 팀에게 원하는 에디토리얼 제작·협업을 요청하는 Premium 멤버 전용 기능입니다. 풀레터 페이지 에서 신청하면 검토 후 회신드립니다."}}, {"@type": "Question", "name": "PAP 콘텐츠는 무료인가요?", "acceptedAnswer": {"@type": "Answer", "text": "기본 콘텐츠는 무료입니다. 유료 멤버십은 Standard 월 $5.99, Premium 월 $9.49(연간 결제 시 2개월 무료)이며, Standard는 최근 6개월 에디토리얼·투고 피드백·이미지 다운로드, Premium은 전체 아카이브와 풀레터 요청까지 제공합니다. 자세히는 구독 페이지 ."}}, {"@type": "Question", "name": "PAP 에디토리얼 이미지를 다운로드할 수 있나요?", "acceptedAnswer": {"@type": "Answer", "text": "Standard 멤버부터 개인·비상업적 용도로 이미지를 다운로드할 수 있습니다. 상업적 사용은 contact@pap-magazine.com 으로 문의해 주세요."}}, {"@type": "Question", "name": "PAP는 얼마나 자주 발행하나요?", "acceptedAnswer": {"@type": "Answer", "text": "매월 20편 이상의 오리지널 에디토리얼을 발행하며, 분기별 볼륨(현재 VOL 31)으로 아카이빙합니다."}}, {"@type": "Question", "name": "PAP 매거진은 어디에 있나요?", "acceptedAnswer": {"@type": "Answer", "text": "서울 강남에 본사를 두고 이탈리아 밀라노에도 사무실을 운영합니다. 문의는 contact@pap-magazine.com ."}}]}</script>

<script>
// ======== SCROLL LOCK ========
var _scrollLockCount=0,_savedScrollY=0;
function lockScroll(){if(_scrollLockCount===0){_savedScrollY=window.scrollY;document.body.style.position='fixed';document.body.style.top='-'+_savedScrollY+'px';document.body.style.left='0';document.body.style.right='0';}_scrollLockCount++;}
function unlockScroll(){_scrollLockCount--;if(_scrollLockCount<=0){_scrollLockCount=0;document.body.style.position='';document.body.style.top='';document.body.style.left='';document.body.style.right='';window.scrollTo(0,_savedScrollY);}}

// ======== INTERSTITIAL AD + PREMIUM UPSELL ========
function isStandardOrAbove(){try{var betaOn=(typeof isBetaActive==='function'&&isBetaActive());if(betaOn){if(typeof isLoggedIn==='function'&&isLoggedIn())return true;if(localStorage.getItem('pap-token'))return true;var ub=localStorage.getItem('pap-user');if(ub){try{var pb=JSON.parse(ub);if(pb&&(pb.id||pb.email))return true;}catch(eb){}}}var u=localStorage.getItem('pap-user');if(!u)return false;var user=JSON.parse(u);return user&&(user.subscription==='standard'||user.subscription==='premium');}catch(e){return false;}}
var _interstitialCount=0;
var _INTERSTITIAL_MAX=2;
var _brandAds=[];
(function(){try{fetch(window.location.origin+'/api/ads',{credentials:'omit'}).then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&Array.isArray(j.ads))_brandAds=j.ads;}).catch(function(){});}catch(_){}})();
function _getNextBrandAd(){if(!_brandAds||_brandAds.length===0)return null;if(typeof _brandAdIdx==='undefined')_brandAdIdx=0;var ad=_brandAds[_brandAdIdx%_brandAds.length];_brandAdIdx++;return ad;}

function showPremiumInterstitial(callback){
  if(isStandardOrAbove()){if(callback)callback();return;}
  if(_interstitialCount>=_INTERSTITIAL_MAX){if(callback)callback();return;}
  _interstitialCount++;
  var brandAd=_getNextBrandAd();
  if(brandAd){_showBrandAdInterstitial(brandAd,callback);}else{_showPremiumUpsellInterstitial(callback);}
}

function _showBrandAdInterstitial(ad,callback){
  var overlay=document.createElement('div');
  overlay.id='premiumInterstitial';
  overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.95);display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;transition:opacity .4s;';
  var label=document.createElement('div');
  label.textContent='AD'+(ad.brand?' · '+ad.brand:'');
  label.style.cssText='position:absolute;top:16px;left:20px;font-size:9px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.35);font-family:Montserrat,sans-serif;z-index:2;';
  overlay.appendChild(label);
  var mediaWrap=document.createElement('div');
  mediaWrap.style.cssText='position:relative;max-width:90vw;max-height:75vh;display:flex;align-items:center;justify-content:center;cursor:pointer;';
  var duration=ad.duration||3;
  if(ad.type==='video'){var video=document.createElement('video');video.src=ad.src;if(ad.poster)video.poster=ad.poster;video.autoplay=true;video.muted=true;video.playsInline=true;video.loop=true;video.style.cssText='max-width:90vw;max-height:75vh;object-fit:contain;border-radius:2px;';mediaWrap.appendChild(video);}else{var img=document.createElement('img');img.src=ad.src;img.alt=ad.brand||'Ad';img.style.cssText='max-width:90vw;max-height:75vh;object-fit:contain;border-radius:2px;';mediaWrap.appendChild(img);}
  if(ad.link){mediaWrap.onclick=function(){window.open(ad.link,'_blank');};}
  overlay.appendChild(mediaWrap);
  var lang=localStorage.getItem('pap-lang')||'ko';
  var skipTexts={ko:'건너뛰기',en:'Skip',it:'Salta',fr:'Passer',es:'Saltar',ja:'スキップ',zh:'跳过'};
  var skipLabel=skipTexts[lang]||skipTexts.en;
  var skip=document.createElement('button');
  skip.style.cssText='position:absolute;bottom:24px;right:24px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.55);font-size:11px;font-weight:600;letter-spacing:.1em;cursor:pointer;font-family:Montserrat,sans-serif;padding:8px 20px;border-radius:2px;transition:all .2s;z-index:2;';
  skip.onmouseover=function(){this.style.background='rgba(255,255,255,.15)';this.style.color='rgba(255,255,255,.9)';};
  skip.onmouseout=function(){this.style.background='rgba(255,255,255,.1)';this.style.color='rgba(255,255,255,.55)';};
  var _countdown=duration;var _timer=null;
  skip.textContent=skipLabel+' ('+_countdown+')';skip.disabled=true;
  function closeAd(){if(_timer)clearInterval(_timer);if(ad.type==='video'){var v=overlay.querySelector('video');if(v)v.pause();}overlay.style.opacity='0';unlockScroll();setTimeout(function(){if(overlay.parentNode)overlay.parentNode.removeChild(overlay);},400);if(callback)callback();}
  skip.onclick=function(){closeAd();};
  overlay.appendChild(skip);
  var premBadge=document.createElement('a');premBadge.href='/subscribe';
  var premTexts={ko:'광고 없이 즐기기',en:'Go ad-free',it:'Senza pubblicità',fr:'Sans publicité',es:'Sin anuncios',ja:'広告なし',zh:'去除广告'};
  premBadge.textContent=premTexts[lang]||premTexts.en;
  premBadge.style.cssText='position:absolute;bottom:26px;left:24px;font-size:10px;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.3);text-decoration:none;font-family:Montserrat,sans-serif;transition:color .2s;z-index:2;';
  premBadge.onmouseover=function(){this.style.color='rgba(255,255,255,.7)';};
  premBadge.onmouseout=function(){this.style.color='rgba(255,255,255,.3)';};
  overlay.appendChild(premBadge);
  document.body.appendChild(overlay);lockScroll();
  requestAnimationFrame(function(){overlay.style.opacity='1';});
  _timer=setInterval(function(){_countdown--;if(_countdown>0){skip.textContent=skipLabel+' ('+_countdown+')';}else{clearInterval(_timer);skip.textContent=skipLabel;skip.disabled=false;skip.style.color='rgba(255,255,255,.7)';}},1000);
}

function _showPremiumUpsellInterstitial(callback){
  var lang=localStorage.getItem('pap-lang')||'ko';
  var texts={
    ko:{tag:'SUBSCRIBE',title:'광고 없이\n모든 콘텐츠를 즐기세요',desc:'구독으로 에디토리얼, 매거진,\n독점 콘텐츠를 제한 없이 감상하세요.',btn:'구독하기',skip:'건너뛰기'},
    en:{tag:'SUBSCRIBE',title:'Enjoy all content\nwithout interruptions',desc:'Subscribe for unlimited access\nto editorials, magazines, and exclusive content.',btn:'Subscribe',skip:'Skip'},
    ru:{tag:'SUBSCRIBE',title:'Enjoy all content\nwithout interruptions',desc:'Подпишитесь для неограниченного доступа\nк эдиториалам, журналам и эксклюзивному контенту.',btn:'Subscribe',skip:'Skip'},
    de:{tag:'SUBSCRIBE',title:'Enjoy all content\nwithout interruptions',desc:'Abonnieren Sie für unbegrenzten Zugang\nzu Editorials, Magazinen und exklusiven Inhalten.',btn:'Subscribe',skip:'Skip'},
    it:{tag:'SUBSCRIBE',title:'Goditi tutti i contenuti\nsenza interruzioni',desc:'Abbonati per accesso illimitato\na editoriali, riviste e contenuti esclusivi.',btn:'Abbonati',skip:'Salta'},
    fr:{tag:'SUBSCRIBE',title:'Profitez de tout le contenu\nsans interruption',desc:"Abonnez-vous pour un accès illimité\naux éditoriaux, magazines et contenus exclusifs.",btn:"S'abonner",skip:'Passer'},

ko:{about:'ABOUT',contact:'CONTACT',business:'BUSINESS',subscribe:'SUBSCRIBE',submission:'SUBMISSION',pullletter:'PULL-LETTER',aboutTitle:'ABOUT',
body:'<p>PAP Magazine는 2018년 1월 출범한 글로벌 디지털 매거진으로, 서울과 밀라노를 거점으로 하며 예술의 렌즈를 통해 패션, 뷰티, 문화를 다루는 미디어 플랫폼입니다. 단순한 트렌드 전달을 넘어 시각 언어, 이미지, 네러티브를 통해 동시대 문화를 해석하고 재구성하는 데 집중합니다.</p><p>PAP는 패션을 하나의 산업이나 스타일에 한정하지 않고 예술적 표현의 확장된 형태로 봅니다. 브랜드, 디자이너, 아티스트가 가진 고유한 세계관을 깊이 있게 분석하여 이를 감각적인 비주얼과 콘텐츠로 표현하고 완성도 높은 이미지로 구현합니다. 이러한 접근을 통해 종래의 정보 전달 중심의 매거진과 차별화된 예술작품으로 소비되는 에디토리얼을 제작합니다.</p><p>또한 PAP는 패션과 뷰티를 중심으로 음악, 서브컬처, 현대미술 등 다양한 문화적 요소를 유기적으로 연결합니다. 서로 다른 영역 간의 경계를 허물고 새로운 맥락을 만들어 콘텐츠를 통해 하나의 문화적 흐름을 제안하는 것을 목표합니다.</p><p>매거진의 역할을 넘어 PAP는 크리에이티브 스튜디오로서도 기능합니다. 글로벌 브랜드와의 협업을 통해 에디토리얼, 캠페인, 영상 콘텐츠를 제작하며 PAP만의 독특한 시각으로 브랜드 아이덴티티를 재해석합니다. 이를 통해 브랜드는 보다 직관적이고 강력한 이미지로 메시지를 전달할 수 있습니다.</p><p>서울과 밀라노를 축으로 아시아와 유럽의 감성이 교차하는 지점을 포착하는 PAP는 급변하는 글로벌 트렌드 환경에서 단순히 흐름을 반영하는 것을 넘어 새로운 방향성과 관점을 제시하는 플랫폼으로 자리매깁니다. 이러한 이중의 시각이 PAP의 차별화된 정체성을 이루며, 국제 네트워크와 협업을 통해 콘텐츠의 영향력을 지속적으로 확장해 나갑니다.</p><p>결과적으로 PAP는 단순한 매거진의 경계를 넘어 예술을 통해 패션, 뷰티, 문화를 연결하는 커뮤니티 플랫폼으로 기능하며, 현시대의 감성을 시각적으로 기록하고 제안하는 미디어로서 역할합니다.</p>',

en:{about:'ABOUT',contact:'CONTACT',business:'BUSINESS',subscribe:'SUBSCRIBE',submission:'SUBMISSION',pullletter:'PULL-LETTER',aboutTitle:'ABOUT',
body:'<p>PAP Magazine is a global digital magazine launched in January 2018, based in Seoul and Milan, serving as a media platform that covers fashion, beauty, and culture through the lens of art. Going beyond simple trend reporting, PAP focuses on interpreting and reconstructing contemporary culture through visual language, imagery, and narrative.</p><p>PAP views fashion not as confined to a single industry or style, but as an expanded form of artistic expression. By deeply analyzing the unique worldviews of brands, designers, and artists, PAP translates them into sensory visuals and content, realizing them as highly refined images. Through this approach, PAP creates editorials that are consumed as works of art, differentiated from conventional information-driven magazines.</p><p>Furthermore, PAP organically connects diverse cultural elements such as music, subculture, and contemporary art, centered around fashion and beauty. By breaking down boundaries between different domains and creating new contexts, PAP aims to propose a cultural movement through its content.</p><p>Beyond its role as a magazine, PAP also functions as a creative studio. Through collaborations with global brands, PAP produces editorials, campaigns, and video content, reinterpreting brand identities through its unique perspective. This enables brands to convey their messages through more intuitive and powerful imagery.</p><p>With Seoul and Milan as its axes, PAP captures the intersection where Asian and European sensibilities meet. In the rapidly changing global trend landscape, PAP positions itself as a platform that goes beyond simply reflecting trends to present new directions and perspectives. This dual vision forms PAP\'s distinctive identity, continuously expanding the reach of its content through international networks and collaborations.</p><p>Ultimately, PAP transcends the boundaries of a simple magazine, functioning as a community platform connecting fashion, beauty, and culture through art, and as a media that visually documents and proposes the sensibilities of our time.</p>',
ft:'<strong>ALTAKAPPA Co., Ltd.</strong> | CEO : Domenico Kang | Reg. 192-88-02644<br>1F, 18, Nonhyeon-ro 146-gil, Gangnam-gu, Seoul, Korea | <a href="mailto:contact@pap-magazine.com">contact@pap-magazine.com</a>'},
ru:{about:'ABOUT',contact:'CONTACT',business:'BUSINESS',subscribe:'SUBSCRIBE',submission:'SUBMISSION',pullletter:'PULL-LETTER',aboutTitle:'ABOUT',
body:'<p>PAP Magazine — глобальный цифровой журнал, запущенный в январе 2018 года, с базами в Сеуле и Милане. Это медиаплатформа, освещающая моду, красоту и культуру через призму искусства. Выходя за рамки простого освещения трендов, PAP сосредоточен на интерпретации и переосмыслении современной культуры через визуальный язык, образы и повествование.</p><p>PAP рассматривает моду не как нечто, ограниченное одной индустрией или стилем, а как расширенную форму художественного выражения. Глубоко анализируя уникальные мировоззрения брендов, дизайнеров и художников, PAP переводит их в чувственные визуальные образы и контент, воплощая их в предельно отточенных изображениях. Благодаря этому подходу PAP создаёт эдиториалы, которые воспринимаются как произведения искусства и отличаются от привычных журналов, ориентированных на информацию.</p><p>Более того, PAP органично связывает разнообразные культурные элементы — музыку, субкультуру и современное искусство — вокруг моды и красоты. Разрушая границы между разными областями и создавая новые контексты, PAP стремится через свой контент предлагать культурное движение.</p><p>Помимо роли журнала, PAP также функционирует как творческая студия. В сотрудничестве с мировыми брендами PAP создаёт эдиториалы, кампании и видеоконтент, переосмысляя айдентику брендов через собственную перспективу. Это позволяет брендам доносить свои сообщения через более интуитивные и выразительные образы.</p><p>Опираясь на Сеул и Милан как на свои оси, PAP улавливает точку пересечения азиатской и европейской чувственности. В стремительно меняющемся мире глобальных трендов PAP позиционирует себя как платформу, которая не просто отражает тренды, но и предлагает новые направления и взгляды. Это двойное видение формирует особую айдентику PAP, непрерывно расширяя охват его контента через международные сети и коллаборации.</p><p>В конечном счёте PAP выходит за пределы обычного журнала, выступая как коммьюнити-платформа, соединяющая моду, красоту и культуру через искусство, и как медиа, визуально документирующее и предлагающее чувственность нашего времени.</p>',
ft:'<strong>ALTAKAPPA Co., Ltd.</strong> | CEO : Domenico Kang | Рег. №: 192-88-02644<br>1F, 18, Nonhyeon-ro 146-gil, Gangnam-gu, Seoul, Корея | <a href="mailto:contact@pap-magazine.com">contact@pap-magazine.com</a>'},
de:{about:'ABOUT',contact:'CONTACT',business:'BUSINESS',subscribe:'SUBSCRIBE',submission:'SUBMISSION',pullletter:'PULL-LETTER',aboutTitle:'ABOUT',
body:'<p>PAP Magazine ist ein globales digitales Magazin, das im Januar 2018 gegründet wurde und seinen Sitz in Seoul und Mailand hat. Es dient als Medienplattform, die Mode, Beauty und Kultur durch die Linse der Kunst betrachtet. Über die bloße Trendberichterstattung hinaus konzentriert sich PAP darauf, die zeitgenössische Kultur durch visuelle Sprache, Bilder und Erzählung zu interpretieren und neu zu gestalten.</p><p>PAP versteht Mode nicht als auf eine einzelne Branche oder einen Stil beschränkt, sondern als eine erweiterte Form des künstlerischen Ausdrucks. Durch die tiefgehende Analyse der einzigartigen Weltanschauungen von Marken, Designern und Künstlern übersetzt PAP diese in sinnliche Visuals und Inhalte und setzt sie als hochveredelte Bilder um. Auf diese Weise schafft PAP Editorials, die als Kunstwerke wahrgenommen werden und sich von herkömmlichen, informationsgetriebenen Magazinen abheben.</p><p>Darüber hinaus verbindet PAP rund um Mode und Beauty vielfältige kulturelle Elemente wie Musik, Subkultur und zeitgenössische Kunst auf organische Weise. Indem es Grenzen zwischen verschiedenen Bereichen auflöst und neue Kontexte schafft, möchte PAP durch seine Inhalte eine kulturelle Bewegung anstoßen.</p><p>Über seine Rolle als Magazin hinaus fungiert PAP auch als Kreativstudio. In Zusammenarbeit mit globalen Marken produziert PAP Editorials, Kampagnen und Videoinhalte und interpretiert Markenidentitäten aus seiner eigenen Perspektive neu. So können Marken ihre Botschaften durch intuitivere und kraftvollere Bilder vermitteln.</p><p>Mit Seoul und Mailand als Achsen erfasst PAP den Schnittpunkt, an dem asiatische und europäische Sensibilität aufeinandertreffen. In der sich rasch wandelnden globalen Trendlandschaft positioniert sich PAP als Plattform, die Trends nicht nur widerspiegelt, sondern neue Richtungen und Perspektiven aufzeigt. Diese doppelte Vision bildet die unverwechselbare Identität von PAP und erweitert die Reichweite seiner Inhalte kontinuierlich durch internationale Netzwerke und Kollaborationen.</p><p>Letztlich sprengt PAP die Grenzen eines einfachen Magazins und fungiert als Community-Plattform, die Mode, Beauty und Kultur durch Kunst verbindet, sowie als Medium, das die Sensibilität unserer Zeit visuell dokumentiert und vorschlägt.</p>',
ft:'<strong>ALTAKAPPA Co., Ltd.</strong> | CEO : Domenico Kang | Reg.-Nr. 192-88-02644<br>1F, 18, Nonhyeon-ro 146-gil, Gangnam-gu, Seoul, Korea | <a href="mailto:contact@pap-magazine.com">contact@pap-magazine.com</a>'},
it:{about:'CHI SIAMO',contact:'CONTATTI',business:'BUSINESS',subscribe:'ABBONATI',aboutTitle:'CHI SIAMO',
body:'<p>PAP Magazine è una rivista digitale globale lanciata nel gennaio 2018, con sede a Seoul e Milano, che funge da piattaforma mediatica che copre moda, bellezza e cultura attraverso la lente dell\'arte. Andando oltre la semplice comunicazione delle tendenze, PAP si concentra sull\'interpretazione e ricostruzione della cultura contemporanea attraverso il linguaggio visivo, le immagini e la narrativa.</p><p>PAP vede la moda non come confinata a un singolo settore o stile, ma come una forma espansa di espressione artistica. Analizzando in profondità le visioni uniche di brand, designer e artisti, PAP le traduce in visual sensoriali e contenuti, realizzandoli come immagini altamente raffinate. Attraverso questo approccio, PAP crea editoriali che vengono fruiti come opere d\'arte, differenziandosi dalle riviste convenzionali orientate all\'informazione.</p><p>Inoltre, PAP collega organicamente diversi elementi culturali come musica, sottocultura e arte contemporanea, incentrati su moda e bellezza. Abbattendo i confini tra diversi ambiti e creando nuovi contesti, PAP mira a proporre un movimento culturale attraverso i suoi contenuti.</p><p>Oltre al suo ruolo di rivista, PAP funziona anche come studio creativo. Attraverso collaborazioni con brand globali, PAP produce editoriali, campagne e contenuti video, reinterpretando le identità dei brand attraverso la sua prospettiva unica.</p><p>Con Seoul e Milano come assi, PAP cattura l\'intersezione dove le sensibilità asiatiche ed europee si incontrano. Nel panorama delle tendenze globali in rapida evoluzione, PAP si posiziona come una piattaforma che va oltre il semplice riflesso delle tendenze per presentare nuove direzioni e prospettive.</p><p>In definitiva, PAP trascende i confini di una semplice rivista, funzionando come piattaforma comunitaria che collega moda, bellezza e cultura attraverso l\'arte, e come media che documenta e propone visivamente le sensibilità del nostro tempo.</p>',
ft:'<strong>ALTAKAPPA Co., Ltd.</strong> | CEO : Domenico Kang | P. IVA: 192-88-02644<br>1F, 18, Nonhyeon-ro 146-gil, Gangnam-gu, Seoul, Corea | <a href="mailto:contact@pap-magazine.com">contact@pap-magazine.com</a>'},
fr:{about:'À PROPOS',contact:'CONTACT',business:'BUSINESS',subscribe:"S'ABONNER",aboutTitle:'À PROPOS',
body:'<p>PAP Magazine est un magazine numérique mondial lancé en janvier 2018, basé à Séoul et Milan, servant de plateforme médiatique couvrant la mode, la beauté et la culture à travers le prisme de l\'art. Au-delà de la simple transmission des tendances, PAP se concentre sur l\'interprétation et la reconstruction de la culture contemporaine à travers le langage visuel, l\'imagerie et le récit.</p><p>PAP considère la mode non pas comme confinée à une seule industrie ou un seul style, mais comme une forme élargie d\'expression artistique. En analysant en profondeur les visions uniques des marques, designers et artistes, PAP les traduit en visuels sensoriels et en contenus, les réalisant comme des images hautement raffinées. À travers cette approche, PAP crée des éditoriaux qui sont consommés comme des œuvres d\'art, se différenciant des magazines conventionnels axés sur l\'information.</p><p>De plus, PAP relie organiquement divers éléments culturels tels que la musique, la sous-culture et l\'art contemporain, centrés autour de la mode et de la beauté. En brisant les frontières entre différents domaines et en créant de nouveaux contextes, PAP vise à proposer un mouvement culturel à travers son contenu.</p><p>Au-delà de son rôle de magazine, PAP fonctionne également comme un studio créatif. À travers des collaborations avec des marques mondiales, PAP produit des éditoriaux, des campagnes et des contenus vidéo, réinterprétant les identités des marques à travers sa perspective unique.</p><p>Avec Séoul et Milan comme axes, PAP capture l\'intersection où les sensibilités asiatiques et européennes se rencontrent. Dans un paysage de tendances mondiales en rapide évolution, PAP se positionne comme une plateforme qui va au-delà du simple reflet des tendances pour présenter de nouvelles directions et perspectives.</p><p>En fin de compte, PAP transcende les limites d\'un simple magazine, fonctionnant comme une plateforme communautaire reliant mode, beauté et culture à travers l\'art, et comme un média qui documente et propose visuellement les sensibilités de notre époque.</p>',

es:{about:'ACERCA DE',contact:'CONTACTO',business:'NEGOCIOS',subscribe:'SUSCRIBIRSE',aboutTitle:'ACERCA DE',
body:'<p>PAP Magazine es una revista digital global lanzada en enero de 2018, con sede en Seúl y Milán, que funciona como una plataforma mediática que cubre moda, belleza y cultura a través del prisma del arte. Más allá de la simple transmisión de tendencias, PAP se enfoca en interpretar y reconstruir la cultura contemporánea a través del lenguaje visual, la imagen y la narrativa.</p><p>PAP ve la moda no como algo confinado a una sola industria o estilo, sino como una forma expandida de expresión artística. Al analizar profundamente las visiones únicas de marcas, diseñadores y artistas, PAP las traduce en visuales sensoriales y contenido, realizándolas como imágenes altamente refinadas. A través de este enfoque, PAP crea editoriales que se consumen como obras de arte, diferenciándose de las revistas convencionales orientadas a la información.</p><p>Además, PAP conecta orgánicamente diversos elementos culturales como música, subcultura y arte contemporáneo, centrados en la moda y la belleza. Al derribar fronteras entre diferentes ámbitos y crear nuevos contextos, PAP busca proponer un movimiento cultural a través de su contenido.</p><p>Más allá de su papel como revista, PAP también funciona como estudio creativo. A través de colaboraciones con marcas globales, PAP produce editoriales, campañas y contenido de video, reinterpretando las identidades de marca a través de su perspectiva única.</p><p>Con Seúl y Milán como ejes, PAP captura la intersección donde las sensibilidades asiáticas y europeas se encuentran. En el panorama de tendencias globales en rápida evolución, PAP se posiciona como una plataforma que va más allá de simplemente reflejar tendencias para presentar nuevas direcciones y perspectivas.</p><p>En última instancia, PAP trasciende los límites de una simple revista, funcionando como una plataforma comunitaria que conecta moda, belleza y cultura a través del arte, y como un medio que documenta y propone visualmente las sensibilidades de nuestro tiempo.</p>',

ja:{about:'ABOUT',contact:'CONTACT',business:'BUSINESS',subscribe:'SUBSCRIBE',submission:'SUBMISSION',pullletter:'PULL-LETTER',aboutTitle:'ABOUT',
body:'<p>PAPマガジンは2018年1月にローンチした、ソウルとミラノを拠点に展開するグローバルデジタルマガジンであり、アートを基盤にファッション、ビューティー、そしてカルチャー全般を扱うメディアプラットフォームです。単純なトレンド伝達を超え、視覚的言語とイメージ、そしてナラティブを通じて同時代の文化を解釈し再構成することに集中しています。</p><p>PAPはファッションを一つの産業やスタイルに限定せず、芸術的表現の拡張された形態として捉えています。ブランド、デザイナー、アーティストが持つ固有の世界観を深く分析し、これを感覚的なビジュアルとコンテンツで表現し、完成度の高いイメージとして具現化しています。このアプローチにより、従来の情報伝達中心のマガジンとは差別化された、一つの「作品」として消費されるエディトリアルを制作しています。</p><p>またPAPはファッションとビューティーを中心に、音楽、サブカルチャー、現代美術など多様な文化的要素を有機的に結びつけています。異なる領域間の境界を取り払い、新たな文脈を生み出し、コンテンツを通じて一つの文化的な流れを提案することを目指しています。</p><p>マガジンの役割にとどまらず、PAPはクリエイティブスタジオとしての機能も果たしています。グローバルブランドとのコラボレーションを通じてエディトリアル、キャンペーン、映像コンテンツを制作し、ブランドのアイデンティティをPAP独自の視点で再解釈しています。</p><p>特にソウルとミラノを軸に、アジアとヨーロッパの感覚が交差するポイントを捉えています。急速に変化するグローバルトレンドの中で、PAPは流れを単に反映するのではなく、新しい方向性と視点を提示するプラットフォームとして位置づけられています。</p><p>結果として、PAPは単なるマガジンを超え、アートを基盤にファッション、ビューティー、カルチャーを結ぶコミュニティプラットフォームであり、同時代の感覚を視覚的に記録し提案するメディアとして機能しています。</p>',

body:'<p>PAP杂志是2018年1月创刊的、以首尔和米兰为基地展开的全球数字杂志，是以艺术为基础涵盖时尚、美容及文化全领域的媒体平台。超越简单的潮流传递，PAP专注于通过视觉语言、影像和叙事来解读和重构当代文化。</p><p>PAP不将时尚局限于单一产业或风格，而是将其视为艺术表达的扩展形式。通过深入分析品牌、设计师和艺术家所拥有的独特世界观，将其转化为感性的视觉和内容，实现为高度完成的影像。通过这种方式，PAP制作出有别于传统信息传递型杂志、作为"作品"被消费的时尚大片。</p><p>此外，PAP以时尚和美容为中心，有机地连接音乐、亚文化、当代艺术等多种文化元素。通过打破不同领域之间的界限、创造新的语境，致力于通过内容提出一种文化潮流。</p><p>不仅局限于杂志的角色，PAP同时也作为创意工作室发挥功能。通过与全球品牌的合作制作时尚大片、广告活动和视频内容，以PAP独特的视角重新诠释品牌身份。</p><p>特别是以首尔和米兰为轴心，捕捉亚洲和欧洲感性交汇的节点。在快速变化的全球趋势中，PAP不仅仅反映潮流，而是作为提出新方向和视角的平台而定位。这种双重视角形成了PAP独特的差异化身份，并以国际网络和合作为基础持续拓展内容的延展性。</p><p>最终，PAP超越了简单杂志的范畴，作为以艺术为基础连接时尚、美容和文化的社区平台，以及视觉记录和提出当代感性的媒体而运作。</p>',
ft:'<strong>ALTAKAPPA Co., Ltd.</strong> | CEO : Domenico Kang | 营业执照号 192-88-02644<br>首尔特别市江南区论岘路146街18, 1F | <a href="mailto:contact@pap-magazine.com">contact@pap-magazine.com</a>'},ru:{business:'БИЗНЕС',about:'О НАС',contact:'КОНТАКТ',subscribe:'ПОДПИСКА',submission:'ПОДАЧА',pullletter:'PULL-LETTER',aboutTitle:'О НАС',
body:'<p>PAP Magazine — это глобальный цифровой журнал, запущенный в январе 2018 года, базирующийся в Сеуле и Милане. Это медиа-платформа, охватывающая моду, красоту и культуру через призму искусства.</p><p>PAP рассматривает моду не как ограниченную одной индустрией или стилем, а как расширенную форму художественного выражения. Глубоко анализируя уникальные мировоззрения брендов, дизайнеров и художников, PAP переводит их в чувственные визуальные образы и контент.</p><p>Помимо своей роли журнала, PAP также функционирует как креативная студия, сотрудничая с мировыми брендами для создания редакционных материалов, кампаний и видеоконтента.</p>',

// 2026-07-26 — 폴백을 한국어에서 영어로 + 키 단위 영어 폴백. 자세한 배경은
// 아래 '전역 setLang 충돌 해소' 주석 참고.
function setLang(l){localStorage.setItem('pap-lang',l);var d=L[l]||L.en||L.ko;function _tk(k){return d[k]||(L.en&&L.en[k]);}document.querySelectorAll('[data-i18n]').forEach(function(e){var v=_tk(e.getAttribute('data-i18n'));if(v)e.textContent=v;});var _b=_tk('body');if(_b)document.getElementById('aboutBody').innerHTML=_b;var _f=_tk('ft');if(_f)document.getElementById('footerLegal').innerHTML=_f;var _s=document.getElementById('langSelect');if(_s)_s.value=l;}
// ── 전역 setLang 충돌 해소 (2026-07-26) ───────────────────────────────
// pap-i18n.js 는 defer 로 로드되며 전역 setLang 을 '자기 것'으로 덮어쓴다.
// 인라인 스크립트가 먼저 실행되므로 이 페이지의 setLang 은 항상 진다.
// 최초 로드는 아래 자동감지 IIFE 가 페이지 함수를 직접 불러 정상이지만,
// 언어 선택기(onchange="setLang(...)")로 바꾸면 공용 사전만 적용되고 이
// 페이지 전용 키가 이전 언어로 남았다. 덮어쓰이기 전에 참조를 잡아
// "공용 처리 → 페이지 사전" 순서로 이어서 적용한다.
var _papPageSetLang = setLang;
document.addEventListener('DOMContentLoaded', function(){
  var g = window.setLang;
  if(typeof g !== 'function'){ window.setLang = _papPageSetLang; return; }
  if(g === _papPageSetLang || g._papPageChained) return;
  var chained = function(l){
    try{ g.apply(this, arguments); }catch(e){}
    try{ _papPageSetLang(l); }catch(e){}
  };
  chained._papPageChained = true;
  window.setLang = chained;
});
// AUTO LANGUAGE DETECTION
(function(){
  var saved=localStorage.getItem('pap-lang');
  if(!saved){
    var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
    var lang=navigator.language||navigator.userLanguage||'';
    lang=lang.toLowerCase();
    if(lang.startsWith('ko')||tz.indexOf('Seoul')>-1) saved='ko';
    else if(lang.startsWith('ja')||tz.indexOf('Tokyo')>-1) saved='ja';
    else if(lang.startsWith('zh')||tz.indexOf('Shanghai')>-1||tz.indexOf('Beijing')>-1||tz.indexOf('Chongqing')>-1||tz.indexOf('Hong_Kong')>-1||tz.indexOf('Taipei')>-1) saved='zh';
    else if(lang.startsWith('it')||tz.indexOf('Rome')>-1) saved='it';
    else if(lang.startsWith('fr')||tz.indexOf('Paris')>-1) saved='fr';
    else if(lang.startsWith('es')||tz.indexOf('Madrid')>-1||tz.indexOf('Mexico')>-1) saved='es';
    else if(lang.startsWith('ru')||tz.indexOf('Moscow')>-1||tz.indexOf('Petersburg')>-1) saved='ru';
    else saved='en';
    localStorage.setItem('pap-lang',saved);
  }
  setLang(saved);
})();
</script>
