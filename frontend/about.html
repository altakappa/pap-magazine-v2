ko:{about:'ABOUT',contact:'CONTACT',business:'BUSINESS',subscribe:'SUBSCRIBE',submission:'SUBMISSION',pullletter:'PULL-LETTER',aboutTitle:'ABOUT',
body:'<p>PAP 매거진은 2017년 12월에 런칭한 서울과 밀라노를 기반으로 전개되는 글로벌 디지털 매거진으로, 아트를 기반으로 패션, 뷰티, 그리고 컬처 전반을 다루는 미디어 플랫폼입니다. 단순한 트렌드 전달을 넘어, 시각적 언어와 이미지, 그리고 서사를 통해 동시대 문화를 해석하고 재구성하는 데 집중하고 있습니다.</p><p>PAP는 패션을 하나의 산업이나 스타일에 국한하지 않고, 예술적 표현의 확장된 형태로 바라보고 있습니다. 브랜드, 디자이너, 아티스트가 가진 고유한 세계관을 깊이 있게 분석하고, 이를 감각적인 비주얼과 콘텐츠로 풀어내어 하나의 완성도 높은 이미지로 구현하고 있습니다. 이러한 접근을 통해 기존의 정보 전달 중심 매거진과는 차별화된, 하나의 \'작품\'으로서 소비되는 에디토리얼을 제작하고 있습니다.</p><p>또한 PAP는 패션과 뷰티를 중심으로 음악, 서브컬처, 현대 미술 등 다양한 문화적 요소를 유기적으로 연결하고 있습니다. 서로 다른 영역 간의 경계를 허물고 새로운 맥락을 만들어내며, 콘텐츠를 통해 하나의 문화적 흐름을 제안하는 것을 지향하고 있습니다.</p><p>매거진의 역할에 머무르지 않고, PAP는 크리에이티브 스튜디오로서의 기능도 함께 수행하고 있습니다. 글로벌 브랜드와의 협업을 통해 에디토리얼, 캠페인, 영상 콘텐츠를 제작하며, 브랜드의 아이덴티티를 PAP만의 시선으로 재해석하고 있습니다. 이를 통해 브랜드가 전달하고자 하는 메시지를 보다 직관적이고 강력한 이미지로 구현하고 있습니다.</p><p>특히 서울과 밀라노를 축으로, 아시아와 유럽의 감각이 교차하는 지점을 포착하고 있습니다. 빠르게 변화하는 글로벌 트렌드 속에서 PAP는 흐름을 단순히 반영하는 것을 넘어, 새로운 방향성과 시각을 제시하는 플랫폼으로 자리하고 있습니다. 이러한 이중적인 시선은 PAP만의 차별화된 정체성을 형성하며, 국제적인 네트워크와 협업을 기반으로 콘텐츠의 확장성을 지속적으로 넓혀가고 있습니다.</p><p>결과적으로 PAP는 단순한 매거진을 넘어, 아트를 기반으로 패션, 뷰티, 컬처를 연결하는 커뮤니티 플랫폼이자, 동시대의 감각을 시각적으로 기록하고 제안하는 미디어로 기능하고 있습니다.</p>',

en:{about:'ABOUT',contact:'CONTACT',business:'BUSINESS',subscribe:'SUBSCRIBE',submission:'SUBMISSION',pullletter:'PULL-LETTER',aboutTitle:'ABOUT',
body:'<p>PAP Magazine is a global digital magazine launched in December 2017, based in Seoul and Milan, serving as a media platform that covers fashion, beauty, and culture through the lens of art. Going beyond simple trend reporting, PAP focuses on interpreting and reconstructing contemporary culture through visual language, imagery, and narrative.</p><p>PAP views fashion not as confined to a single industry or style, but as an expanded form of artistic expression. By deeply analyzing the unique worldviews of brands, designers, and artists, PAP translates them into sensory visuals and content, realizing them as highly refined images. Through this approach, PAP creates editorials that are consumed as works of art, differentiated from conventional information-driven magazines.</p><p>Furthermore, PAP organically connects diverse cultural elements such as music, subculture, and contemporary art, centered around fashion and beauty. By breaking down boundaries between different domains and creating new contexts, PAP aims to propose a cultural movement through its content.</p><p>Beyond its role as a magazine, PAP also functions as a creative studio. Through collaborations with global brands, PAP produces editorials, campaigns, and video content, reinterpreting brand identities through its unique perspective. This enables brands to convey their messages through more intuitive and powerful imagery.</p><p>With Seoul and Milan as its axes, PAP captures the intersection where Asian and European sensibilities meet. In the rapidly changing global trend landscape, PAP positions itself as a platform that goes beyond simply reflecting trends to present new directions and perspectives. This dual vision forms PAP\'s distinctive identity, continuously expanding the reach of its content through international networks and collaborations.</p><p>Ultimately, PAP transcends the boundaries of a simple magazine, functioning as a community platform connecting fashion, beauty, and culture through art, and as a media that visually documents and proposes the sensibilities of our time.</p>',
ft:'<strong>ALTAKAPPA Co., Ltd.</strong> | CEO : Domenico Kang | Reg. 192-88-02644<br>1F, 18, Nonhyeon-ro 146-gil, Gangnam-gu, Seoul, Korea | <a href="mailto:contact@pap-magazine.com">contact@pap-magazine.com</a>'},
it:{about:'CHI SIAMO',contact:'CONTATTI',business:'BUSINESS',subscribe:'ABBONATI',aboutTitle:'CHI SIAMO',
body:'<p>PAP Magazine è una rivista digitale globale lanciata nel dicembre 2017, con sede a Seoul e Milano, che funge da piattaforma mediatica che copre moda, bellezza e cultura attraverso la lente dell\'arte. Andando oltre la semplice comunicazione delle tendenze, PAP si concentra sull\'interpretazione e ricostruzione della cultura contemporanea attraverso il linguaggio visivo, le immagini e la narrativa.</p><p>PAP vede la moda non come confinata a un singolo settore o stile, ma come una forma espansa di espressione artistica. Analizzando in profondità le visioni uniche di brand, designer e artisti, PAP le traduce in visual sensoriali e contenuti, realizzandoli come immagini altamente raffinate. Attraverso questo approccio, PAP crea editoriali che vengono fruiti come opere d\'arte, differenziandosi dalle riviste convenzionali orientate all\'informazione.</p><p>Inoltre, PAP collega organicamente diversi elementi culturali come musica, sottocultura e arte contemporanea, incentrati su moda e bellezza. Abbattendo i confini tra diversi ambiti e creando nuovi contesti, PAP mira a proporre un movimento culturale attraverso i suoi contenuti.</p><p>Oltre al suo ruolo di rivista, PAP funziona anche come studio creativo. Attraverso collaborazioni con brand globali, PAP produce editoriali, campagne e contenuti video, reinterpretando le identità dei brand attraverso la sua prospettiva unica.</p><p>Con Seoul e Milano come assi, PAP cattura l\'intersezione dove le sensibilità asiatiche ed europee si incontrano. Nel panorama delle tendenze globali in rapida evoluzione, PAP si posiziona come una piattaforma che va oltre il semplice riflesso delle tendenze per presentare nuove direzioni e prospettive.</p><p>In definitiva, PAP trascende i confini di una semplice rivista, funzionando come piattaforma comunitaria che collega moda, bellezza e cultura attraverso l\'arte, e come media che documenta e propone visivamente le sensibilità del nostro tempo.</p>',
ft:'<strong>ALTAKAPPA Co., Ltd.</strong> | CEO : Domenico Kang | P. IVA: 192-88-02644<br>1F, 18, Nonhyeon-ro 146-gil, Gangnam-gu, Seoul, Corea | <a href="mailto:contact@pap-magazine.com">contact@pap-magazine.com</a>'},
fr:{about:'À PROPOS',contact:'CONTACT',business:'BUSINESS',subscribe:"S'ABONNER",aboutTitle:'À PROPOS',
body:'<p>PAP Magazine est un magazine numérique mondial lancé en décembre 2017, basé à Séoul et Milan, servant de plateforme médiatique couvrant la mode, la beauté et la culture à travers le prisme de l\'art. Au-delà de la simple transmission des tendances, PAP se concentre sur l\'interprétation et la reconstruction de la culture contemporaine à travers le langage visuel, l\'imagerie et le récit.</p><p>PAP considère la mode non pas comme confinée à une seule industrie ou un seul style, mais comme une forme élargie d\'expression artistique. En analysant en profondeur les visions uniques des marques, designers et artistes, PAP les traduit en visuels sensoriels et en contenus, les réalisant comme des images hautement raffinées. À travers cette approche, PAP crée des éditoriaux qui sont consommés comme des œuvres d\'art, se différenciant des magazines conventionnels axés sur l\'information.</p><p>De plus, PAP relie organiquement divers éléments culturels tels que la musique, la sous-culture et l\'art contemporain, centrés autour de la mode et de la beauté. En brisant les frontières entre différents domaines et en créant de nouveaux contextes, PAP vise à proposer un mouvement culturel à travers son contenu.</p><p>Au-delà de son rôle de magazine, PAP fonctionne également comme un studio créatif. À travers des collaborations avec des marques mondiales, PAP produit des éditoriaux, des campagnes et des contenus vidéo, réinterprétant les identités des marques à travers sa perspective unique.</p><p>Avec Séoul et Milan comme axes, PAP capture l\'intersection où les sensibilités asiatiques et européennes se rencontrent. Dans un paysage de tendances mondiales en rapide évolution, PAP se positionne comme une plateforme qui va au-delà du simple reflet des tendances pour présenter de nouvelles directions et perspectives.</p><p>En fin de compte, PAP transcende les limites d\'un simple magazine, fonctionnant comme une plateforme communautaire reliant mode, beauté et culture à travers l\'art, et comme un média qui documente et propose visuellement les sensibilités de notre époque.</p>',

es:{about:'ACERCA DE',contact:'CONTACTO',business:'NEGOCIOS',subscribe:'SUSCRIBIRSE',aboutTitle:'ACERCA DE',
body:'<p>PAP Magazine es una revista digital global lanzada en diciembre de 2017, con sede en Seúl y Milán, que funciona como una plataforma mediática que cubre moda, belleza y cultura a través del prisma del arte. Más allá de la simple transmisión de tendencias, PAP se enfoca en interpretar y reconstruir la cultura contemporánea a través del lenguaje visual, la imagen y la narrativa.</p><p>PAP ve la moda no como algo confinado a una sola industria o estilo, sino como una forma expandida de expresión artística. Al analizar profundamente las visiones únicas de marcas, diseñadores y artistas, PAP las traduce en visuales sensoriales y contenido, realizándolas como imágenes altamente refinadas. A través de este enfoque, PAP crea editoriales que se consumen como obras de arte, diferenciándose de las revistas convencionales orientadas a la información.</p><p>Además, PAP conecta orgánicamente diversos elementos culturales como música, subcultura y arte contemporáneo, centrados en la moda y la belleza. Al derribar fronteras entre diferentes ámbitos y crear nuevos contextos, PAP busca proponer un movimiento cultural a través de su contenido.</p><p>Más allá de su papel como revista, PAP también funciona como estudio creativo. A través de colaboraciones con marcas globales, PAP produce editoriales, campañas y contenido de video, reinterpretando las identidades de marca a través de su perspectiva única.</p><p>Con Seúl y Milán como ejes, PAP captura la intersección donde las sensibilidades asiáticas y europeas se encuentran. En el panorama de tendencias globales en rápida evolución, PAP se posiciona como una plataforma que va más allá de simplemente reflejar tendencias para presentar nuevas direcciones y perspectivas.</p><p>En última instancia, PAP trasciende los límites de una simple revista, funcionando como una plataforma comunitaria que conecta moda, belleza y cultura a través del arte, y como un medio que documenta y propone visualmente las sensibilidades de nuestro tiempo.</p>',

ja:{about:'ABOUT',contact:'CONTACT',business:'BUSINESS',subscribe:'SUBSCRIBE',submission:'SUBMISSION',pullletter:'PULL-LETTER',aboutTitle:'ABOUT',
body:'<p>PAPマガジンは2017年12月にローンチした、ソウルとミラノを拠点に展開するグローバルデジタルマガジンであり、アートを基盤にファッション、ビューティー、そしてカルチャー全般を扱うメディアプラットフォームです。単純なトレンド伝達を超え、視覚的言語とイメージ、そしてナラティブを通じて同時代の文化を解釈し再構成することに集中しています。</p><p>PAPはファッションを一つの産業やスタイルに限定せず、芸術的表現の拡張された形態として捉えています。ブランド、デザイナー、アーティストが持つ固有の世界観を深く分析し、これを感覚的なビジュアルとコンテンツで表現し、完成度の高いイメージとして具現化しています。このアプローチにより、従来の情報伝達中心のマガジンとは差別化された、一つの「作品」として消費されるエディトリアルを制作しています。</p><p>またPAPはファッションとビューティーを中心に、音楽、サブカルチャー、現代美術など多様な文化的要素を有機的に結びつけています。異なる領域間の境界を取り払い、新たな文脈を生み出し、コンテンツを通じて一つの文化的な流れを提案することを目指しています。</p><p>マガジンの役割にとどまらず、PAPはクリエイティブスタジオとしての機能も果たしています。グローバルブランドとのコラボレーションを通じてエディトリアル、キャンペーン、映像コンテンツを制作し、ブランドのアイデンティティをPAP独自の視点で再解釈しています。</p><p>特にソウルとミラノを軸に、アジアとヨーロッパの感覚が交差するポイントを捉えています。急速に変化するグローバルトレンドの中で、PAPは流れを単に反映するのではなく、新しい方向性と視点を提示するプラットフォームとして位置づけられています。</p><p>結果として、PAPは単なるマガジンを超え、アートを基盤にファッション、ビューティー、カルチャーを結ぶコミュニティプラットフォームであり、同時代の感覚を視覚的に記録し提案するメディアとして機能しています。</p>',

body:'<p>PAP杂志是2017年12月创刊的、以首尔和米兰为基地展开的全球数字杂志，是以艺术为基础涵盖时尚、美容及文化全领域的媒体平台。超越简单的潮流传递，PAP专注于通过视觉语言、影像和叙事来解读和重构当代文化。</p><p>PAP不将时尚局限于单一产业或风格，而是将其视为艺术表达的扩展形式。通过深入分析品牌、设计师和艺术家所拥有的独特世界观，将其转化为感性的视觉和内容，实现为高度完成的影像。通过这种方式，PAP制作出有别于传统信息传递型杂志、作为"作品"被消费的时尚大片。</p><p>此外，PAP以时尚和美容为中心，有机地连接音乐、亚文化、当代艺术等多种文化元素。通过打破不同领域之间的界限、创造新的语境，致力于通过内容提出一种文化潮流。</p><p>不仅局限于杂志的角色，PAP同时也作为创意工作室发挥功能。通过与全球品牌的合作制作时尚大片、广告活动和视频内容，以PAP独特的视角重新诠释品牌身份。</p><p>特别是以首尔和米兰为轴心，捕捉亚洲和欧洲感性交汇的节点。在快速变化的全球趋势中，PAP不仅仅反映潮流，而是作为提出新方向和视角的平台而定位。这种双重视角形成了PAP独特的差异化身份，并以国际网络和合作为基础持续拓展内容的延展性。</p><p>最终，PAP超越了简单杂志的范畴，作为以艺术为基础连接时尚、美容和文化的社区平台，以及视觉记录和提出当代感性的媒体而运作。</p>',
ft:'<strong>ALTAKAPPA Co., Ltd.</strong> | CEO : Domenico Kang | 营业执照号 192-88-02644<br>首尔特别市江南区论岘路146街18, 1F | <a href="mailto:contact@pap-magazine.com">contact@pap-magazine.com</a>'},ru:{business:'БИЗНЕС',about:'О НАС',contact:'КОНТАКТ',subscribe:'ПОДПИСКА',submission:'ПОДАЧА',pullletter:'PULL-LETTER',aboutTitle:'О НАС',
body:'<p>PAP Magazine — это глобальный цифровой журнал, запущенный в декабре 2017 года, базирующийся в Сеуле и Милане. Это медиа-платформа, охватывающая моду, красоту и культуру через призму искусства.</p><p>PAP рассматривает моду не как ограниченную одной индустрией или стилем, а как расширенную форму художественного выражения. Глубоко анализируя уникальные мировоззрения брендов, дизайнеров и художников, PAP переводит их в чувственные визуальные образы и контент.</p><p>Помимо своей роли журнала, PAP также функционирует как креативная студия, сотрудничая с мировыми брендами для создания редакционных материалов, кампаний и видеоконтента.</p>',

function setLang(l){localStorage.setItem('pap-lang',l);var d=L[l]||L.ko;document.querySelectorAll('[data-i18n]').forEach(function(e){var k=e.getAttribute('data-i18n');if(d[k])e.textContent=d[k];});document.getElementById('aboutBody').innerHTML=d.body;document.getElementById('footerLegal').innerHTML=d.ft;document.getElementById('langSelect').value=l;}
// AUTO LANGUAGE DETECTION
(function(){
  var saved=localStorage.getItem('pap-lang');
  if(!saved){
    var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
    var lang=navigator.language||navigator.userLanguage||'';
    lang=lang.toLowerCase();
    if(lang.startsWith('ko')||tz.indexOf('Seoul')>-1) saved='ko';
    else if(lang.startsWith('ja')||tz.indexOf('Tokyo')>-1) saved='ja';
    else if(lang.startsWith('zh')||tz.indexOf('Shanghai')>-1||tz.indexOf('Beijing')>-1||tz.indexOf('Chongqing')>-1||tz.indexOf('Hong_Kong')>-1||tz.indexOf('Taipei')>-1) saved='zh';
    else if(lang.startsWith('it')||tz.indexOf('Rome')>-1) saved='it';
    else if(lang.startsWith('fr')||tz.indexOf('Paris')>-1) saved='fr';
    else if(lang.startsWith('es')||tz.indexOf('Madrid')>-1||tz.indexOf('Mexico')>-1) saved='es';
    else if(lang.startsWith('ru')||tz.indexOf('Moscow')>-1||tz.indexOf('Petersburg')>-1) saved='ru';
    else saved='en';
    localStorage.setItem('pap-lang',saved);
  }
  setLang(saved);
})();
</script>
