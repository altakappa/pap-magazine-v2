name: harness-integration

# Runs the harness layout / cross-module integration test on every push and PR.
# The test (tests/harness-integration.test.js) catches regressions like:
#   - module renamed but HTML script tag missed
#   - module added but load order wrong
#   - public surface accidentally removed
#   - cross-module reference broken
#
# After the integration job passes on push to main, a second job runs the
# production smoke test (tests/production-smoke.test.js) which polls Vercel
# until deploy is ready, then verifies every module is actually being served
# at www.pap-magazine.com with its canonical marker.

on:
  push:
    branches: [main, harness-refactor]
  pull_request:
    branches: [main]

jobs:
  test:
    name: vm integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          # 2026-08-12 — 20 → 22. @supabase/supabase-js 2.110 계열은 engines
          # node>=22 이고, 실제로 Node 20 에서는 로드 자체가 안 된다:
          #   "Node.js detected but native WebSocket not found."
          # (realtime-js 가 전역 WebSocket 을 쓰는데 Node 22 부터 있다)
          # 그래서 api/_lib/supabase.js 를 require 하는 테스트가 CI 에서만 죽었다.
          # 라이브(Vercel)는 Node 24.x 라 영향 없었다 — CI 만 뒤처져 있었다.
          # tests/ci-node-version.test.js 가 이 값을 의존성 요구치와 맞춰 지킨다.
          node-version: '22'
          cache: 'npm'
      # 2026-07-30 추가. 그전까지 이 잡은 node_modules 없이 npm test 를 돌렸고,
      # 하네스 테스트가 npm 패키지를 건드리지 않는 동안은 우연히 통과했다.
      # 그러다 크론 하나를 withCronGuard 로 감싼 순간
      #   cronGuard → email → nodemailer / cronGuard → telegram → brandImage → sharp
      # 체인이 생겨 CI 에서만 MODULE_NOT_FOUND 로 죽었다(로컬은 node_modules 가
      # 있어 통과 — 가장 나쁜 종류의 차이다). 의존성을 실제로 설치해 이 유형을 없앤다.
      # 1차 방어선은 tests/no-eager-npm-deps.test.js (커밋 전 로컬에서 걸린다).
      - name: install deps
        run: npm ci
      - name: run harness integration test
        run: npm test

  smoke:
    name: production smoke test
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: wait for Vercel deploy + verify production
        run: npm run smoke
